<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>

<title>Renewals - VitaLink CRM</title>

<link rel="stylesheet" href="crm.css">

</head>

<body>

<!-- =========================================
     SIDEBAR
========================================= -->

<div class="sidebar">

  <a href="index.html">
    <img src="../images/vitalink-logo.png" class="logo">
  </a>

  <div class="nav-section">

    <div class="nav-title">Dashboard</div>

    <a href="index.html">
      <div class="nav-item">📊 Dashboard</div>
    </a>

    <a href="clients.html">
      <div class="nav-item">👥 Clients</div>
    </a>

    <a href="schedule.html">
      <div class="nav-item active">📅 Schedule</div>
    </a>

    <a href="tasks.html">
      <div class="nav-item">⏰ Tasks</div>
    </a>

  </div>

  <div class="nav-section">

    <div class="nav-title">VitaLink</div>

    <a href="linked-profiles.html">
      <div class="nav-item">📱 Linked Profiles</div>
    </a>

    <a href="notifications.html">
      <div class="nav-item">🔔 Notifications</div>
    </a>

    <a href="exports.html">
      <div class="nav-item">📤 Exports</div>
    </a>

  </div>

  <div class="nav-section">

    <div class="nav-title">Account</div>

    <a href="settings.html">
      <div class="nav-item">⚙ Settings</div>
    </a>

    <a href="billing.html">
      <div class="nav-item">💳 Billing</div>
    </a>

  </div>

  <!-- LOGOUT -->

  <div class="sidebar-footer">

    <button
      class="logout-btn"
      onclick="logout()"
    >
      Logout
    </button>

  </div>

</div>

<!-- =========================================
     MAIN
========================================= -->

<div class="main">

  <!-- TOPBAR -->

  <div class="topbar">

    <div>

      <h1>Schedule & Calendar</h1>

      <div style="color:#6b7280;">
        Manage appointments, follow-ups, annual reviews, and client reminders.
      </div>

    </div>

    <button>
      + New Appointment
    </button>

  </div>

  <!-- METRICS -->

  <div class="renewal-grid">

    <div class="renewal-card">

      <div class="metric" id="appointmentsToday">
        0
      </div>

      <div class="client-sub">
        Appointments Today
      </div>

    </div>

    <div class="renewal-card">

      <div class="metric" id="upcomingAppointments">
        0
      </div>

      <div class="client-sub">
        Upcoming Follow-Ups
      </div>

    </div>

    <div class="renewal-card">

      <div class="metric" id="weeklyReviews">
        0
      </div>

      <div class="client-sub">
        Annual Reviews This Week
      </div>

    </div>

  </div>

  <!-- FILTERS -->

  <div class="filter-card">

    <div class="filter-row">

      <input
        type="text"
        placeholder="Search appointments..."
      >

      <select>
        <option>All Types</option>
        <option>Annual Review</option>
        <option>Follow-Up</option>
        <option>Enrollment Meeting</option>
        <option>T65 Consultation</option>
      </select>

      <select>
        <option>This Week</option>
        <option>Today</option>
        <option>This Month</option>
      </select>

    </div>

  </div>

  <!-- SCHEDULE -->

  <div
    class="renewal-grid"
    id="appointmentsGrid"
  >
  </div>

</div>

<script src="crm.js"></script>
<script src="schedule.js"></script>

</body>
</html>
