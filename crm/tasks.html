<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>

<title>Tasks - VitaLink CRM</title>

<link rel="stylesheet" href="crm.css">


</head>

<body>



<!-- =========================================
     SIDEBAR
========================================= -->

<div class="sidebar">

  <a href="index.html">
    <img src="../images/vitalink-logo.png" class="logo">
  </a>

  <div class="nav-section">

    <div class="nav-title">Dashboard</div>

    <a href="index.html">
      <div class="nav-item">📊 Dashboard</div>
    </a>

    <a href="clients.html">
      <div class="nav-item">👥 Clients</div>
    </a>

    <a href="schedule.html">
      <div class="nav-item">📅 Schedule</div>
    </a>

    <a href="tasks.html">
      <div class="nav-item active">⏰ Tasks</div>
    </a>

  </div>

  <div class="nav-section">

    <div class="nav-title">VitaLink</div>

    <a href="linked-profiles.html">
      <div class="nav-item">📱 Linked Profiles</div>
    </a>

    <a href="notifications.html">
      <div class="nav-item">🔔 Notifications</div>
    </a>

    <a href="exports.html">
      <div class="nav-item">📤 Exports</div>
    </a>

  </div>

  <div class="nav-section">

    <div class="nav-title">Account</div>

    <a href="settings.html">
      <div class="nav-item">⚙ Settings</div>
    </a>

    <a href="billing.html">
      <div class="nav-item">💳 Billing</div>
    </a>

  </div>

  <!-- LOGOUT -->

  <div
    style="
      position:absolute;
      bottom:24px;
      left:18px;
      right:18px;
    "
  >

    <button
      onclick="logout()"
      style="
        width:100%;
        background:#ef4444;
        color:#fff;
        border:none;
        padding:12px;
        border-radius:10px;
        font-weight:700;
        cursor:pointer;
      "
    >
      Logout
    </button>

  </div>

</div>

<!-- =========================================
     MAIN
========================================= -->

<div class="main">

  <!-- TOPBAR -->

  <div class="topbar">

    <div>

      <h1>Tasks</h1>

      <div style="color:#6b7280;">
        Manage follow-ups, paperwork, reminders, and unresolved client items.
      </div>

    </div>

    <button onclick="openTaskModal()">
      + Add Task
    </button>

  </div>

  <!-- FILTERS -->

  <div class="filter-card">

    <div class="filter-row">

      <input
        id="taskSearch"
        type="text"
        placeholder="Search tasks or clients..."
      >

      <select id="priorityFilter">

        <option value="">All Priorities</option>
        <option value="High">High</option>
        <option value="Medium">Medium</option>
        <option value="Complete">Completed</option>

      </select>

    </div>

  </div>

  <!-- TASK TABLE -->

  <div class="table-card">

    <table>

      <thead>

        <tr>
          <th>Priority</th>
          <th>Task</th>
          <th>Client</th>
          <th>Due Date</th>
          <th>Status</th>
          <th>Actions</th>
        </tr>

      </thead>

      <tbody id="tasksTable">
      </tbody>

    </table>

  </div>

</div>

<!-- =========================================
     ADD TASK MODAL
========================================= -->

<div
  id="taskModal"
  class="modal-overlay"
>

  <div class="modal">

    <div class="modal-header">

      <h2>Add Task</h2>

      <button
        class="close-btn"
        onclick="closeTaskModal()"
      >
        ✕
      </button>

    </div>

    <div class="modal-grid">

      <input
        id="taskTitle"
        type="text"
        placeholder="Task Title"
      >

      <select id="taskPriority">

        <option>High</option>
        <option>Medium</option>
        <option>Complete</option>

      </select>

      <input
        id="taskClient"
        type="text"
        placeholder="Client Name"
      >

      <input
        id="taskDueDate"
        type="date"
      >

      <input
        id="taskStatus"
        type="text"
        placeholder="Status"
        style="grid-column:1/3;"
      >

    </div>

    <button
      onclick="saveTask()"
      style="
        margin-top:20px;
        width:100%;
      "
    >
      Save Task
    </button>

  </div>

</div>

<script src="crm.js"></script>
<script src="tasks.js"></script>

</body>

</html>
