<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>

<title>Tasks - VitaLink CRM</title>

<style>

:root{
  --bg:#f4f5f7;
  --card:#ffffff;
  --border:#e5e7eb;
  --text:#111827;
  --muted:#6b7280;
  --accent:#7cc6e8;
  --accent-dark:#58b6df;
  --shadow:0 4px 18px rgba(0,0,0,0.08);
}

*{
  box-sizing:border-box;
}

body{
  margin:0;
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  background:var(--bg);
  color:var(--text);
}

a{
  text-decoration:none;
  color:inherit;
}

/* =========================================
   SIDEBAR
========================================= */

.sidebar{
  position:fixed;
  top:0;
  left:0;
  width:250px;
  height:100vh;
  background:#0f172a;
  color:#fff;
  padding:24px 18px;
  overflow-y:auto;
}

.logo{
  width:100%;
  max-width:180px;
  display:block;
  margin:0 auto 35px auto;
}

.nav-section{
  margin-bottom:30px;
}

.nav-title{
  font-size:.78rem;
  color:#94a3b8;
  text-transform:uppercase;
  letter-spacing:1px;
  margin-bottom:12px;
}

.nav-item{
  padding:12px 14px;
  border-radius:10px;
  margin-bottom:8px;
  cursor:pointer;
  transition:.2s;
}

.nav-item:hover{
  background:rgba(124,198,232,0.12);
}

.nav-item.active{
  background:rgba(124,198,232,0.18);
  color:var(--accent);
  font-weight:600;
}

/* =========================================
   MAIN
========================================= */

.main{
  margin-left:250px;
  padding:28px;
}

.topbar{
  display:flex;
  justify-content:space-between;
  align-items:center;
  margin-bottom:28px;
}

.topbar h1{
  margin:0;
  font-size:2rem;
}

button{
  border:none;
  background:var(--accent);
  color:#000;
  padding:11px 18px;
  border-radius:10px;
  cursor:pointer;
  font-weight:600;
  transition:.2s;
  white-space:nowrap;
}

button:hover{
  opacity:.9;
}

.secondary-btn{
  background:#fff;
  border:1px solid var(--border);
  color:#111827;
}

/* =========================================
   FILTERS
========================================= */

.filter-card{
  background:#fff;
  border-radius:18px;
  border:1px solid var(--border);
  padding:18px;
  margin-bottom:24px;
  box-shadow:var(--shadow);
}

.filter-row{
  display:flex;
  gap:14px;
  flex-wrap:wrap;
}

input, select{
  padding:12px 14px;
  border-radius:10px;
  border:1px solid #d1d5db;
  font-size:.95rem;
  flex:1;
  min-width:180px;
}

/* =========================================
   TASK TABLE
========================================= */

.table-card{
  background:#fff;
  border-radius:18px;
  border:1px solid var(--border);
  overflow:hidden;
  box-shadow:var(--shadow);
}

table{
  width:100%;
  border-collapse:separate;
  border-spacing:0 10px;
}

thead{
  background:transparent;
}

th{
  text-align:left;
  padding:12px;
  font-size:.9rem;
  color:#475569;
}

td{
  padding:14px 12px;
  vertical-align:middle;
  background:#fff;
}

tbody tr{
  box-shadow:var(--shadow);
  border-radius:12px;
}

.badge{
  display:inline-block;
  padding:6px 12px;
  border-radius:999px;
  font-size:.8rem;
  font-weight:600;
}

.high{
  background:#fee2e2;
  color:#991b1b;
}

.medium{
  background:#fef3c7;
  color:#92400e;
}

.complete{
  background:#dcfce7;
  color:#166534;
}

/* =========================================
   MODAL
========================================= */

.modal-overlay{
  position:fixed;
  inset:0;
  background:rgba(0,0,0,0.45);
  display:none;
  align-items:center;
  justify-content:center;
  z-index:999;
}

.modal{
  background:#fff;
  width:90%;
  max-width:700px;
  border-radius:18px;
  padding:24px;
  box-shadow:var(--shadow);
}

.modal-header{
  display:flex;
  justify-content:space-between;
  align-items:center;
  margin-bottom:20px;
}

.modal-grid{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:14px;
}

.close-btn{
  background:none;
  border:none;
  font-size:1.2rem;
  cursor:pointer;
}

/* =========================================
   RESPONSIVE
========================================= */

@media(max-width:900px){

  .sidebar{
    width:100%;
    height:auto;
    position:relative;
  }

  .main{
    margin-left:0;
  }

  .topbar{
    flex-direction:column;
    align-items:flex-start;
    gap:16px;
  }

}

</style>
</head>

<body>

<script>

if(!sessionStorage.getItem("crm_uuid")){

  window.location = "login.html";

}

</script>

<!-- =========================================
     SIDEBAR
========================================= -->

<div class="sidebar">

  <a href="index.html">
    <img src="../images/vitalink-logo.png" class="logo">
  </a>

  <div class="nav-section">

    <div class="nav-title">Dashboard</div>

    <a href="index.html">
      <div class="nav-item">📊 Dashboard</div>
    </a>

    <a href="clients.html">
      <div class="nav-item">👥 Clients</div>
    </a>

    <a href="schedule.html">
      <div class="nav-item">📅 Schedule</div>
    </a>

    <a href="tasks.html">
      <div class="nav-item active">⏰ Tasks</div>
    </a>

  </div>

  <div class="nav-section">

    <div class="nav-title">VitaLink</div>

    <a href="linked-profiles.html">
      <div class="nav-item">📱 Linked Profiles</div>
    </a>

    <a href="notifications.html">
      <div class="nav-item">🔔 Notifications</div>
    </a>

    <a href="exports.html">
      <div class="nav-item">📤 Exports</div>
    </a>

  </div>

  <div class="nav-section">

    <div class="nav-title">Account</div>

    <a href="settings.html">
      <div class="nav-item">⚙ Settings</div>
    </a>

    <a href="billing.html">
      <div class="nav-item">💳 Billing</div>
    </a>

  </div>

  <!-- LOGOUT -->

  <div
    style="
      position:absolute;
      bottom:24px;
      left:18px;
      right:18px;
    "
  >

    <button
      onclick="logout()"
      style="
        width:100%;
        background:#ef4444;
        color:#fff;
        border:none;
        padding:12px;
        border-radius:10px;
        font-weight:700;
        cursor:pointer;
      "
    >
      Logout
    </button>

  </div>

</div>

<!-- =========================================
     MAIN
========================================= -->

<div class="main">

  <!-- TOPBAR -->

  <div class="topbar">

    <div>

      <h1>Tasks</h1>

      <div style="color:#6b7280;">
        Manage follow-ups, paperwork, reminders, and unresolved client items.
      </div>

    </div>

    <button onclick="openTaskModal()">
      + Add Task
    </button>

  </div>

  <!-- FILTERS -->

  <div class="filter-card">

    <div class="filter-row">

      <input
        id="taskSearch"
        type="text"
        placeholder="Search tasks or clients..."
      >

      <select id="priorityFilter">

        <option value="">All Priorities</option>
        <option value="High">High</option>
        <option value="Medium">Medium</option>
        <option value="Complete">Completed</option>

      </select>

    </div>

  </div>

  <!-- TASK TABLE -->

  <div class="table-card">

    <table>

      <thead>

        <tr>
          <th>Priority</th>
          <th>Task</th>
          <th>Client</th>
          <th>Due Date</th>
          <th>Status</th>
          <th>Actions</th>
        </tr>

      </thead>

      <tbody id="tasksTable">
      </tbody>

    </table>

  </div>

</div>

<!-- =========================================
     ADD TASK MODAL
========================================= -->

<div
  id="taskModal"
  class="modal-overlay"
>

  <div class="modal">

    <div class="modal-header">

      <h2>Add Task</h2>

      <button
        class="close-btn"
        onclick="closeTaskModal()"
      >
        ✕
      </button>

    </div>

    <div class="modal-grid">

      <input
        id="taskTitle"
        type="text"
        placeholder="Task Title"
      >

      <select id="taskPriority">

        <option>High</option>
        <option>Medium</option>
        <option>Complete</option>

      </select>

      <input
        id="taskClient"
        type="text"
        placeholder="Client Name"
      >

      <input
        id="taskDueDate"
        type="date"
      >

      <input
        id="taskStatus"
        type="text"
        placeholder="Status"
        style="grid-column:1/3;"
      >

    </div>

    <button
      onclick="saveTask()"
      style="
        margin-top:20px;
        width:100%;
      "
    >
      Save Task
    </button>

  </div>

</div>

<script>

function logout(){

  sessionStorage.clear();

  window.location.href = "login.html";

}

/* =========================================
   MODAL
========================================= */

function openTaskModal(){

  document.getElementById(
    "taskModal"
  ).style.display = "flex";

}

function closeTaskModal(){

  document.getElementById(
    "taskModal"
  ).style.display = "none";

}

/* =========================================
   SAVE TASK
========================================= */

async function saveTask(){

  const task = {

    title:
      document.getElementById("taskTitle").value,

    priority:
      document.getElementById("taskPriority").value,

    client_name:
      document.getElementById("taskClient").value,

    due_date:
      document.getElementById("taskDueDate").value,

    status:
      document.getElementById("taskStatus").value,

    agent_id:
      sessionStorage.getItem("crm_uuid")

  };

  console.log(task);

  // TODO:
  // Replace with real backend endpoint later

  alert("Task saved.");

  closeTaskModal();

  loadTasks();

}

/* =========================================
   LOAD TASKS
========================================= */

async function loadTasks(){

  // TEMP REALISTIC PLACEHOLDER
  // replace with DB later

  const tasks = [

    {
      id:1,
      priority:"High",
      title:"Review Drug Coverage",
      client_name:"John Smith",
      due_date:"2026-05-15",
      status:"Needs Review"
    },

    {
      id:2,
      priority:"Medium",
      title:"Call About Billing Question",
      client_name:"Mary Johnson",
      due_date:"2026-06-01",
      status:"Pending"
    },

    {
      id:3,
      priority:"Complete",
      title:"Initial Medicare Consultation",
      client_name:"Robert Wilson",
      due_date:"2026-04-12",
      status:"Completed"
    }

  ];

  const table =
    document.getElementById("tasksTable");

  table.innerHTML = "";

  tasks.forEach(task => {

    let badgeClass = "medium";

    if(task.priority === "High"){
      badgeClass = "high";
    }

    if(task.priority === "Complete"){
      badgeClass = "complete";
    }

    table.innerHTML += `

      <tr>

        <td>

          <span class="badge ${badgeClass}">
            ${task.priority}
          </span>

        </td>

        <td>
          ${task.title}
        </td>

        <td>
          ${task.client_name}
        </td>

        <td>
          ${task.due_date}
        </td>

        <td>
          ${task.status}
        </td>

        <td>

          <button>
            View
          </button>

          <button
            class="secondary-btn"
            style="margin-left:8px;"
          >
            Complete
          </button>

        </td>

      </tr>

    `;

  });

}

window.onclick = function(event){

  const modal =
    document.getElementById("taskModal");

  if(event.target === modal){

    closeTaskModal();

  }

}

loadTasks();

</script>

</body>

</html>
