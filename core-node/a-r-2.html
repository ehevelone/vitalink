<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>VitaLink — Agent Access</title>
<meta name="robots" content="noindex, nofollow" />

<style>
:root {
  --bg-black:#000000;
  --text-primary:#eaeaea;
  --text-muted:#b5b5b5;
  --accent-blue:#7cc6e8;
  --divider:#1e1e1e;
  --card-bg:#111;
  --danger:#ff5a5a;
}

* { box-sizing:border-box; }

body {
  margin:0;
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  background:var(--bg-black);
  color:var(--text-primary);
}

main {
  max-width:520px;
  margin:0 auto;
  padding:60px 24px;
}

.logo {
  max-width:180px;
  margin:0 auto 40px auto;
  display:block;
}

h1 {
  text-align:center;
  font-size:2rem;
  margin-bottom:10px;
}

.sub {
  text-align:center;
  color:var(--text-muted);
  margin-bottom:36px;
  font-size:0.95rem;
}

.card {
  background:var(--card-bg);
  border:1px solid var(--divider);
  border-radius:12px;
  padding:28px;
}

.field { margin-bottom:18px; }

label {
  display:block;
  font-size:0.85rem;
  margin-bottom:6px;
  color:var(--text-muted);
}

input {
  width:100%;
  padding:12px;
  border-radius:8px;
  border:1px solid var(--divider);
  background:#000;
  color:#fff;
  font-size:0.95rem;
}

button {
  width:100%;
  padding:14px;
  border-radius:999px;
  border:none;
  background:var(--accent-blue);
  color:#000;
  font-weight:600;
  font-size:0.95rem;
  cursor:pointer;
  margin-top:10px;
}

.forgot {
  text-align:center;
  margin-top:14px;
  font-size:0.85rem;
  color:var(--accent-blue);
  cursor:pointer;
}

.forgot:hover { text-decoration:underline; }

.result {
  margin-top:16px;
  text-align:center;
  font-size:0.9rem;
  min-height:22px;
}

.error { color:var(--danger); }

.hidden { display:none; }

/* MODAL */
.modal{
  position:fixed;
  inset:0;
  background:rgba(0,0,0,.8);
  display:none;
  align-items:center;
  justify-content:center;
}

.modal.active{ display:flex; }

.modal-card{
  background:#111;
  padding:24px;
  border-radius:12px;
  width:320px;
  border:1px solid var(--divider);
}

.modal-card h3{
  margin-top:0;
  text-align:center;
}

footer{
  margin-top:60px;
  text-align:center;
  color:#666;
  font-size:0.8rem;
}
</style>

<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
</head>

<body>

<main>

<img src="../images/vitalink-logo-1.png" class="logo" />

<h1>Agent Dashboard</h1>
<div class="sub">Your clients</div>

<div class="card">

<div id="error" class="result error hidden"></div>

<!-- 🔥 REPLACED LOGIN UI WITH CLIENT LIST -->
<div id="clients">Loading clients...</div>

</div>

<footer>
© 2026 VitaLink. All rights reserved.
</footer>

</main>

<!-- RESET MODAL (unchanged) -->
<div id="resetModal" class="modal">
  <div class="modal-card">
    <h3>Reset Password</h3>

    <input id="resetEmail" placeholder="Email" />
    <input id="resetCode" placeholder="Code" />
    <input id="resetPassword" type="password" placeholder="New Password" />

    <button onclick="requestReset()">Send Code</button>
    <button onclick="submitReset()">Reset Password</button>
    <button onclick="closeReset()" style="background:#444;">Cancel</button>
  </div>
</div>

<script>

const API = "https://vitalink-app.netlify.app/.netlify/functions";

firebase.initializeApp({
  apiKey: "AIzaSyCTZiiluPy5ydX62RfM-E7f8EIWHNG12S8",
  authDomain: "vitalink-7e832.firebaseapp.com",
  projectId: "vitalink-7e832",
  storageBucket: "vitalink-7e832.firebasestorage.app",
  messagingSenderId: "776534002769",
  appId: "1:776534002769:web:f2460535613304e12efc70"
});

// ✅ SESSION GUARD
const token = sessionStorage.getItem("agentSessionToken");
const agentId = sessionStorage.getItem("agentId");

console.log("SESSION:", { token, agentId });

if (!token || !agentId){
  window.location.href = "agent-login.html";
}

// ✅ LOAD CLIENTS
async function loadClients(){

  try {

    const res = await fetch(`${API}/get_agent_clients`, {
      method: "POST",
      headers: { "Content-Type":"application/json" },
      body: JSON.stringify({
        agentId: Number(agentId),
        agentSessionToken: token
      })
    });

    const data = await res.json();

    console.log("CLIENT DATA:", data);

    const el = document.getElementById("clients");

    if (!data.clients || data.clients.length === 0){
      el.innerHTML = "No clients found";
      return;
    }

    el.innerHTML = data.clients.map(c => `
      <div style="margin-bottom:12px;">
        <strong>${c.first_name || ""} ${c.last_name || ""}</strong><br/>
        ${c.email || ""}
      </div>
    `).join("");

  } catch (err){
    console.error(err);
    document.getElementById("clients").innerText = "Error loading clients";
  }
}

loadClients();

// ---------------------- RESET (unchanged)
function openReset(){ document.getElementById("resetModal").classList.add("active"); }
function closeReset(){ document.getElementById("resetModal").classList.remove("active"); }

async function requestReset(){
  const email = document.getElementById("resetEmail").value;

  const res = await fetch(`${API}/request_reset`, {
    method:"POST",
    headers:{ "Content-Type":"application/json" },
    body: JSON.stringify({ emailOrPhone: email, role: "agents" })
  });

  const data = await res.json();
  if (data.success) alert("Reset code sent");
}

async function submitReset(){
  const email = document.getElementById("resetEmail").value;
  const code = document.getElementById("resetCode").value;
  const password = document.getElementById("resetPassword").value;

  const res = await fetch(`${API}/reset_password`, {
    method:"POST",
    headers:{ "Content-Type":"application/json" },
    body: JSON.stringify({
      emailOrPhone: email,
      code,
      newPassword: password,
      role: "agents"
    })
  });

  const data = await res.json();
  if (data.success){
    alert("Password reset successful");
    closeReset();
  }
}

</script>

<script src="../site-traffic.js" defer></script>
</body>
</html>
