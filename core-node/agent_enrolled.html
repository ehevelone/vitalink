<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>VitaLink Enrollment Complete</title>

<style>

body{
font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
background:#0c0c0c;
color:#eaeaea;
margin:0;
display:flex;
align-items:center;
justify-content:center;
height:100vh;
}

.container{
text-align:center;
max-width:420px;
padding:40px;
background:#111;
border-radius:12px;
border:1px solid #1e1e1e;
}

h1{
margin-top:0;
}

.code{
margin:20px 0;
font-size:20px;
color:#7cc6e8;
word-break:break-all;
}

button{
display:block;
width:100%;
margin:10px 0;
padding:12px;
border-radius:999px;
border:none;
background:#7cc6e8;
font-weight:600;
cursor:pointer;
}

.store{
margin-top:12px;
}

.store img{
height:55px;
margin:6px 0;
}

</style>
</head>

<body>

<div class="container">

<h1>Enrollment Complete</h1>

<p>Your VitaLink Agent Code:</p>

<div id="agentCode" class="code"></div>

<button onclick="openApp()">Open VitaLink</button>

<div class="store">

<a href="https://apps.apple.com" target="_blank">
<img src="https://developer.apple.com/assets/elements/badges/download-on-the-app-store.svg">
</a>

<a href="https://play.google.com/store/apps" target="_blank">
<img src="https://upload.wikimedia.org/wikipedia/commons/7/78/Google_Play_Store_badge_EN.svg">
</a>

</div>

</div>

<script>

const params = new URLSearchParams(window.location.search);
const code = params.get("code");

/* DISPLAY AGENT CODE */

document.getElementById("agentCode").innerText =
code ? code : "Agent Code Ready";

/* AUTO OPEN APP LIKE QR PAGE */

if(code){

setTimeout(()=>{
window.location.href = `vitalink://activate?code=${code}`;
},1000);

}

/* MANUAL OPEN BUTTON */

function openApp(){

if(!code){
alert("Agent code missing.");
return;
}

window.location.href =
`vitalink://activate?code=${code}`;

}

</script>

</body>
</html>
