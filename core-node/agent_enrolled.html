<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>VitaLink Enrollment Complete</title>

<style>

body{
font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
background:#0c0c0c;
color:#eaeaea;
margin:0;
display:flex;
align-items:center;
justify-content:center;
height:100vh;
}

.container{
text-align:center;
max-width:420px;
padding:40px;
background:#111;
border-radius:12px;
border:1px solid #1e1e1e;
}

h1{
margin-top:0;
}

.code{
margin:20px 0;
font-size:20px;
color:#7cc6e8;
word-break:break-all;
}

.button{
display:block;
width:100%;
margin:10px 0;
padding:12px;
border-radius:999px;
border:none;
background:#7cc6e8;
font-weight:600;
cursor:pointer;
text-decoration:none;
color:black;
}

.store{
margin-top:12px;
}

.store img{
height:55px;
margin:6px 0;
}

</style>
</head>

<body>

<div class="container">

<h1>Enrollment Complete</h1>

<p>Your VitaLink Agent Code:</p>

<div id="agentCode" class="code"></div>

<a id="openAppBtn" class="button">Open VitaLink</a>

<div class="store">

<a href="https://apps.apple.com" target="_blank">
<img src="https://developer.apple.com/assets/elements/badges/download-on-the-app-store.svg">
</a>

<a href="https://play.google.com/store/apps" target="_blank">
<img src="https://upload.wikimedia.org/wikipedia/commons/7/78/Google_Play_Store_badge_EN.svg">
</a>

</div>

</div>

<script>

const params = new URLSearchParams(window.location.search);
const code = params.get("code");

const codeEl = document.getElementById("agentCode");
const openBtn = document.getElementById("openAppBtn");

if(code){
codeEl.innerText = code;
}else{
codeEl.innerText = "Agent Code Ready";
}

const scheme = code ? `vitalink://activate/${code}` : "vitalink://";

const isiOS = /iPad|iPhone|iPod/.test(navigator.userAgent);
const isAndroid = /Android/.test(navigator.userAgent);

openBtn.href = scheme;

/* ANDROID: auto open app */
if(isAndroid){

setTimeout(()=>{
window.location.href = scheme;
},500);

}

/* iOS: must tap button (Safari blocks auto redirect) */
if(isiOS){

openBtn.innerText = "Open VitaLink";

}

</script>

</body>
</html>
