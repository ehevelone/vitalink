<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>VitaLink — Admin Dashboard</title>

<style>

:root{
  --bg:#0c0c0c;
  --card:#111;
  --text:#eaeaea;
  --border:#1e1e1e;
  --input:#000;
}

body.light{
  --bg:#f5f5f5;
  --card:#ffffff;
  --text:#222;
  --border:#ddd;
  --input:#fff;
}

body{
  margin:0;
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  background:var(--bg);
  color:var(--text);
}

.header{
  display:flex;
  justify-content:space-between;
  align-items:center;
  padding:20px 30px;
  border-bottom:1px solid var(--border);
}

.header h1{
  margin:0;
  font-size:1.4rem;
}

.header-buttons{
  display:flex;
  gap:10px;
}

button.primary{
  padding:10px 16px;
  border-radius:999px;
  border:none;
  background:#7cc6e8;
  font-weight:600;
  cursor:pointer;
}

button.primary:hover{
  opacity:.9;
}

.logout{
  padding:10px 16px;
  border-radius:999px;
  border:none;
  background:#e74c3c;
  color:#fff;
  font-weight:600;
  cursor:pointer;
}

.logout:hover{
  background:#c0392b;
}

.container{
  padding:30px;
  display:grid;
  grid-template-columns:repeat(auto-fit,minmax(220px,1fr));
  gap:20px;
}

.card{
  background:var(--card);
  border:1px solid var(--border);
  border-radius:12px;
  padding:20px;
}

.card h2{
  margin:0 0 10px 0;
  font-size:.9rem;
  color:#b5b5b5;
}

.card p{
  margin:0;
  font-size:1.6rem;
  font-weight:bold;
}

.section{
  padding:0 30px 30px 30px;
}

input{
  padding:10px;
  margin-right:10px;
  margin-bottom:10px;
  background:var(--input);
  border:1px solid var(--border);
  color:var(--text);
  border-radius:6px;
}

#qrContainer{
  margin-top:20px;
}

table{
  width:100%;
  border-collapse:collapse;
  background:var(--card);
  border-radius:12px;
  overflow:hidden;
}

th,td{
  padding:12px;
  border-bottom:1px solid var(--border);
  text-align:left;
}

th{
  color:#999;
  font-size:.85rem;
}

tr:nth-child(even){
  background:rgba(255,255,255,.03);
}

/* PRINT MODE */

@media print{

  body{
    background:white;
    color:black;
  }

  .header,
  .header-buttons,
  button,
  input{
    display:none;
  }

  .card{
    border:none;
  }

  table{
    border:1px solid #000;
  }

  th,td{
    border:1px solid #000;
    color:black;
  }

}

</style>
</head>

<body>

<div class="header">

<h1>Admin Dashboard</h1>

<div class="header-buttons">

<button class="primary" onclick="window.print()">Print Report</button>

<button id="themeToggle" class="primary">Light Mode</button>

<button class="logout">Logout</button>

</div>

</div>

<div class="container">

<div class="card">
<h2>Total RSMs</h2>
<p id="totalRSMs">0</p>
</div>

<div class="card">
<h2>Total Agents</h2>
<p id="totalAgents">0</p>
</div>

<div class="card">
<h2>RSM Users</h2>
<p id="activeAgents">0</p>
</div>

<div class="card">
<h2>Independent Users</h2>
<p id="inactiveAgents">0</p>
</div>

</div>

<div class="section">

<h2>Create RSM</h2>

<input id="rsmEmail" placeholder="RSM Email" />
<input id="rsmPhone" placeholder="RSM Phone (+1...)" />

<button class="primary" id="createBtn">Create RSM</button>

<div id="createMessage"></div>

<div id="qrContainer"></div>

</div>

<div class="section">

<h2>Notifications</h2>

<button class="primary" onclick="sendUpdateNotification()">
Send App Update Notification
</button>

</div>

<div class="section">

<h2>Breakdown Summary</h2>

<table>

<thead>
<tr>
<th>Category</th>
<th>Agents</th>
<th colspan="2">Users</th>
</tr>
</thead>

<tbody id="rsmBreakdown"></tbody>

</table>

</div>

<script>

const BACKEND="https://vitalink-app.netlify.app/.netlify/functions";
const token=sessionStorage.getItem("adminSessionToken");
const role=sessionStorage.getItem("userRole");

if(!token||role!=="admin"){
window.location.href="admin.html";
}

document.querySelector(".logout").onclick=()=>{
sessionStorage.clear();
window.location.href="admin.html";
};

/* THEME */

const toggle=document.getElementById("themeToggle");

function applyTheme(theme){
if(theme==="light"){
document.body.classList.add("light");
toggle.textContent="Dark Mode";
}else{
document.body.classList.remove("light");
toggle.textContent="Light Mode";
}
}

const savedTheme=localStorage.getItem("theme")||"dark";
applyTheme(savedTheme);

toggle.onclick=()=>{
const newTheme=document.body.classList.contains("light")?"dark":"light";
localStorage.setItem("theme",newTheme);
applyTheme(newTheme);
};

/* LOAD STATS */

async function loadStats(){

const res=await fetch(BACKEND+"/admin-stats",{
headers:{ "x-admin-session":token }
});

if(!res.ok){
sessionStorage.clear();
window.location.href="admin.html";
return;
}

const data=await res.json();

// 🔥 TOTALS
document.getElementById("totalRSMs").innerText = data.total_rsms;

document.getElementById("totalAgents").innerText =
  (data.rsm_agents || 0) + (data.independent_agents || 0);

document.getElementById("activeAgents").innerText = data.rsm_users || 0;
document.getElementById("inactiveAgents").innerText = data.independent_users || 0;

// 🔥 BREAKDOWN
const tbody=document.getElementById("rsmBreakdown");
tbody.innerHTML=`
<tr>
<td><strong>RSM Structure</strong></td>
<td>${data.rsm_agents}</td>
<td colspan="2">${data.rsm_users} Users</td>
</tr>

<tr>
<td><strong>Independent Agents</strong></td>
<td>${data.independent_agents}</td>
<td colspan="2">${data.independent_agent_users} Users</td>
</tr>

<tr>
<td><strong>Independent Users</strong></td>
<td colspan="3">${data.independent_users}</td>
</tr>
`;

}

/* CREATE RSM */

document.getElementById("createBtn").onclick=async function(){

const email=document.getElementById("rsmEmail").value.trim();
const phone=document.getElementById("rsmPhone").value.trim();

if(!email||!phone){
document.getElementById("createMessage").innerText="Email and phone required.";
return;
}

const res=await fetch(BACKEND+"/create-rsm",{
method:"POST",
headers:{
"Content-Type":"application/json",
"x-admin-session":token
},
body:JSON.stringify({email,phone})
});

if(!res.ok){
const text=await res.text();
document.getElementById("createMessage").innerText=text||"Error creating RSM";
return;
}

const data=await res.json();

document.getElementById("createMessage").innerText="RSM Created";

const qrContainer=document.getElementById("qrContainer");
qrContainer.innerHTML="";

const onboardingUrl=
"https://vitalink-app.netlify.app/.netlify/functions/rsm-onboard?token="+
data.onboard_token;

qrContainer.innerHTML=
`<img src="https://api.qrserver.com/v1/create-qr-code/?size=200x200&data=${encodeURIComponent(onboardingUrl)}" />`;

loadStats();

};

async function sendUpdateNotification(){

const res = await fetch(BACKEND + "/send_notification",{
method:"POST",
headers:{
"Content-Type":"application/json"
},
body:JSON.stringify({
agentEmail:"ehevelone@gmail.com",
campaign:"UPDATE"
})
});

const data = await res.json();

if(data.success){
alert("Update notification sent!");
}else{
alert("Failed to send notification");
}

}

/* INIT */

loadStats();

</script>

</body>
</html>
