<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>VitaLink — RSM Dashboard</title>

<style>

:root{
  --bg:#0c0c0c;
  --card:#111;
  --text:#eaeaea;
  --border:#1e1e1e;
  --input:#000;
}

body.light{
  --bg:#f5f5f5;
  --card:#ffffff;
  --text:#222;
  --border:#ddd;
  --input:#fff;
}

body{
  margin:0;
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  background:var(--bg);
  color:var(--text);
}

.header{
  display:flex;
  justify-content:space-between;
  align-items:center;
  padding:20px 30px;
  border-bottom:1px solid var(--border);
}

.header-buttons{
  display:flex;
  gap:10px;
}

button.primary{
  padding:8px 16px;
  border-radius:999px;
  border:none;
  background:#7cc6e8;
  font-weight:600;
  cursor:pointer;
}

button.primary:hover{
  opacity:.9;
}

.logout{
  padding:8px 16px;
  border-radius:999px;
  border:none;
  background:#e74c3c;
  color:#fff;
  font-weight:600;
  cursor:pointer;
}

.logout:hover{
  background:#c0392b;
}

.container{
  padding:30px;
}

.card{
  background:var(--card);
  border:1px solid var(--border);
  border-radius:12px;
  padding:20px;
  margin-bottom:20px;
}

.stats{
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:20px;
  margin-bottom:20px;
}

.stat{
  background:var(--card);
  border:1px solid var(--border);
  border-radius:12px;
  padding:20px;
  text-align:center;
}

.stat h3{
  margin:0;
  font-size:28px;
}

.stat p{
  margin:5px 0 0 0;
  color:#999;
}

input{
  padding:10px;
  border-radius:6px;
  border:1px solid var(--border);
  background:var(--input);
  color:var(--text);
  margin-right:10px;
}

table{
  width:100%;
  border-collapse:collapse;
  background:var(--card);
}

th,td{
  padding:12px;
  border-bottom:1px solid var(--border);
}

th{
  color:#999;
}

tr:nth-child(even){
  background:rgba(255,255,255,.03);
}

/* PRINT MODE */

@media print{

  body{
    background:white;
    color:black;
  }

  .header,
  .header-buttons,
  input,
  button{
    display:none;
  }

  .container{
    padding:0;
  }

  .card,
  .stat{
    border:none;
  }

  table{
    border:1px solid #000;
  }

  th,td{
    border:1px solid #000;
    color:black;
  }

}

</style>
</head>

<body>

<div class="header">
  <h1>RSM Dashboard</h1>

  <div class="header-buttons">

    <button class="primary" onclick="window.location.href='rsm_enroll.html'">
      Enroll Agent
    </button>

    <button id="themeToggle" class="primary">Light Mode</button>

    <button class="logout">Logout</button>

  </div>
</div>

<div class="container">

<div class="stats">

  <div class="stat">
    <h3 id="activeAgents">0</h3>
    <p>Active Agents</p>
  </div>

  <div class="stat">
    <h3 id="inactiveAgents">0</h3>
    <p>Inactive Agents</p>
  </div>

  <div class="stat">
    <h3 id="totalAgents">0</h3>
    <p>Total Agents</p>
  </div>

</div>

<div class="card">
  <h2>Search Agents</h2>

  <input id="searchInput" placeholder="Search by name or email" />

  <button class="primary" onclick="load()">Search</button>

  <button class="primary" onclick="downloadCSV()">Download CSV</button>

  <button class="primary" onclick="window.print()">Print Report</button>

</div>

<div class="card">

<table>

<thead>
<tr>
<th>Name</th>
<th>Email</th>
<th>Status</th>
<th>Export</th>
<th>Action</th>
</tr>
</thead>

<tbody id="agentTable"></tbody>

</table>

</div>

</div>

<script>

const BACKEND="https://vitalink-app.netlify.app/.netlify/functions";
const token=sessionStorage.getItem("adminSessionToken");
const role=sessionStorage.getItem("userRole");

if(!token||role!=="rsm"){
  window.location.href="admin.html";
}

document.querySelector(".logout").onclick=()=>{
  sessionStorage.clear();
  window.location.href="admin.html";
};

/* THEME */

const toggle=document.getElementById("themeToggle");

function applyTheme(theme){

  if(theme==="light"){
    document.body.classList.add("light");
    toggle.textContent="Dark Mode";
  }else{
    document.body.classList.remove("light");
    toggle.textContent="Light Mode";
  }

}

const savedTheme=localStorage.getItem("theme")||"dark";
applyTheme(savedTheme);

toggle.onclick=()=>{

  const newTheme=document.body.classList.contains("light")?"dark":"light";

  localStorage.setItem("theme",newTheme);

  applyTheme(newTheme);

};

/* LOAD DATA */

async function load(){

  const search=document.getElementById("searchInput").value;

  const res=await fetch(
    `${BACKEND}/rsm-summary-report?search=${encodeURIComponent(search)}`,
    {
      headers:{ "x-admin-session":token }
    }
  );

  if(!res.ok){
    sessionStorage.clear();
    window.location.href="admin.html";
    return;
  }

  const data=await res.json();

  document.getElementById("activeAgents").innerText=data.active_agents;

  const inactive=data.agents.filter(a=>!a.active).length;

  document.getElementById("inactiveAgents").innerText=inactive;

  document.getElementById("totalAgents").innerText=data.agents.length;

  const tbody=document.getElementById("agentTable");
  tbody.innerHTML="";

  data.agents.forEach(agent=>{

    tbody.innerHTML+=`
    <tr>
      <td>${agent.name||""}</td>
      <td>${agent.email||""}</td>
      <td>${agent.active?"Active":"Inactive"}</td>

      <td>
        <button class="primary" onclick="exportAgent('${agent.id}')">
          Download
        </button>
      </td>

      <td>
        <button class="primary" onclick="toggleAgent('${agent.id}')">
          ${agent.active ? "Deactivate" : "Activate"}
        </button>
      </td>

    </tr>
    `;

  });

}

/* EXPORT SINGLE AGENT */

async function exportAgent(id){

 const res = await fetch(
   `${BACKEND}/rsm-agent-export?id=${id}`,
   { headers:{ "x-admin-session":token } }
 );

 if(!res.ok){
   alert("Unable to export agent.");
   return;
 }

 const data = await res.json();

 let csv="Name,Email,Phone\n";
 csv+=`"${data.name||""}","${data.email||""}","${data.phone||""}"`;

 const blob=new Blob([csv],{type:"text/csv"});
 const url=URL.createObjectURL(blob);

 const a=document.createElement("a");
 a.href=url;
 a.download=`agent_${data.name||"record"}.csv`;
 a.click();

}

/* ACTIVATE / DEACTIVATE */

async function toggleAgent(id){

  const res = await fetch(
    `${BACKEND}/rsm-toggle-agent`,
    {
      method:"POST",
      headers:{
        "Content-Type":"application/json",
        "x-admin-session":token
      },
      body:JSON.stringify({agentId:id})
    }
  );

  if(!res.ok){
    alert("Unable to update agent.");
    return;
  }

  load();
}

/* CSV */

async function downloadCSV(){

  const res=await fetch(
    `${BACKEND}/rsm-summary-report`,
    { headers:{ "x-admin-session":token } }
  );

  if(!res.ok){
    alert("Unable to download CSV.");
    return;
  }

  const data=await res.json();

  let csv="Name,Email,Active\n";

  data.agents.forEach(a=>{
    csv+=`"${a.name||""}","${a.email||""}","${a.active}"\n`;
  });

  const blob=new Blob([csv],{type:"text/csv"});
  const url=URL.createObjectURL(blob);

  const a=document.createElement("a");
  a.href=url;
  a.download="rsm_agents.csv";
  a.click();

}

load();

</script>

</body>
</html>
