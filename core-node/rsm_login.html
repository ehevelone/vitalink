<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>VitaLink — RSM Login</title>

  <meta name="description" content="RSM login for VitaLink." />
  <meta name="robots" content="noindex, nofollow" />
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>

  <style>
    :root {
      --bg-black: #0c0c0c;
      --text-primary: #eaeaea;
      --text-muted: #b5b5b5;
      --accent-blue: #7cc6e8;
      --divider: #1e1e1e;
      --card-bg: #111;
      --danger: #ff5a5a;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background: var(--bg-black);
      color: var(--text-primary);
    }

    main {
      max-width: 520px;
      margin: 0 auto;
      padding: 60px 24px;
    }

    .logo {
      max-width: 180px;
      margin: 0 auto 40px auto;
      display: block;
    }

    h1 {
      text-align: center;
      font-size: 2rem;
      margin-bottom: 10px;
    }

    .sub {
      text-align: center;
      color: var(--text-muted);
      margin-bottom: 36px;
      font-size: 0.95rem;
    }

    .card {
      background: var(--card-bg);
      border: 1px solid var(--divider);
      border-radius: 12px;
      padding: 28px;
    }

    .field { margin-bottom: 18px; }

    label {
      display: block;
      font-size: 0.85rem;
      margin-bottom: 6px;
      color: var(--text-muted);
    }

    input {
      width: 100%;
      padding: 12px;
      border-radius: 8px;
      border: 1px solid var(--divider);
      background: #000;
      color: #fff;
      font-size: 0.95rem;
    }

    button {
      width: 100%;
      padding: 14px;
      border-radius: 999px;
      border: none;
      background: var(--accent-blue);
      color: #000;
      font-weight: 600;
      font-size: 0.95rem;
      cursor: pointer;
      margin-top: 10px;
    }

    button:disabled {
      opacity: 0.6;
      cursor: not-allowed;
    }

    .forgot {
      text-align: center;
      margin-top: 14px;
      font-size: 0.85rem;
      color: var(--accent-blue);
      cursor: pointer;
    }

    .forgot:hover {
      text-decoration: underline;
    }

    .result {
      margin-top: 16px;
      text-align: center;
      font-size: 0.9rem;
      color: var(--text-muted);
      min-height: 22px;
    }

    .error { color: var(--danger); }
    .hidden { display: none; }

    footer {
      margin-top: 60px;
      text-align: center;
      color: #666;
      font-size: 0.8rem;
    }
  </style>
<link rel="stylesheet" href="../typography.css">
</head>

<body>
  <main>

    <img src="../images/vitalink-logo-1.png" alt="VitaLink" class="logo" />

    <h1>RSM Login</h1>
    <div class="sub">
      Sign in to manage agents and reporting.
    </div>

    <div class="card">

      <div id="step1">
      <div class="field">
        <label>Email</label>
        <input type="email" id="email" autocomplete="email" />
      </div>

      <div class="field">
        <label>Password</label>
        <input type="password" id="password" autocomplete="current-password" />
        <div style="margin-top:6px; font-size:0.8rem; color:#7cc6e8; cursor:pointer;" onclick="togglePassword('password')">
          Show Password
        </div>
      </div>

      <button id="btn" onclick="loginRSM()">Login</button>

      <div class="forgot" onclick="forgotPassword()">
        Forgot your password?
      </div>
      </div>

      <div id="step2" class="hidden">
        <div class="field">
          <label>Verification Code</label>
          <input type="text" id="smsCode" inputmode="numeric" autocomplete="one-time-code" />
        </div>

        <button id="verifyBtn" onclick="verifyCode()">Verify Code</button>
      </div>

      <div id="resetStep" class="hidden">
        <div class="field">
          <label>Email</label>
          <input type="email" id="resetEmail" autocomplete="email" />
        </div>

        <button id="sendResetBtn" onclick="sendRsmResetCode()">Send Reset Code</button>

        <div class="field" style="margin-top:18px;">
          <label>Reset Code</label>
          <input type="text" id="resetCode" inputmode="numeric" autocomplete="one-time-code" />
        </div>

        <div class="field">
          <label>New Password</label>
          <input type="password" id="resetPassword" autocomplete="new-password" />
        </div>

        <div class="field">
          <label>Confirm New Password</label>
          <input type="password" id="resetConfirmPassword" autocomplete="new-password" />
        </div>

        <button id="confirmResetBtn" onclick="confirmRsmReset()">Reset Password</button>

        <div class="forgot" onclick="showLogin()">
          Back to login
        </div>
      </div>

      <div class="result" id="result"></div>
      <div id="recaptcha-container"></div>

    </div>

    <footer>
      © 2026 VitaLink. All rights reserved.
    </footer>

  </main>

  <script>
    const REPORT_PAGE = "/core-node/rsm_report.html";
    const ADMIN_REPORT_PAGE = "/core-node/admin_report.html";
    const API = "https://vitalink-app.netlify.app/.netlify/functions";

    const firebaseConfig = {
      apiKey: "AIzaSyCTZiiluPy5ydX62RfM-E7f8EIWHNG12S8",
      authDomain: "vitalink-7e832.firebaseapp.com",
      projectId: "vitalink-7e832",
    };

    firebase.initializeApp(firebaseConfig);

    let confirmationResult = null;
    let currentEmail = null;

    // If already logged in, bounce straight to report page
    (function boot() {
      const token = sessionStorage.getItem("adminSessionToken");
      const role = sessionStorage.getItem("userRole");
      if (token && role === "rsm") {
        window.location.href = REPORT_PAGE;
      }
    })();

    async function loginRSM() {
      const email = document.getElementById("email").value.trim();
      const password = document.getElementById("password").value;
      const resultDiv = document.getElementById("result");
      const btn = document.getElementById("btn");

      resultDiv.className = "result";
      resultDiv.textContent = "";

      if (!email || !password) {
        resultDiv.classList.add("error");
        resultDiv.textContent = "Email and password required.";
        return;
      }

      btn.disabled = true;
      resultDiv.textContent = "Signing in...";
      currentEmail = email;

      try {
        const res = await fetch(`${API}/rsm-login`, {
          method: "POST",
          credentials: "omit",
          cache: "no-store",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ email, password })
        });

        const data = await res.json().catch(() => ({}));

        if (res.ok && data.step === "firebase_2fa") {
          resultDiv.textContent = "Sending verification code...";
          document.getElementById("recaptcha-container").innerHTML = "";

          const verifier = new firebase.auth.RecaptchaVerifier(
            "recaptcha-container",
            { size: "invisible" }
          );

          await verifier.render();

          confirmationResult = await firebase.auth().signInWithPhoneNumber(
            data.phone,
            verifier
          );

          document.getElementById("step1").classList.add("hidden");
          document.getElementById("step2").classList.remove("hidden");
          resultDiv.textContent = "Enter the verification code.";
          return;
        }

        if (res.ok && data.success && data.token) {
          sessionStorage.setItem("adminSessionToken", data.token);
          sessionStorage.setItem("userRole", data.role || "rsm");
          window.location.href = REPORT_PAGE; // ✅ go to report page
          return;
        }

        resultDiv.classList.add("error");
        resultDiv.textContent =
          data.code
            ? `${data.error || "Login failed."} (${data.code})`
            : data.error || "Login failed.";

      } catch {
        resultDiv.classList.add("error");
        resultDiv.textContent = "Server error.";
      } finally {
        btn.disabled = false;
      }
    }

    async function verifyCode() {
      const code = document.getElementById("smsCode").value.trim();
      const resultDiv = document.getElementById("result");
      const btn = document.getElementById("verifyBtn");

      resultDiv.className = "result";

      if (!code || !confirmationResult || !currentEmail) {
        resultDiv.classList.add("error");
        resultDiv.textContent = "Verification code required.";
        return;
      }

      btn.disabled = true;
      resultDiv.textContent = "Verifying...";

      try {
        const result = await confirmationResult.confirm(code);
        const idToken = await result.user.getIdToken();

        const res = await fetch(`${API}/admin-verify`, {
          method: "POST",
          credentials: "omit",
          cache: "no-store",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ idToken, email: currentEmail })
        });

        const data = await res.json().catch(() => ({}));

        if (!res.ok || !data.token) {
          resultDiv.classList.add("error");
          resultDiv.textContent = data.error || "Verification failed.";
          return;
        }

        sessionStorage.setItem("adminSessionToken", data.token);
        sessionStorage.setItem("userRole", data.role);

        window.location.href =
          data.role === "admin" ? ADMIN_REPORT_PAGE : REPORT_PAGE;
      } catch {
        resultDiv.classList.add("error");
        resultDiv.textContent = "Verification failed.";
      } finally {
        btn.disabled = false;
      }
    }

    function togglePassword(id) {
      const input = document.getElementById(id);
      input.type = input.type === "password" ? "text" : "password";
    }

    document.addEventListener("keydown", (event) => {
      if (event.key !== "Enter") return;

      const active = document.activeElement;
      if (active && ["TEXTAREA", "BUTTON", "A"].includes(active.tagName)) return;

      event.preventDefault();

      if (!document.getElementById("step1").classList.contains("hidden")) {
        loginRSM();
      } else if (!document.getElementById("step2").classList.contains("hidden")) {
        verifyCode();
      } else if (!document.getElementById("resetStep").classList.contains("hidden")) {
        const hasResetCode = document.getElementById("resetCode").value.trim();
        const hasPassword = document.getElementById("resetPassword").value;
        const hasConfirmPassword = document.getElementById("resetConfirmPassword").value;

        if (hasResetCode || hasPassword || hasConfirmPassword) {
          confirmRsmReset();
        } else {
          sendRsmResetCode();
        }
      }
    });

    function setResult(message, isError) {
      const resultDiv = document.getElementById("result");
      resultDiv.className = "result";
      if (isError) resultDiv.classList.add("error");
      resultDiv.textContent = message || "";
    }

    function forgotPassword() {
      const email = document.getElementById("email").value.trim();
      document.getElementById("resetEmail").value = email;
      document.getElementById("step1").classList.add("hidden");
      document.getElementById("step2").classList.add("hidden");
      document.getElementById("resetStep").classList.remove("hidden");
      setResult("Enter your email to receive a reset code.", false);
    }

    function showLogin() {
      document.getElementById("resetStep").classList.add("hidden");
      document.getElementById("step2").classList.add("hidden");
      document.getElementById("step1").classList.remove("hidden");
      setResult("", false);
    }

    async function sendRsmResetCode() {
      const email = document.getElementById("resetEmail").value.trim();
      const btn = document.getElementById("sendResetBtn");

      if (!email) {
        setResult("Email required.", true);
        return;
      }

      btn.disabled = true;
      setResult("Sending reset code...", false);

      try {
        const res = await fetch(`${API}/request_reset`, {
          method: "POST",
          credentials: "omit",
          cache: "no-store",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({
            emailOrPhone: email,
            role: "rsms"
          })
        });

        const data = await res.json().catch(() => ({}));

        if (!res.ok || data.success !== true) {
          setResult(data.error || "Unable to send reset code.", true);
          return;
        }

        setResult("Reset code sent. Check your email.", false);
      } catch {
        setResult("Server error.", true);
      } finally {
        btn.disabled = false;
      }
    }

    async function confirmRsmReset() {
      const email = document.getElementById("resetEmail").value.trim();
      const code = document.getElementById("resetCode").value.trim();
      const password = document.getElementById("resetPassword").value;
      const confirmPassword = document.getElementById("resetConfirmPassword").value;
      const btn = document.getElementById("confirmResetBtn");

      if (!email || !code || !password || !confirmPassword) {
        setResult("All reset fields are required.", true);
        return;
      }

      if (password.length < 8) {
        setResult("Password must be at least 8 characters.", true);
        return;
      }

      if (password !== confirmPassword) {
        setResult("Passwords do not match.", true);
        return;
      }

      btn.disabled = true;
      setResult("Resetting password...", false);

      try {
        const res = await fetch(`${API}/reset_password`, {
          method: "POST",
          credentials: "omit",
          cache: "no-store",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({
            emailOrPhone: email,
            code,
            newPassword: password,
            role: "rsms"
          })
        });

        const data = await res.json().catch(() => ({}));

        if (!res.ok || data.success !== true) {
          setResult(data.error || "Password reset failed.", true);
          return;
        }

        setResult("Password reset. You can log in now.", false);
        setTimeout(showLogin, 1500);
      } catch {
        setResult("Server error.", true);
      } finally {
        btn.disabled = false;
      }
    }
  </script>

</body>
</html>
