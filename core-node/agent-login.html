<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>VitaLink — Agent Access</title>
<meta name="robots" content="noindex, nofollow" />

<style>
:root{
  --bg-black:#000;
  --card:#111;
  --text-primary:#eaeaea;
  --text-muted:#b5b5b5;
  --accent-blue:#79CAE3;
  --divider:#1e1e1e;
}
body{
  margin:0;
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  background:var(--bg-black);
  color:var(--text-primary);
  display:flex;
  justify-content:center;
  align-items:center;
  height:100vh;
}
.card{
  background:var(--card);
  border:1px solid var(--divider);
  border-radius:14px;
  padding:40px;
  width:100%;
  max-width:400px;
}
h1{
  margin-top:0;
  margin-bottom:30px;
  font-size:1.5rem;
}
input{
  width:100%;
  padding:12px;
  margin-bottom:16px;
  border-radius:8px;
  border:1px solid var(--divider);
  background:#000;
  color:var(--text-primary);
}
button{
  width:100%;
  padding:12px;
  border-radius:999px;
  border:none;
  background:var(--accent-blue);
  font-weight:600;
  cursor:pointer;
}
.hidden{display:none;}
.error{
  color:#ff6b6b;
  margin-bottom:12px;
}
</style>

<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
</head>
<body>

<div class="card">
  <h1>Agent Access</h1>
  <div id="error" class="error hidden"></div>

  <div id="step1">
    <input type="email" id="email" placeholder="Email" />
    <input type="password" id="password" placeholder="Password" />
    <button id="loginBtn">Login</button>
  </div>

  <div id="step2" class="hidden">
    <input type="text" id="smsCode" placeholder="Enter 6-digit code" />
    <button id="verifyBtn">Verify Code</button>
  </div>

  <div id="recaptcha-container"></div>
</div>

<script>

const firebaseConfig = {
  apiKey: "AIzaSyCTZiiluPy5ydX62RfM-E7f8EIWHNG12S8",
  authDomain: "vitalink-7e832.firebaseapp.com",
  projectId: "vitalink-7e832",
  storageBucket: "vitalink-7e832.firebasestorage.app",
  messagingSenderId: "776534002769",
  appId: "1:776534002769:web:f2460535613304e12efc70"
};

firebase.initializeApp(firebaseConfig);

// ✅ INIT RECAPTCHA
window.recaptchaVerifier = new firebase.auth.RecaptchaVerifier(
  "recaptcha-container",
  {
    size: "invisible",
    callback: function(response) {
      console.log("reCAPTCHA solved");
    }
  }
);

window.recaptchaVerifier.render();

let confirmationResult = null;
let currentEmail = null;

document.getElementById("loginBtn").addEventListener("click", login);
document.getElementById("verifyBtn").addEventListener("click", verifyCode);

function showError(msg){
  const el = document.getElementById("error");
  el.innerText = msg;
  el.classList.remove("hidden");
}

async function login() {

  const email = document.getElementById("email").value.trim();
  const password = document.getElementById("password").value;

  if (!email || !password){
    showError("Enter email and password");
    return;
  }

  currentEmail = email;

  try {

    const res = await fetch(
      "https://vitalink-app.netlify.app/.netlify/functions/agent-login",
      {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ email, password })
      }
    );

    if (!res.ok){
      showError("Login failed");
      return;
    }

    const data = await res.json();

    if (data.step === "firebase_2fa") {

      try {

        console.log("PHONE:", data.phone);

        confirmationResult = await firebase.auth().signInWithPhoneNumber(
          data.phone,
          window.recaptchaVerifier
        );

        console.log("SMS SENT");

        document.getElementById("step1").classList.add("hidden");
        document.getElementById("step2").classList.remove("hidden");

      } catch (err) {
        console.error("🔥 FIREBASE ERROR:", err);
        showError(err.message || "SMS failed");
      }

      return;
    }

    if (data.step === "login_success") {
      localStorage.setItem("agentToken", data.token);
      window.location.href = "agent-report.html";
      return;
    }

    showError("Unexpected response");

  } catch (err) {
    console.error("LOGIN ERROR:", err);
    showError("Something went wrong");
  }
}

async function verifyCode() {

  const code = document.getElementById("smsCode").value.trim();
  if (!code){
    showError("Enter code");
    return;
  }

  try {

    const result = await confirmationResult.confirm(code);
    const idToken = await result.user.getIdToken();

    const res = await fetch(
      "https://vitalink-app.netlify.app/.netlify/functions/agent-verify",
      {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ idToken, email: currentEmail })
      }
    );

    if (!res.ok){
      showError("Verification failed");
      return;
    }

    const data = await res.json();

    localStorage.setItem("agentToken", data.token);

    window.location.href = "agent-report.html";

  } catch (err) {
    console.error("VERIFY ERROR:", err);
    showError("Invalid code");
  }
}

</script>

</body>
</html>
