<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>VitaLink — Agent Access</title>
<meta name="robots" content="noindex, nofollow" />

<style>
:root {
  --bg-black:#000000;
  --text-primary:#eaeaea;
  --text-muted:#b5b5b5;
  --accent-blue:#7cc6e8;
  --divider:#1e1e1e;
  --card-bg:#111;
  --danger:#ff5a5a;
}

* { box-sizing:border-box; }

body {
  margin:0;
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  background:var(--bg-black);
  color:var(--text-primary);
}

main {
  max-width:520px;
  margin:0 auto;
  padding:60px 24px;
}

.logo {
  max-width:180px;
  margin:0 auto 40px auto;
  display:block;
}

h1 {
  text-align:center;
  font-size:2rem;
  margin-bottom:10px;
}

.sub {
  text-align:center;
  color:var(--text-muted);
  margin-bottom:36px;
  font-size:0.95rem;
}

.card {
  background:var(--card-bg);
  border:1px solid var(--divider);
  border-radius:12px;
  padding:28px;
}

.field { margin-bottom:18px; }

label {
  display:block;
  font-size:0.85rem;
  margin-bottom:6px;
  color:var(--text-muted);
}

input {
  width:100%;
  padding:12px;
  border-radius:8px;
  border:1px solid var(--divider);
  background:#000;
  color:#fff;
  font-size:0.95rem;
}

button {
  width:100%;
  padding:14px;
  border-radius:999px;
  border:none;
  background:var(--accent-blue);
  color:#000;
  font-weight:600;
  font-size:0.95rem;
  cursor:pointer;
  margin-top:10px;
}

.forgot {
  text-align:center;
  margin-top:14px;
  font-size:0.85rem;
  color:var(--accent-blue);
  cursor:pointer;
}

.forgot:hover { text-decoration:underline; }

.result {
  margin-top:16px;
  text-align:center;
  font-size:0.9rem;
  min-height:22px;
}

.error { color:var(--danger); }

.hidden { display:none; }

.modal{
  position:fixed;
  inset:0;
  background:rgba(0,0,0,.8);
  display:none;
  align-items:center;
  justify-content:center;
}

.modal.active{ display:flex; }

.modal-card{
  background:#111;
  padding:24px;
  border-radius:12px;
  width:320px;
  border:1px solid var(--divider);
}

.modal-card h3{
  margin-top:0;
  text-align:center;
}

footer{
  margin-top:60px;
  text-align:center;
  color:#666;
  font-size:0.8rem;
}
</style>

<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
</head>

<body>

<main>

<img src="../images/vitalink-logo-1.png" class="logo" />

<h1>Agent Access</h1>
<div class="sub">Sign in to manage your clients and data</div>

<div class="card">

<div id="error" class="result error hidden"></div>

<div id="step1">

  <div class="field">
    <label>Email</label>
    <input type="email" id="email" />
  </div>

  <div class="field">
    <label>Password</label>
    <input type="password" id="password" />
  </div>

  <button id="loginBtn" type="button">Login</button>

  <div class="forgot" onclick="openReset()">Forgot your password?</div>

</div>

<div id="step2" class="hidden">
  <div class="field">
    <label>Verification Code</label>
    <input type="text" id="smsCode" />
  </div>
  <button id="verifyBtn" type="button">Verify Code</button>
</div>

<div id="recaptcha-container"></div>

</div>

<footer>
© 2026 VitaLink. All rights reserved.
</footer>

</main>

<div id="resetModal" class="modal">
  <div class="modal-card">
    <h3>Reset Password</h3>

    <input id="resetEmail" placeholder="Email" />
    <input id="resetCode" placeholder="Code" />
    <input id="resetPassword" type="password" placeholder="New Password" />

    <button onclick="requestReset()">Send Code</button>
    <button onclick="submitReset()">Reset Password</button>
    <button onclick="closeReset()" style="background:#444;">Cancel</button>
  </div>
</div>

<script>

const API = "https://vitalink-app.netlify.app/.netlify/functions";

const firebaseConfig = {
  apiKey: "AIzaSyCTZiiluPy5ydX62RfM-E7f8EIWHNG12S8",
  authDomain: "vitalink-7e832.firebaseapp.com",
  projectId: "vitalink-7e832",
  storageBucket: "vitalink-7e832.firebasestorage.app",
  messagingSenderId: "776534002769",
  appId: "1:776534002769:web:f2460535613304e12efc70"
};

firebase.initializeApp(firebaseConfig);

let confirmationResult = null;
let currentEmail = null;

// ✅ FIX: wait for DOM
window.addEventListener("DOMContentLoaded", () => {
  document.getElementById("loginBtn").addEventListener("click", login);
  document.getElementById("verifyBtn").addEventListener("click", verifyCode);
});

function showError(msg){
  const el = document.getElementById("error");
  el.innerText = msg;
  el.classList.remove("hidden");
}

async function login() {
  console.log("LOGIN CLICKED");

  const email = document.getElementById("email").value.trim();
  const password = document.getElementById("password").value;

  if (!email || !password){
    showError("Enter email and password");
    return;
  }

  try {

    const res = await fetch(`${API}/agent-login`, {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ email, password })
    });

    if (!res.ok){
      showError("Login failed");
      return;
    }

    const data = await res.json();

    console.log("LOGIN RESPONSE:", data);

    if (data.step === "login_success") {

      if (!data.agent || !data.agent.id){
        console.error("❌ Missing agent:", data);
        showError("Login failed (no agent returned)");
        return;
      }

      sessionStorage.setItem("agentSessionToken", data.token || "dev");
      sessionStorage.setItem("agentId", String(data.agent.id));

      console.log("✅ SAVED agentId:", sessionStorage.getItem("agentId"));

      setTimeout(() => {
        window.location.href = "agent-report.html";
      }, 100);

      return;
    }

    showError("Unexpected response");

  } catch (err) {
    console.error(err);
    showError("Something went wrong");
  }
}

// rest unchanged...

async function verifyCode() {
  const code = document.getElementById("smsCode").value.trim();
  if (!code){
    showError("Enter code");
    return;
  }

  try {

    const result = await confirmationResult.confirm(code);
    const idToken = await result.user.getIdToken();

    const res = await fetch(`${API}/agent-verify`, {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ idToken, email: currentEmail })
    });

    if (!res.ok){
      showError("Verification failed");
      return;
    }

    const data = await res.json();

    sessionStorage.setItem("agentSessionToken", data.token);
    sessionStorage.setItem("agentId", data.agent.id);
    window.location.href = "agent-report.html";

  } catch {
    showError("Invalid code");
  }
}

function openReset(){ document.getElementById("resetModal").classList.add("active"); }
function closeReset(){ document.getElementById("resetModal").classList.remove("active"); }

async function requestReset(){
  const email = document.getElementById("resetEmail").value;

  const res = await fetch(`${API}/request_reset`, {
    method:"POST",
    headers:{ "Content-Type":"application/json" },
    body: JSON.stringify({ emailOrPhone: email, role: "agents" })
  });

  const data = await res.json();
  if (data.success) alert("Reset code sent");
  else showError(data.error || "Failed");
}

async function submitReset(){
  const email = document.getElementById("resetEmail").value;
  const code = document.getElementById("resetCode").value;
  const password = document.getElementById("resetPassword").value;

  const res = await fetch(`${API}/reset_password`, {
    method:"POST",
    headers:{ "Content-Type":"application/json" },
    body: JSON.stringify({
      emailOrPhone: email,
      code,
      newPassword: password,
      role: "agents"
    })
  });

  const data = await res.json();
  if (data.success){
    alert("Password reset successful");
    closeReset();
  } else {
    showError(data.error || "Reset failed");
  }
}

</script>

</body>
</html>
