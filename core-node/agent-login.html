<script>

const firebaseConfig = {
  apiKey: "AIzaSyCTZiiluPy5ydX62RfM-E7f8EIWHNG12S8",
  authDomain: "vitalink-7e832.firebaseapp.com",
  projectId: "vitalink-7e832",
  storageBucket: "vitalink-7e832.firebasestorage.app",
  messagingSenderId: "776534002769",
  appId: "1:776534002769:web:f2460535613304e12efc70"
};

firebase.initializeApp(firebaseConfig);

// 🔥 INIT RECAPTCHA ON LOAD (THIS IS THE FIX)
window.recaptchaVerifier = new firebase.auth.RecaptchaVerifier(
  "recaptcha-container",
  {
    size: "invisible",
    callback: function(response) {
      console.log("reCAPTCHA solved");
    }
  }
);

// Render it once
window.recaptchaVerifier.render();

let confirmationResult = null;
let currentEmail = null;

document.getElementById("loginBtn").addEventListener("click", login);
document.getElementById("verifyBtn").addEventListener("click", verifyCode);

function showError(msg){
  const el = document.getElementById("error");
  el.innerText = msg;
  el.classList.remove("hidden");
}

async function login() {

  const email = document.getElementById("email").value.trim();
  const password = document.getElementById("password").value;

  if (!email || !password){
    showError("Enter email and password");
    return;
  }

  currentEmail = email;

  const res = await fetch(
    "https://vitalink-app.netlify.app/.netlify/functions/agent-login",
    {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ email, password })
    }
  );

  if (!res.ok){
    showError("Login failed");
    return;
  }

  const data = await res.json();

  // 🔥 2FA FLOW
  if (data.step === "firebase_2fa") {

    confirmationResult = await firebase.auth().signInWithPhoneNumber(
      data.phone,
      window.recaptchaVerifier
    );

    document.getElementById("step1").classList.add("hidden");
    document.getElementById("step2").classList.remove("hidden");
    return;
  }

  // 🔥 DIRECT LOGIN
  if (data.step === "login_success") {

    localStorage.setItem("agentToken", data.token);

    window.location.href = "agent-report.html";
    return;
  }
}

async function verifyCode() {

  const code = document.getElementById("smsCode").value.trim();
  if (!code){
    showError("Enter code");
    return;
  }

  const result = await confirmationResult.confirm(code);
  const idToken = await result.user.getIdToken();

  const res = await fetch(
    "https://vitalink-app.netlify.app/.netlify/functions/agent-verify",
    {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ idToken, email: currentEmail })
    }
  );

  if (!res.ok){
    showError("Verification failed");
    return;
  }

  const data = await res.json();

  localStorage.setItem("agentToken", data.token);

  window.location.href = "agent-report.html";
}

</script>
