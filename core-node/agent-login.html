<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>VitaLink — Agent Access</title>
<meta name="robots" content="noindex, nofollow" />

<style>
:root{
  --bg-black:#0c0c0c;
  --card:#111;
  --text-primary:#eaeaea;
  --text-muted:#b5b5b5;
  --accent-blue:#7cc6e8;
  --divider:#1e1e1e;
}
body{
  margin:0;
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  background:var(--bg-black);
  color:var(--text-primary);
  display:flex;
  justify-content:center;
  align-items:center;
  height:100vh;
}
.card{
  background:var(--card);
  border:1px solid var(--divider);
  border-radius:14px;
  padding:40px;
  width:100%;
  max-width:400px;
}
h1{
  margin-top:0;
  margin-bottom:30px;
  font-size:1.5rem;
}
input{
  width:100%;
  padding:12px;
  margin-bottom:12px;
  border-radius:8px;
  border:1px solid var(--divider);
  background:#000;
  color:var(--text-primary);
}
button{
  width:100%;
  padding:12px;
  border-radius:999px;
  border:none;
  background:var(--accent-blue);
  font-weight:600;
  cursor:pointer;
}
.hidden{display:none;}
.error{
  color:#ff6b6b;
  margin-bottom:12px;
}

/* RESET MODAL */
.modal{
  position:fixed;
  inset:0;
  background:rgba(0,0,0,.8);
  display:none;
  align-items:center;
  justify-content:center;
}
.modal.active{
  display:flex;
}
.modal-card{
  background:#111;
  padding:20px;
  border-radius:12px;
  width:300px;
}
.modal-card h3{
  margin-top:0;
}
</style>

<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
</head>
<body>

<div class="card">
  <h1>Agent Access</h1>
  <div id="error" class="error hidden"></div>

  <div id="step1">
    <input type="email" id="email" placeholder="Email" />
    <input type="password" id="password" placeholder="Password" />
    <button id="loginBtn">Login</button>

    <div style="margin-top:10px; text-align:center;">
      <a href="#" onclick="openReset()" style="color:#7cc6e8;">Forgot Password?</a>
    </div>
  </div>

  <div id="step2" class="hidden">
    <input type="text" id="smsCode" placeholder="Enter 6-digit code" />
    <button id="verifyBtn">Verify Code</button>
  </div>

  <div id="recaptcha-container"></div>
</div>

<!-- RESET MODAL -->
<div id="resetModal" class="modal">
  <div class="modal-card">
    <h3>Reset Password</h3>

    <input id="resetEmail" placeholder="Email" />
    <input id="resetCode" placeholder="Code" />
    <input id="resetPassword" type="password" placeholder="New Password" />

    <button onclick="requestReset()">Send Code</button>
    <button onclick="submitReset()" style="margin-top:10px;">Reset Password</button>
    <button onclick="closeReset()" style="margin-top:10px; background:#444;">Cancel</button>
  </div>
</div>

<script>

const API = "https://vitalink-app.netlify.app/.netlify/functions";

const firebaseConfig = {
  apiKey: "AIzaSyCTZiiluPy5ydX62RfM-E7f8EIWHNG12S8",
  authDomain: "vitalink-7e832.firebaseapp.com",
  projectId: "vitalink-7e832",
  storageBucket: "vitalink-7e832.firebasestorage.app",
  messagingSenderId: "776534002769",
  appId: "1:776534002769:web:f2460535613304e12efc70"
};

firebase.initializeApp(firebaseConfig);

let confirmationResult = null;
let currentEmail = null;

document.getElementById("loginBtn").addEventListener("click", login);
document.getElementById("verifyBtn").addEventListener("click", verifyCode);

function showError(msg){
  const el = document.getElementById("error");
  el.innerText = msg;
  el.classList.remove("hidden");
}

// ---------------------- LOGIN
async function login() {

  const email = document.getElementById("email").value.trim();
  const password = document.getElementById("password").value;

  if (!email || !password){
    showError("Enter email and password");
    return;
  }

  currentEmail = email;

  try {

    const res = await fetch(`${API}/agent-login`, {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ email, password })
    });

    if (!res.ok){
      showError("Login failed");
      return;
    }

    const data = await res.json();

    if (data.step === "firebase_2fa") {

      try {

        document.getElementById("recaptcha-container").innerHTML = "";

        const verifier = new firebase.auth.RecaptchaVerifier(
          "recaptcha-container",
          { size: "invisible" }
        );

        await verifier.render();

        confirmationResult = await firebase.auth().signInWithPhoneNumber(
          data.phone,
          verifier
        );

        document.getElementById("step1").classList.add("hidden");
        document.getElementById("step2").classList.remove("hidden");

      } catch (err) {
        console.error("2FA ERROR:", err);
        showError(err.message || "SMS failed");
      }

      return;
    }

    if (data.step === "login_success") {
      sessionStorage.setItem("agentSessionToken", data.token);
      window.location.href = "agent-report.html";
      return;
    }

    showError("Unexpected response");

  } catch (err) {
    console.error("LOGIN ERROR:", err);
    showError("Something went wrong");
  }
}

// ---------------------- VERIFY
async function verifyCode() {

  const code = document.getElementById("smsCode").value.trim();
  if (!code){
    showError("Enter code");
    return;
  }

  try {

    const result = await confirmationResult.confirm(code);
    const idToken = await result.user.getIdToken();

    const res = await fetch(`${API}/agent-verify`, {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ idToken, email: currentEmail })
    });

    if (!res.ok){
      showError("Verification failed");
      return;
    }

    const data = await res.json();

    sessionStorage.setItem("agentSessionToken", data.token);
    window.location.href = "agent-report.html";

  } catch (err) {
    console.error("VERIFY ERROR:", err);
    showError("Invalid code");
  }
}

// ---------------------- RESET UI
function openReset(){
  document.getElementById("resetModal").classList.add("active");
}

function closeReset(){
  document.getElementById("resetModal").classList.remove("active");
}

// ---------------------- REQUEST RESET CODE
async function requestReset(){

  const email = document.getElementById("resetEmail").value;

  if (!email){
    showError("Enter email");
    return;
  }

  const res = await fetch(`${API}/request_reset`, {
    method:"POST",
    headers:{ "Content-Type":"application/json" },
    body: JSON.stringify({
      emailOrPhone: email,
      role: "agents"
    })
  });

  const data = await res.json();

  if (data.success){
    alert("Reset code sent");
  } else {
    showError(data.error || "Failed to send code");
  }
}

// ---------------------- SUBMIT RESET
async function submitReset(){

  const email = document.getElementById("resetEmail").value;
  const code = document.getElementById("resetCode").value;
  const password = document.getElementById("resetPassword").value;

  if (!email || !code || !password){
    showError("Fill all fields");
    return;
  }

  const res = await fetch(`${API}/reset_password`, {
    method:"POST",
    headers:{ "Content-Type":"application/json" },
    body: JSON.stringify({
      emailOrPhone: email,
      code: code,
      newPassword: password,
      role: "agents"
    })
  });

  const data = await res.json();

  if (data.success){
    alert("Password reset successful");
    closeReset();
  } else {
    showError(data.error || "Reset failed");
  }
}

</script>

</body>
</html>
