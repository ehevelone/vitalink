<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>VitaLink — Agent Onboarding</title>
<meta name="robots" content="noindex, nofollow" />

<style>

body{
margin:0;
background:#0c0c0c;
color:#eaeaea;
font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
display:flex;
align-items:center;
justify-content:center;
height:100vh;
text-align:center;
}

.box{
max-width:420px;
padding:30px;
}

h2{
margin-bottom:10px;
}

p{
color:#b5b5b5;
margin-bottom:20px;
}

.open-btn{
display:block;
margin-top:16px;
padding:16px;
border-radius:999px;
background:#7cc6e8;
color:#000;
text-decoration:none;
font-weight:600;
}

.store{
margin-top:20px;
}

.store img{
width:200px;
display:block;
margin:12px auto;
}

.version{
margin-top:20px;
font-size:12px;
color:#666;
}

</style>
<link rel="stylesheet" href="../typography.css">
</head>

<body>

<div class="box">

<h2>Welcome to VitaLink</h2>

<p id="status">Preparing your agent enrollment…</p>

<a id="openApp" class="open-btn">
Open VitaLink App
</a>

<div class="store">

<a href="https://play.google.com/store/apps/details?id=YOUR_APP_ID">
<img src="https://upload.wikimedia.org/wikipedia/commons/7/78/Google_Play_Store_badge_EN.svg">
</a>

<a href="https://apps.apple.com/app/idYOUR_APP_ID">
<img src="https://developer.apple.com/assets/elements/badges/download-on-the-app-store.svg">
</a>

</div>

<div class="version">
Build: AGENT_ONBOARD_V4
</div>

</div>

<script>

console.log("AGENT_ONBOARD_V4 loaded");

const params = new URLSearchParams(window.location.search);
const code = params.get("code");

const status = document.getElementById("status");
const openBtn = document.getElementById("openApp");

if(code){

localStorage.setItem("agentUnlockCode", code);

status.innerText =
"Agent code saved. Opening VitaLink…";

/* 🔹 Route through REGISTER so Terms cannot be skipped */
const deepLink = `vitalink://register?code=${encodeURIComponent(code)}`;

openBtn.href = deepLink;

/* Attempt auto-open */
setTimeout(()=>{
window.location.href = deepLink;
},700);

}else{

status.innerText =
"Invalid or missing agent code.";

openBtn.style.display="none";

}

</script>

<script src="../site-traffic.js" defer></script>
</body>
</html>
