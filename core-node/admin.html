<!-- ADMIN ACCESS LOGIN - ROLE BASED ROUTING - 2026-02-23 -->
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>VitaLink — Admin Access</title>
<meta name="robots" content="noindex, nofollow" />

<style>
:root{
  --bg-black:#0c0c0c;
  --card:#111;
  --text-primary:#eaeaea;
  --text-muted:#b5b5b5;
  --accent-blue:#7cc6e8;
  --divider:#1e1e1e;
}
body{
  margin:0;
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto;
  background:var(--bg-black);
  color:var(--text-primary);
  display:flex;
  justify-content:center;
  align-items:center;
  height:100vh;
}
.card{
  background:var(--card);
  border:1px solid var(--divider);
  border-radius:14px;
  padding:40px;
  width:100%;
  max-width:400px;
}
h1{
  margin-top:0;
  margin-bottom:30px;
  font-size:1.5rem;
}
input{
  width:100%;
  padding:12px;
  margin-bottom:16px;
  border-radius:8px;
  border:1px solid var(--divider);
  background:#000;
  color:#fff;
}
button{
  width:100%;
  padding:12px;
  border-radius:999px;
  border:none;
  background:var(--accent-blue);
  font-weight:600;
  cursor:pointer;
}
.hidden{display:none;}
.error{ color:#ff6b6b; margin-bottom:12px; }

.link{
  text-align:center;
  margin-top:10px;
  font-size:0.9rem;
  color:var(--accent-blue);
  cursor:pointer;
}
</style>

<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
</head>

<body>

<div class="card">
  <h1>Admin Access</h1>
  <div id="error" class="error hidden"></div>

  <!-- LOGIN -->
  <div id="step1">
    <input type="email" id="email" placeholder="Email" />
    <input type="password" id="password" placeholder="Password" />
    <button id="loginBtn">Login</button>

    <div class="link" onclick="showReset()">Forgot Password?</div>
  </div>

  <!-- 2FA -->
  <div id="step2" class="hidden">
    <input type="text" id="smsCode" placeholder="Enter 6-digit code" />
    <button id="verifyBtn">Verify Code</button>
  </div>

  <!-- RESET REQUEST -->
  <div id="reset1" class="hidden">
    <input type="email" id="resetEmail" placeholder="Enter your email" />
    <button onclick="sendReset()">Send Code</button>
  </div>

  <!-- RESET CONFIRM -->
  <div id="reset2" class="hidden">
    <input type="text" id="resetCode" placeholder="Enter code" />
    <input type="password" id="newPassword" placeholder="New password" />
    <button onclick="confirmReset()">Reset Password</button>
  </div>

  <div id="recaptcha-container"></div>
</div>

<script>

const API = "https://vitalink-app.netlify.app/.netlify/functions";

const firebaseConfig = {
  apiKey: "AIzaSyCTZiiluPy5ydX62RfM-E7f8EIWHNG12S8",
  authDomain: "vitalink-7e832.firebaseapp.com",
  projectId: "vitalink-7e832",
};

firebase.initializeApp(firebaseConfig);

let confirmationResult = null;
let currentEmail = null;

document.getElementById("loginBtn").addEventListener("click", login);
document.getElementById("verifyBtn").addEventListener("click", verifyCode);

function showError(msg){
  const el = document.getElementById("error");
  el.innerText = msg;
  el.classList.remove("hidden");
}

// ---------------- LOGIN ----------------
async function login() {

  const email = document.getElementById("email").value.trim();
  const password = document.getElementById("password").value;

  if (!email || !password){
    showError("Enter email and password");
    return;
  }

  currentEmail = email;

  const res = await fetch(`${API}/admin-login`, {
    method:"POST",
    headers:{ "Content-Type":"application/json" },
    body: JSON.stringify({ email, password })
  });

  if (!res.ok){
    showError("Login failed");
    return;
  }

  const data = await res.json();

  if (data.step === "firebase_2fa") {

    document.getElementById("recaptcha-container").innerHTML = "";

    const verifier = new firebase.auth.RecaptchaVerifier(
      "recaptcha-container",
      { size:"invisible" }
    );

    await verifier.render();

    confirmationResult = await firebase.auth().signInWithPhoneNumber(
      data.phone,
      verifier
    );

    document.getElementById("step1").classList.add("hidden");
    document.getElementById("step2").classList.remove("hidden");
    return;
  }

  if (data.step === "login_success") {

    sessionStorage.setItem("adminSessionToken", data.token);
    sessionStorage.setItem("userRole", data.role);

    if (data.role === "admin") {
      window.location.href = "admin_report.html";
    } else {
      window.location.href = "rsm_report.html";
    }
  }
}

// ---------------- VERIFY ----------------
async function verifyCode() {

  const code = document.getElementById("smsCode").value.trim();
  if (!code) return;

  const result = await confirmationResult.confirm(code);
  const idToken = await result.user.getIdToken();

  const res = await fetch(`${API}/admin-verify`, {
    method:"POST",
    headers:{ "Content-Type":"application/json" },
    body: JSON.stringify({ idToken, email: currentEmail })
  });

  if (!res.ok) return;

  const data = await res.json();

  sessionStorage.setItem("adminSessionToken", data.token);
  sessionStorage.setItem("userRole", data.role);

  if (data.role === "admin") {
    window.location.href = "admin_report.html";
  } else {
    window.location.href = "rsm_report.html";
  }
}

// ---------------- RESET FLOW ----------------
function showReset(){
  document.getElementById("step1").classList.add("hidden");
  document.getElementById("reset1").classList.remove("hidden");
}

async function sendReset(){

  const email = document.getElementById("resetEmail").value;

  const res = await fetch(`${API}/request_reset`, {
    method:"POST",
    headers:{ "Content-Type":"application/json" },
    body: JSON.stringify({
      emailOrPhone: email,
      role: "agents"
    })
  });

  const data = await res.json();

  if (data.success){
    currentEmail = email;
    document.getElementById("reset1").classList.add("hidden");
    document.getElementById("reset2").classList.remove("hidden");
  } else {
    showError(data.error || "Failed to send code");
  }
}

async function confirmReset(){

  const code = document.getElementById("resetCode").value;
  const password = document.getElementById("newPassword").value;

  const res = await fetch(`${API}/reset_password`, {
    method:"POST",
    headers:{ "Content-Type":"application/json" },
    body: JSON.stringify({
      emailOrPhone: currentEmail,
      code,
      newPassword: password,
      role: "agents"
    })
  });

  const data = await res.json();

  if (data.success){
    alert("Password reset successful");
    window.location.reload();
  } else {
    showError(data.error || "Reset failed");
  }
}

</script>

</body>
</html>
