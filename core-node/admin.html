<!-- ADMIN ACCESS LOGIN - RSM STYLE (LOGIC UNCHANGED) -->
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>VitaLink — Admin Access</title>
<meta name="robots" content="noindex, nofollow" />

<style>
:root {
  --bg-black: #0c0c0c;
  --text-primary: #eaeaea;
  --text-muted: #b5b5b5;
  --accent-blue: #7cc6e8;
  --divider: #1e1e1e;
  --card-bg: #111;
  --danger: #ff5a5a;
}

* { box-sizing: border-box; }

body {
  margin: 0;
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
  background: var(--bg-black);
  color: var(--text-primary);
}

main {
  max-width: 520px;
  margin: 0 auto;
  padding: 60px 24px;
}

.logo {
  max-width: 180px;
  margin: 0 auto 40px auto;
  display: block;
}

h1 {
  text-align: center;
  font-size: 2rem;
  margin-bottom: 10px;
}

.sub {
  text-align: center;
  color: var(--text-muted);
  margin-bottom: 36px;
  font-size: 0.95rem;
}

.card {
  background: var(--card-bg);
  border: 1px solid var(--divider);
  border-radius: 12px;
  padding: 28px;
}

.field { margin-bottom: 18px; }

label {
  display: block;
  font-size: 0.85rem;
  margin-bottom: 6px;
  color: var(--text-muted);
}

input {
  width: 100%;
  padding: 12px;
  border-radius: 8px;
  border: 1px solid var(--divider);
  background: #000;
  color: #fff;
  font-size: 0.95rem;
}

button {
  width: 100%;
  padding: 14px;
  border-radius: 999px;
  border: none;
  background: var(--accent-blue);
  color: #000;
  font-weight: 600;
  font-size: 0.95rem;
  cursor: pointer;
  margin-top: 10px;
}

.forgot {
  text-align: center;
  margin-top: 14px;
  font-size: 0.85rem;
  color: var(--accent-blue);
  cursor: pointer;
}

.forgot:hover {
  text-decoration: underline;
}

.result {
  margin-top: 16px;
  text-align: center;
  font-size: 0.9rem;
  min-height: 22px;
}

.error { color: var(--danger); }

.hidden { display:none; }

footer {
  margin-top: 60px;
  text-align: center;
  color: #666;
  font-size: 0.8rem;
}
</style>

<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
</head>

<body>

<main>

<img src="../images/vitalink-logo-1.png" class="logo" />

<h1>Admin Access</h1>
<div class="sub">Secure login for admin and RSM access</div>

<div class="card">

<div id="error" class="result error hidden"></div>

<!-- LOGIN -->
<div id="step1">
  <div class="field">
    <label>Email</label>
    <input type="email" id="email" />
  </div>

  <div class="field">
    <label>Password</label>
    <input type="password" id="password" />
    <div style="margin-top:6px; font-size:0.8rem; color:#7cc6e8; cursor:pointer;" onclick="togglePassword('password')">
      Show Password
    </div>
  </div>

  <button id="loginBtn">Login</button>

  <div class="forgot" onclick="showReset()">Forgot your password?</div>
</div>

<!-- 2FA -->
<div id="step2" class="hidden">
  <div class="field">
    <label>Verification Code</label>
    <input type="text" id="smsCode" />
  </div>
  <button id="verifyBtn">Verify Code</button>
</div>

<!-- RESET REQUEST -->
<div id="reset1" class="hidden">
  <div class="field">
    <label>Email</label>
    <input type="email" id="resetEmail" />
  </div>
  <button onclick="sendReset()">Send Code</button>
</div>

<!-- RESET CONFIRM -->
<div id="reset2" class="hidden">
  <div class="field">
    <label>Code</label>
    <input type="text" id="resetCode" />
  </div>

  <div class="field">
    <label>New Password</label>
    <input type="password" id="newPassword" />
    <div style="margin-top:6px; font-size:0.8rem; color:#7cc6e8; cursor:pointer;" onclick="togglePassword('newPassword')">
      Show Password
    </div>
  </div>

  <button onclick="confirmReset()">Reset Password</button>
</div>

<div id="recaptcha-container"></div>

</div>

<footer>
© 2026 VitaLink. All rights reserved.
</footer>

</main>

<script>
const API = "https://vitalink-app.netlify.app/.netlify/functions";

const firebaseConfig = {
  apiKey: "AIzaSyCTZiiluPy5ydX62RfM-E7f8EIWHNG12S8",
  authDomain: "vitalink-7e832.firebaseapp.com",
  projectId: "vitalink-7e832",
};

firebase.initializeApp(firebaseConfig);

let confirmationResult = null;
let currentEmail = null;

document.getElementById("loginBtn").addEventListener("click", login);
document.getElementById("verifyBtn").addEventListener("click", verifyCode);

// 🔥 NEW (ONLY ADDITION)
function togglePassword(id) {
  const input = document.getElementById(id);
  input.type = input.type === "password" ? "text" : "password";
}

function showError(msg){
  const el = document.getElementById("error");
  el.innerText = msg;
  el.classList.remove("hidden");
}

// ---------------- LOGIN ----------------
async function login() {

  const email = document.getElementById("email").value.trim();
  const password = document.getElementById("password").value;

  if (!email || !password){
    showError("Enter email and password");
    return;
  }

  currentEmail = email;

  const res = await fetch(`${API}/admin-login`, {
    method:"POST",
    headers:{ "Content-Type":"application/json" },
    body: JSON.stringify({ email, password })
  });

  if (!res.ok){
    showError("Login failed");
    return;
  }

  const data = await res.json();

  if (data.step === "firebase_2fa") {

    document.getElementById("recaptcha-container").innerHTML = "";

    const verifier = new firebase.auth.RecaptchaVerifier(
      "recaptcha-container",
      { size:"invisible" }
    );

    await verifier.render();

    confirmationResult = await firebase.auth().signInWithPhoneNumber(
      data.phone,
      verifier
    );

    document.getElementById("step1").classList.add("hidden");
    document.getElementById("step2").classList.remove("hidden");
    return;
  }

  if (data.step === "login_success") {

    sessionStorage.setItem("adminSessionToken", data.token);
    sessionStorage.setItem("userRole", data.role);

    if (data.role === "admin") {
      window.location.href = "admin_report.html";
    } else {
      window.location.href = "rsm_report.html";
    }
  }
}

// ---------------- VERIFY ----------------
async function verifyCode() {

  const code = document.getElementById("smsCode").value.trim();
  if (!code) return;

  const result = await confirmationResult.confirm(code);
  const idToken = await result.user.getIdToken();

  const res = await fetch(`${API}/admin-verify`, {
    method:"POST",
    headers:{ "Content-Type":"application/json" },
    body: JSON.stringify({ idToken, email: currentEmail })
  });

  if (!res.ok) return;

  const data = await res.json();

  sessionStorage.setItem("adminSessionToken", data.token);
  sessionStorage.setItem("userRole", data.role);

  if (data.role === "admin") {
    window.location.href = "admin_report.html";
  } else {
    window.location.href = "rsm_report.html";
  }
}

// ---------------- RESET FLOW ----------------
function showReset(){
  document.getElementById("step1").classList.add("hidden");
  document.getElementById("reset1").classList.remove("hidden");
}

async function sendReset(){

  const email = document.getElementById("resetEmail").value;

  const res = await fetch(`${API}/request_reset`, {
    method:"POST",
    headers:{ "Content-Type":"application/json" },
    body: JSON.stringify({
      emailOrPhone: email,
      role: "agents"
    })
  });

  const data = await res.json();

  if (data.success){
    currentEmail = email;
    document.getElementById("reset1").classList.add("hidden");
    document.getElementById("reset2").classList.remove("hidden");
  } else {
    showError(data.error || "Failed to send code");
  }
}

async function confirmReset(){

  const code = document.getElementById("resetCode").value;
  const password = document.getElementById("newPassword").value;

  const res = await fetch(`${API}/reset_password`, {
    method:"POST",
    headers:{ "Content-Type":"application/json" },
    body: JSON.stringify({
      emailOrPhone: currentEmail,
      code,
      newPassword: password,
      role: "agents"
    })
  });

  const data = await res.json();

  if (data.success){
    alert("Password reset successful");
    window.location.reload();
  } else {
    showError(data.error || "Reset failed");
  }
}
</script>

</body>
</html>
