<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Agent Dashboard</title>

<style>
:root{
  --bg:#000000;
  --card:#111;
  --text:#eaeaea;
  --muted:#b5b5b5;
  --accent:#7cc6e8;
  --border:#1e1e1e;
}
body{
  margin:0;
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto;
  background:var(--bg);
  color:var(--text);
}
header{
  padding:20px;
  border-bottom:1px solid var(--border);
  display:flex;
  justify-content:space-between;
}
.container{
  padding:20px;
  max-width:900px;
  margin:auto;
}
.card{
  background:var(--card);
  border:1px solid var(--border);
  border-radius:14px;
  padding:16px;
  margin-bottom:12px;
}
.meta{
  color:var(--muted);
  font-size:0.9rem;
}
.badge{
  padding:4px 10px;
  border-radius:999px;
  font-size:0.8rem;
  margin:4px 4px 4px 0;
  display:inline-block;
}
.active{ background:#1e8e3e; }
.inactive{ background:#444; }

button{
  background:var(--accent);
  border:none;
  padding:8px 14px;
  border-radius:999px;
  cursor:pointer;
}

.controls{
  display:flex;
  gap:10px;
  margin-bottom:16px;
  flex-wrap:wrap;
}

input{
  padding:10px;
  border-radius:8px;
  border:1px solid var(--border);
  background:#000;
  color:#fff;
}

.filter-btn{ background:#222; }
.filter-active{ background:var(--accent); color:#000; }

.detail{
  margin-top:10px;
  padding:10px;
  border-top:1px solid var(--border);
}
</style>
</head>

<body>

<header>
  <h2 id="welcome">Agent Dashboard</h2>
  <button onclick="logout()">Logout</button>
</header>

<div class="container">

  <div class="controls">
    <input id="search" placeholder="Search clients..." oninput="applyFilters()" />

    <button class="filter-btn filter-active" onclick="setFilter(event,'all')">All</button>
    <button class="filter-btn" onclick="setFilter(event,'active')">Active</button>
    <button class="filter-btn" onclick="setFilter(event,'inactive')">Inactive</button>

    <button onclick="downloadCSV()">Export CSV</button>
    <button onclick="window.print()">Print</button>
  </div>

  <div id="stats" class="card"></div>
  <div id="clients"></div>

</div>

<script>

const API = "https://vitalink-app.netlify.app/.netlify/functions";
const token = sessionStorage.getItem("agentSessionToken");

let CLIENTS = [];
let FILTER = "all";
let SEARCH = "";

if (!token) {
  window.location.href = "agent-login.html";
}

// ----------------------
function logout(){
  sessionStorage.removeItem("agentSessionToken");
  sessionStorage.removeItem("agentId");
  window.location.href = "agent-login.html";
}

// ----------------------
async function loadClients(){

  const agentId = sessionStorage.getItem("agentId");

  if (!agentId){
    alert("Missing agent session");
    window.location.href = "agent-login.html";
    return;
  }

  const id = Number(agentId);

  console.log("🚀 CALLING API with agentId:", id);

  try {

    const res = await fetch(`${API}/get_agent_clients`, {
      method:"POST",
      headers:{
        "Content-Type":"application/json",
      },
      body: JSON.stringify({ agentId: id })
    });

    console.log("📡 STATUS:", res.status);

    const text = await res.text();
    console.log("📦 RAW RESPONSE:", text);

    let data;
    try {
      data = JSON.parse(text);
    } catch (e) {
      alert("Invalid server response");
      return;
    }

    console.log("📥 PARSED:", data);

    if (!data.success){
      alert(data.error || "Failed to load clients");
      return;
    }

    CLIENTS = data.clients || [];

    console.log("👥 CLIENT COUNT:", CLIENTS.length);

    if (data.agent){
      const name = data.agent.name || "";
      document.getElementById("welcome").innerText =
        name ? `Welcome, ${name}` : "Agent Dashboard";
    }

    applyFilters();

  } catch (e) {
    console.error("❌ FETCH ERROR:", e);
    alert("Request failed — check console");
  }
}

// ----------------------
function applyFilters(){

  SEARCH = document.getElementById("search").value.toLowerCase();

  let filtered = CLIENTS.filter(c => {

    const name = ((c.first_name||"") + " " + (c.last_name||"")).toLowerCase();
    const email = (c.email||"").toLowerCase();
    const phone = (c.phone||"");

    const matchesSearch =
      name.includes(SEARCH) ||
      email.includes(SEARCH) ||
      phone.includes(SEARCH);

    const matchesFilter =
      FILTER === "all" ||
      (FILTER === "active" && c.active) ||
      (FILTER === "inactive" && !c.active);

    return matchesSearch && matchesFilter;
  });

  render(filtered);
}

// ----------------------
function setFilter(e,type){
  FILTER = type;
  document.querySelectorAll(".filter-btn").forEach(btn=>{
    btn.classList.remove("filter-active");
  });
  e.target.classList.add("filter-active");
  applyFilters();
}

// ----------------------
function render(list){

  renderStats();

  const container = document.getElementById("clients");

  container.innerHTML = list.map(c => `
      <div class="card">
        <div><b>${c.first_name || ""} ${c.last_name || ""}</b></div>
        <div class="meta">${c.email || ""}</div>
        <div class="meta">${c.phone || ""}</div>
      </div>
  `).join("");
}

// ----------------------
function renderStats(){
  document.getElementById("stats").innerHTML =
    `Total: <b>${CLIENTS.length}</b>`;
}

// ----------------------
function downloadCSV(){}

loadClients();

</script>

</body>
</html>
