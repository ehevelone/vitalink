<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>VitaLink — Agent Dashboard</title>

<style>

:root{
  --bg:#000000;
  --card:#111;
  --text:#eaeaea;
  --border:#1e1e1e;
}

body{
  margin:0;
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  background:var(--bg);
  color:var(--text);
}

/* HEADER */
.header{
  display:flex;
  justify-content:space-between;
  align-items:center;
  padding:20px 30px;
  border-bottom:1px solid var(--border);
}

.logout{
  padding:8px 16px;
  border-radius:999px;
  border:none;
  background:#e74c3c;
  color:#fff;
  cursor:pointer;
}

/* CONTAINER */
.container{
  padding:30px;
}

/* CARD */
.card{
  background:var(--card);
  border:1px solid var(--border);
  border-radius:12px;
  padding:20px;
  margin-bottom:20px;
}

/* SEARCH + ACTIONS */
.top-bar{
  display:flex;
  gap:10px;
  flex-wrap:wrap;
  margin-bottom:20px;
}

.top-bar input{
  flex:1;
  padding:10px;
  border-radius:6px;
  border:1px solid var(--border);
  background:#000;
  color:#fff;
}

/* TABLE */
table{
  width:100%;
  border-collapse:collapse;
}

th,td{
  padding:12px;
  border-bottom:1px solid var(--border);
}

th{
  color:#999;
}

tr:nth-child(even){
  background:rgba(255,255,255,.03);
}

tr:hover{
  background:rgba(255,255,255,.08);
  cursor:pointer;
}

/* BUTTON */
button.primary{
  padding:6px 12px;
  border-radius:999px;
  border:none;
  background:#7cc6e8;
  cursor:pointer;
}

/* MODAL */
.modal{
  position:fixed;
  inset:0;
  background:rgba(0,0,0,.8);
  display:none;
  align-items:center;
  justify-content:center;
}

.modal.active{ display:flex; }

.modal-card{
  background:#111;
  padding:20px;
  border-radius:12px;
  width:300px;
  border:1px solid var(--border);
}

@media print{
  body{
    background:#fff;
    color:#000;
  }
  .header, .top-bar, button{
    display:none;
  }
}

</style>
</head>

<body>

<div class="header">
  <h1>Agent Dashboard</h1>
  <button class="logout" onclick="logout()">Logout</button>
</div>

<div class="container">

<div class="card">

<h2>Your Clients</h2>

<div class="top-bar">
  <input id="searchInput" placeholder="Search clients..." />
  <button class="primary" onclick="loadClients()">Search</button>
  <button class="primary" onclick="downloadCSV()">CSV</button>
  <button class="primary" onclick="window.print()">Print</button>
</div>

<table>
<thead>
<tr>
<th>Name</th>
<th>Email</th>
<th>Status</th>
<th>Action</th>
</tr>
</thead>

<tbody id="clientTable"></tbody>

</table>

</div>

</div>

<!-- CLIENT DETAIL MODAL -->
<div id="clientModal" class="modal">
  <div class="modal-card">
    <h3 id="modalName"></h3>
    <p id="modalEmail"></p>
    <p id="modalStatus"></p>
    <button onclick="closeModal()">Close</button>
  </div>
</div>

<script>

const API="https://vitalink-app.netlify.app/.netlify/functions";

const token=sessionStorage.getItem("agentSessionToken");
const agentId=sessionStorage.getItem("agentId");

if(!token||!agentId){
  window.location.href="agent-login.html";
}

function logout(){
  sessionStorage.clear();
  window.location.href="agent-login.html";
}

let allClients=[];

// LOAD
async function loadClients(){

  if(allClients.length===0){
    const res=await fetch(`${API}/get_agent_clients`,{
      method:"POST",
      headers:{ "Content-Type":"application/json" },
      body:JSON.stringify({ agentId:Number(agentId) })
    });

    const data=await res.json();
    allClients=data.clients||[];
  }

  let clients=[...allClients];

  // SEARCH
  const search=document.getElementById("searchInput").value.toLowerCase();

  if(search){
    clients=clients.filter(c=>{
      const name=(c.first_name+" "+c.last_name).toLowerCase();
      const email=(c.email||"").toLowerCase();
      return name.includes(search)||email.includes(search);
    });
  }

  // SORT
  clients.sort((a,b)=>{
    if(a.active!==b.active){
      return a.active?-1:1;
    }
    const aName=(a.first_name+" "+a.last_name).toLowerCase();
    const bName=(b.first_name+" "+b.last_name).toLowerCase();
    return aName.localeCompare(bName);
  });

  const tbody=document.getElementById("clientTable");

  tbody.innerHTML=clients.map(c=>`
    <tr onclick="openClient('${c.id}')">
      <td>${c.first_name||""} ${c.last_name||""}</td>
      <td>${c.email||""}</td>
      <td>${c.active?"Active":"Inactive"}</td>
      <td>
        <button class="primary"
        onclick="event.stopPropagation();confirmToggle('${c.id}','${c.first_name}','${c.active}')">
        ${c.active?"Deactivate":"Activate"}
        </button>
      </td>
    </tr>
  `).join("");
}

// CONFIRM TOGGLE
function confirmToggle(id,name,isActive){

  const action=isActive==="true"||isActive===true?"DEACTIVATE":"ACTIVATE";

  const ok=confirm(`${action} client:\n\n${name}`);

  if(!ok) return;

  toggleClient(id);
}

// TOGGLE
async function toggleClient(id){

  await fetch(`${API}/agent-toggle-client`,{
    method:"POST",
    headers:{ "Content-Type":"application/json" },
    body:JSON.stringify({ clientId:id })
  });

  allClients=[];
  loadClients();
}

// CSV
function downloadCSV(){

  let csv="Name,Email,Status\n";

  allClients.forEach(c=>{
    csv+=`"${c.first_name} ${c.last_name}","${c.email}","${c.active}"\n`;
  });

  const blob=new Blob([csv],{type:"text/csv"});
  const url=URL.createObjectURL(blob);

  const a=document.createElement("a");
  a.href=url;
  a.download="clients.csv";
  a.click();
}

// MODAL
function openClient(id){

  const c=allClients.find(x=>x.id==id);

  document.getElementById("modalName").innerText=
    `${c.first_name} ${c.last_name}`;

  document.getElementById("modalEmail").innerText=c.email;
  document.getElementById("modalStatus").innerText=
    c.active?"Active":"Inactive";

  document.getElementById("clientModal").classList.add("active");
}

function closeModal(){
  document.getElementById("clientModal").classList.remove("active");
}

loadClients();

</script>

</body>
</html>
