<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>VitaLink — Agent Dashboard</title>

<style>

:root{
  --bg:#000000;
  --card:#111;
  --text:#eaeaea;
  --border:#1e1e1e;
}

body{
  margin:0;
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  background:var(--bg);
  color:var(--text);
}

/* HEADER */
.header{
  display:flex;
  justify-content:space-between;
  align-items:center;
  padding:20px 30px;
  border-bottom:1px solid var(--border);
}

.logout{
  padding:8px 16px;
  border-radius:999px;
  border:none;
  background:#e74c3c;
  color:#fff;
  cursor:pointer;
}

/* CONTAINER */
.container{
  padding:30px;
}

/* CARD */
.card{
  background:var(--card);
  border:1px solid var(--border);
  border-radius:12px;
  padding:20px;
  margin-bottom:20px;
}

/* SEARCH + ACTIONS */
.top-bar{
  display:flex;
  gap:10px;
  flex-wrap:wrap;
  margin-bottom:20px;
}

.top-bar input{
  flex:1;
  padding:10px;
  border-radius:6px;
  border:1px solid var(--border);
  background:#000;
  color:#fff;
}

/* TABLE */
table{
  width:100%;
  border-collapse:collapse;
}

th,td{
  padding:12px;
  border-bottom:1px solid var(--border);
}

th{
  color:#999;
}

tr:nth-child(even){
  background:rgba(255,255,255,.03);
}

tr:hover{
  background:rgba(255,255,255,.08);
  cursor:pointer;
}

/* BUTTON */
button.primary{
  padding:6px 12px;
  border-radius:999px;
  border:none;
  background:#7cc6e8;
  cursor:pointer;
}

.onboard-grid{
  display:grid;
  grid-template-columns:repeat(2,minmax(0,1fr));
  gap:10px;
  margin-top:12px;
}

.onboard-grid input{
  width:100%;
  padding:10px;
  border-radius:6px;
  border:1px solid var(--border);
  background:#000;
  color:#fff;
}

.wide{ grid-column:1/3; }

.section-title{
  margin:16px 0 6px;
  font-weight:700;
}

.checkbox-row{
  display:flex;
  gap:8px;
  align-items:center;
  margin-top:10px;
}

.onboard-result{
  display:none;
  margin-top:12px;
  padding:12px;
  border:1px solid #28475c;
  border-radius:8px;
  background:#07131b;
  word-break:break-word;
}

.modal-card.large{
  width:min(760px,92vw);
  max-height:88vh;
  overflow:auto;
}

.modal-actions{
  display:flex;
  gap:10px;
  flex-wrap:wrap;
  margin-top:14px;
}

/* MODAL */
.modal{
  position:fixed;
  inset:0;
  background:rgba(0,0,0,.8);
  display:none;
  align-items:center;
  justify-content:center;
}

.modal.active{ display:flex; }

.modal-card{
  background:#111;
  padding:20px;
  border-radius:12px;
  width:300px;
  border:1px solid var(--border);
}

@media print{
  body{
    background:#fff;
    color:#000;
  }
  .header, .top-bar, button{
    display:none;
  }
}

</style>
<link rel="stylesheet" href="../typography.css">
</head>

<body>

<div class="header">
  <h1>Agent Dashboard</h1>
  <button class="logout" onclick="logout()">Logout</button>
</div>

<div class="container">

<div class="card">

<h2>Your Clients</h2>

<div class="top-bar">
  <input id="searchInput" placeholder="Search clients..." />
  <button class="primary" onclick="loadClients()">Search</button>
  <button class="primary" onclick="downloadCSV()">CSV</button>
  <button class="primary" onclick="window.print()">Print</button>
  <input id="inviteEmail" placeholder="Client email..." style="max-width:220px;" />
  <button class="primary" onclick="sendInvite()">Send Invite</button>
  <button class="primary" onclick="openOnboardClientModal()">Onboard Client</button>
</div>

<table>
<thead>
<tr>
<th>Name</th>
<th>Email</th>
<th>Phone</th>
<th>Address</th>
<th>Status</th>
<th>Push</th>
<th>Action</th>
</tr>
</thead>

<tbody id="clientTable"></tbody>

</table>

</div>

</div>

<!-- CLIENT DETAIL MODAL -->
<div id="clientModal" class="modal">
  <div class="modal-card">
    <h3 id="modalName"></h3>
    <p id="modalEmail"></p>
    <p id="modalStatus"></p>
    <button onclick="closeModal()">Close</button>
  </div>
</div>

<!-- ASSISTED CLIENT ONBOARDING MODAL -->
<div id="onboardClientModal" class="modal">
  <div class="modal-card large">
    <h3>Onboard Client</h3>
    <p style="color:#aaa;margin-top:0;">
      Create a 2-hour setup link while sitting with the client. If it expires, start over.
    </p>

    <div class="onboard-grid">
      <input id="onboardFullName" type="text" placeholder="Full Name">
      <input id="onboardDob" type="date">
      <input id="onboardPhone" type="text" placeholder="Phone">
      <input id="onboardEmail" type="email" placeholder="Email">
      <input id="onboardAddress" type="text" placeholder="Address" class="wide">
      <input id="onboardCity" type="text" placeholder="City">
      <input id="onboardState" type="text" placeholder="State">
      <input id="onboardZip" type="text" placeholder="ZIP">
    </div>

    <div class="section-title">Emergency Information</div>

    <div class="onboard-grid">
      <input id="onboardEmergencyName1" type="text" placeholder="Emergency Contact 1">
      <input id="onboardEmergencyPhone1" type="text" placeholder="Emergency Phone 1">
      <input id="onboardEmergencyName2" type="text" placeholder="Emergency Contact 2">
      <input id="onboardEmergencyPhone2" type="text" placeholder="Emergency Phone 2">
      <input id="onboardEmergencyName3" type="text" placeholder="Emergency Contact 3">
      <input id="onboardEmergencyPhone3" type="text" placeholder="Emergency Phone 3">
      <input id="onboardBloodType" type="text" placeholder="Blood Type">
      <label class="checkbox-row">
        <input id="onboardOrganDonor" type="checkbox">
        <span>Organ Donor</span>
      </label>
      <input id="onboardAllergies" type="text" placeholder="Allergies" class="wide">
      <input id="onboardConditions" type="text" placeholder="Conditions" class="wide">
      <input id="onboardImplants" type="text" placeholder="Implanted Devices" class="wide">
      <input id="onboardProcedures" type="text" placeholder="Major Procedures" class="wide">
    </div>

    <div class="modal-actions">
      <button class="primary" id="createOnboardBtn" onclick="createAssistedOnboarding()">Create 2-Hour Onboarding Link</button>
      <button onclick="clearOnboardingForm()">Clear</button>
      <button onclick="closeOnboardClientModal()">Close</button>
    </div>

    <div class="onboard-result" id="onboardResult"></div>
  </div>
</div>

<script>

const API="https://vitalink-app.netlify.app/.netlify/functions";

const token=sessionStorage.getItem("agentSessionToken");
const agentId=sessionStorage.getItem("agentId");

if(!token||!agentId){
  window.location.href="agent-login.html";
}

function logout(){
  sessionStorage.clear();
  window.location.href="agent-login.html";
}

let allClients=[];

function pushHealthLabel(client){
  return client.push_health || (client.has_device ? "Registered" : "No Device");
}

function pushHealthStyle(label){
  if(label === "OK") return "background:#16a34a;color:#fff;";
  if(label === "Needs Contact") return "background:#ef4444;color:#fff;";
  if(label === "Stale") return "background:#f59e0b;color:#111;";
  return "background:#374151;color:#fff;";
}

// LOAD
async function loadClients(){

  if(allClients.length===0){
    const res=await fetch(`${API}/get_agent_clients`,{
      method:"POST",
      headers:{ "Content-Type":"application/json" },
      body:JSON.stringify({
        agentId:Number(agentId),
        agentSessionToken:token
      })
    });

    const data=await res.json();
    allClients=data.clients||[];
  }

  let clients=[...allClients];

  const search=document.getElementById("searchInput").value.toLowerCase();

  if(search){
    clients=clients.filter(c=>{
      const name=(c.first_name+" "+c.last_name).toLowerCase();
      const email=(c.email||"").toLowerCase();
      return name.includes(search)||email.includes(search);
    });
  }

  clients.sort((a,b)=>{
    if(a.active!==b.active){
      return a.active?-1:1;
    }
    const aName=(a.first_name+" "+a.last_name).toLowerCase();
    const bName=(b.first_name+" "+b.last_name).toLowerCase();
    return aName.localeCompare(bName);
  });

  const tbody=document.getElementById("clientTable");

  tbody.innerHTML=clients.map(c=>`
    <tr onclick="openClient('${c.id}')">
<td>${c.first_name||""} ${c.last_name||""}</td>
<td>${c.email||""}</td>
<td>${c.phone||""}</td>

<td>
  ${(c.address||"")} ${(c.city||"")}, ${(c.state||"")} ${(c.zip||"")}
</td>

<td>${c.active?"Active":"Inactive"}</td>
<td>
  <span style="display:inline-block;padding:4px 8px;border-radius:999px;font-size:.8rem;${pushHealthStyle(pushHealthLabel(c))}">
    ${pushHealthLabel(c)}
  </span>
</td>
      <td>
        <button class="primary"
        onclick="event.stopPropagation();confirmToggle('${c.id}','${c.first_name}','${c.active}')">
        ${c.active?"Deactivate":"Activate"}
        </button>
      </td>
    </tr>
  `).join("");
}

// CONFIRM
function confirmToggle(id,name,isActive){

  const action=isActive==="true"||isActive===true?"DEACTIVATE":"ACTIVATE";

  const ok=confirm(`${action} client:\n\n${name}`);

  if(!ok) return;

  toggleClient(id);
}

// ✅ FIXED TOGGLE
async function toggleClient(id){

  try{
    const res=await fetch(`${API}/agent-toggle-client`,{
      method:"POST",
      headers:{
        "Content-Type":"application/json"
      },
      body:JSON.stringify({ 
        clientId:id,
        agentId:Number(agentId),
        agentSessionToken:token
      })
    });

    const data=await res.json();

    if(!data.success){
      alert("Update failed");
      return;
    }

    allClients=[];
    await loadClients();

  }catch(e){
    console.error(e);
    alert("Server error");
  }
}

// CSV
function downloadCSV(){

  let csv="Name,Email,Phone,Address,Status\n";

  allClients.forEach(c=>{
   csv+=`"${c.first_name} ${c.last_name}",
"${c.email}",
"${c.phone||""}",
"${c.address||""} ${c.city||""} ${c.state||""} ${c.zip||""}",
"${c.active}"\n`;
  });

  const blob=new Blob([csv],{type:"text/csv"});
  const url=URL.createObjectURL(blob);

  const a=document.createElement("a");
  a.href=url;
  a.download="clients.csv";
  a.click();
}

// MODAL
function openClient(id){

  const c=allClients.find(x=>x.id==id);

  document.getElementById("modalName").innerText=
    `${c.first_name} ${c.last_name}`;

  document.getElementById("modalEmail").innerText=c.email;
  document.getElementById("modalStatus").innerText=
    c.active?"Active":"Inactive";

  document.getElementById("clientModal").classList.add("active");
}

function closeModal(){
  document.getElementById("clientModal").classList.remove("active");
}

function openOnboardClientModal(){
  document.getElementById("onboardClientModal").classList.add("active");
}

function closeOnboardClientModal(){
  document.getElementById("onboardClientModal").classList.remove("active");
}

function onboardValue(id){
  const field=document.getElementById(id);
  return field ? field.value.trim() : "";
}

function normalizePhoneForStorage(phone){
  const digits=String(phone||"").replace(/\D/g,"");

  if(digits.length===10){
    return `(${digits.slice(0,3)}) ${digits.slice(3,6)}-${digits.slice(6)}`;
  }

  return String(phone||"").trim();
}

function collectOnboardEmergencyContacts(){
  const contacts=[];

  for(let index=1;index<=3;index+=1){
    const name=onboardValue(`onboardEmergencyName${index}`);
    const phone=onboardValue(`onboardEmergencyPhone${index}`);

    if(name||phone){
      contacts.push({
        name,
        phone:normalizePhoneForStorage(phone)
      });
    }
  }

  return contacts;
}

function clearOnboardingForm(){
  [
    "onboardFullName",
    "onboardDob",
    "onboardPhone",
    "onboardEmail",
    "onboardAddress",
    "onboardCity",
    "onboardState",
    "onboardZip",
    "onboardEmergencyName1",
    "onboardEmergencyPhone1",
    "onboardEmergencyName2",
    "onboardEmergencyPhone2",
    "onboardEmergencyName3",
    "onboardEmergencyPhone3",
    "onboardBloodType",
    "onboardAllergies",
    "onboardConditions",
    "onboardImplants",
    "onboardProcedures"
  ].forEach((id)=>{
    const field=document.getElementById(id);
    if(field){
      field.value="";
    }
  });

  document.getElementById("onboardOrganDonor").checked=false;
  document.getElementById("onboardResult").style.display="none";
}

async function copyOnboardingLink(link){
  if(navigator.clipboard){
    await navigator.clipboard.writeText(link);
    alert("Onboarding link copied.");
    return;
  }

  const input=document.createElement("input");
  input.value=link;
  document.body.appendChild(input);
  input.select();
  document.execCommand("copy");
  document.body.removeChild(input);
  alert("Onboarding link copied.");
}

async function createAssistedOnboarding(){
  const result=document.getElementById("onboardResult");
  const button=document.getElementById("createOnboardBtn");
  const fullName=onboardValue("onboardFullName");
  const phone=normalizePhoneForStorage(onboardValue("onboardPhone"));
  const email=onboardValue("onboardEmail");

  if(!fullName||(!phone&&!email)){
    alert("Client name and at least one contact method are required.");
    return;
  }

  button.disabled=true;
  button.innerText="Creating Onboarding Link...";
  result.style.display="block";
  result.innerHTML="<strong>Creating onboarding link...</strong>";

  try{
    const res=await fetch("/.netlify/functions/create-assisted-client-onboarding",{
      method:"POST",
      headers:{
        "Content-Type":"application/json",
        "x-agent-session":token
      },
      body:JSON.stringify({
        appAgentId:agentId,
        agentSessionToken:token,
        saveToCrm:false,
        profile:{
          fullName,
          dob:onboardValue("onboardDob"),
          userPhone:phone,
          email,
          address:onboardValue("onboardAddress"),
          city:onboardValue("onboardCity"),
          state:onboardValue("onboardState"),
          zip:onboardValue("onboardZip")
        },
        emergency:{
          contacts:collectOnboardEmergencyContacts(),
          allergies:onboardValue("onboardAllergies"),
          conditions:onboardValue("onboardConditions"),
          bloodType:onboardValue("onboardBloodType"),
          implants:onboardValue("onboardImplants"),
          procedures:onboardValue("onboardProcedures"),
          organDonor:document.getElementById("onboardOrganDonor").checked
        }
      })
    });

    const data=await res.json();

    if(!res.ok||!data.success){
      throw new Error(data.error||"Unable to create onboarding link.");
    }

    const expiresAt=data.expiresAt ? new Date(data.expiresAt).toLocaleString() : "2 hours";

    result.innerHTML=`
      <strong>Onboarding link created.</strong>
      <div>${data.onboardingUrl}</div>
      <div style="color:#aaa;margin-top:6px;">Expires: ${expiresAt}</div>
      <div class="modal-actions">
        <button class="primary" onclick="copyOnboardingLink('${data.onboardingUrl}')">Copy Link</button>
        <button class="primary" onclick="window.location.href='${data.onboardingUrl}'">Open Link</button>
      </div>
    `;
  }catch(e){
    console.error(e);
    result.innerHTML=`<strong>Could not create onboarding link.</strong><br>${e.message||"Please try again."}`;
  }finally{
    button.disabled=false;
    button.innerText="Create 2-Hour Onboarding Link";
  }
}

// 🔥 SEND INVITE (ADDED)
async function sendInvite(){

  const email = document.getElementById("inviteEmail").value.trim();

  if(!email){
    alert("Enter client email");
    return;
  }

  try{

    const agentName = sessionStorage.getItem("agentName");

    alert("SENDING: " + agentName);

const res = await fetch(`${API}/send-agent-invite`,{
  method:"POST",
  headers:{ "Content-Type":"application/json" },
  body:JSON.stringify({
    email: email,
    agent_id: Number(agentId),
    agent_name: agentName,
    agentSessionToken:token
  })
});

    const data = await res.json();

    if(!data.success){
      alert("Failed to send invite");
      return;
    }

    alert("Invite sent!");
    document.getElementById("inviteEmail").value="";

  }catch(e){
    console.error(e);
    alert("Server error");
  }
}

loadClients();

</script>

<script src="../site-traffic.js" defer></script>
</body>
</html>
