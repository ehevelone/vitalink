<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>VitaLink — Agent Dashboard</title>
<meta name="robots" content="noindex, nofollow" />

<style>

:root{
  --bg:#000000;
  --card:#111;
  --text:#eaeaea;
  --border:#1e1e1e;
  --input:#000;
}

body{
  margin:0;
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  background:var(--bg);
  color:var(--text);
}

/* HEADER */
.header{
  display:flex;
  justify-content:space-between;
  align-items:center;
  padding:20px 30px;
  border-bottom:1px solid var(--border);
}

.logout{
  padding:8px 16px;
  border-radius:999px;
  border:none;
  background:#e74c3c;
  color:#fff;
  font-weight:600;
  cursor:pointer;
}

/* CONTAINER */
.container{
  padding:30px;
}

/* CARD */
.card{
  background:var(--card);
  border:1px solid var(--border);
  border-radius:12px;
  padding:20px;
  margin-bottom:20px;
}

/* TABLE */
table{
  width:100%;
  border-collapse:collapse;
  background:var(--card);
}

th,td{
  padding:12px;
  border-bottom:1px solid var(--border);
}

th{
  color:#999;
  text-align:left;
}

tr:nth-child(even){
  background:rgba(255,255,255,.03);
}

/* STATUS COLORS */
.status-active{
  color:#4caf50;
  font-weight:600;
}

.status-inactive{
  color:#999;
}

/* BUTTON */
button.primary{
  padding:6px 12px;
  border-radius:999px;
  border:none;
  background:#7cc6e8;
  font-weight:600;
  cursor:pointer;
}

button.primary:hover{
  opacity:.9;
}

footer{
  margin-top:40px;
  text-align:center;
  color:#666;
  font-size:0.8rem;
}

</style>

<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
</head>

<body>

<!-- HEADER -->
<div class="header">
  <h1>Agent Dashboard</h1>
  <button class="logout" onclick="logout()">Logout</button>
</div>

<div class="container">

<div class="card">

<h2>Your Clients</h2>

<table>
<thead>
<tr>
<th>Name</th>
<th>Email</th>
<th>Status</th>
<th>Action</th>
</tr>
</thead>

<tbody id="clientTable"></tbody>

</table>

</div>

</div>

<footer>
© 2026 VitaLink. All rights reserved.
</footer>

<script>

const API = "https://vitalink-app.netlify.app/.netlify/functions";

firebase.initializeApp({
  apiKey: "AIzaSyCTZiiluPy5ydX62RfM-E7f8EIWHNG12S8",
  authDomain: "vitalink-7e832.firebaseapp.com",
  projectId: "vitalink-7e832"
});

// SESSION GUARD
const token = sessionStorage.getItem("agentSessionToken");
const agentId = sessionStorage.getItem("agentId");

if (!token || !agentId){
  window.location.href = "agent-login.html";
}

// LOGOUT
function logout(){
  sessionStorage.clear();
  window.location.href = "agent-login.html";
}

// LOAD CLIENTS
async function loadClients(){

  try {

    const res = await fetch(`${API}/get_agent_clients`, {
      method: "POST",
      headers: { "Content-Type":"application/json" },
      body: JSON.stringify({ agentId: Number(agentId) })
    });

    const data = await res.json();

    let clients = data.clients || [];

    // 🔥 SORT: Active first, then A-Z
    clients.sort((a,b)=>{

      if(a.active !== b.active){
        return a.active ? -1 : 1;
      }

      const nameA = `${a.first_name||""} ${a.last_name||""}`.toLowerCase();
      const nameB = `${b.first_name||""} ${b.last_name||""}`.toLowerCase();

      return nameA.localeCompare(nameB);
    });

    const tbody = document.getElementById("clientTable");

    if (clients.length === 0){
      tbody.innerHTML = "<tr><td colspan='4'>No clients found</td></tr>";
      return;
    }

    tbody.innerHTML = clients.map(c => `
      <tr>
        <td>${c.first_name || ""} ${c.last_name || ""}</td>
        <td>${c.email || ""}</td>

        <td class="${c.active ? 'status-active' : 'status-inactive'}">
          ${c.active ? "Active" : "Inactive"}
        </td>

        <td>
          <button class="primary"
          onclick="toggleClient('${c.id}')">
            ${c.active ? "Deactivate" : "Activate"}
          </button>
        </td>
      </tr>
    `).join("");

  } catch (err){
    console.error(err);
    document.getElementById("clientTable").innerHTML =
      "<tr><td colspan='4'>Error loading clients</td></tr>";
  }
}

// TOGGLE CLIENT
async function toggleClient(id){

  await fetch(`${API}/agent-toggle-client`, {
    method:"POST",
    headers:{ "Content-Type":"application/json" },
    body: JSON.stringify({ clientId:id })
  });

  loadClients();
}

loadClients();

</script>

</body>
</html>
