<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>VitaLink — Agent Access</title>
<meta name="robots" content="noindex, nofollow" />

<style>
:root {
  --bg-black:#000000;
  --text-primary:#eaeaea;
  --text-muted:#b5b5b5;
  --accent-blue:#7cc6e8;
  --divider:#1e1e1e;
  --card-bg:#111;
  --danger:#ff5a5a;
}

* { box-sizing:border-box; }

body {
  margin:0;
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  background:var(--bg-black);
  color:var(--text-primary);
}

main {
  max-width:720px;
  margin:0 auto;
  padding:60px 24px;
}

.logo {
  max-width:180px;
  margin:0 auto 40px auto;
  display:block;
}

h1 {
  text-align:center;
  font-size:2rem;
  margin-bottom:10px;
}

.sub {
  text-align:center;
  color:var(--text-muted);
  margin-bottom:36px;
  font-size:0.95rem;
}

.card {
  background:var(--card-bg);
  border:1px solid var(--divider);
  border-radius:12px;
  padding:28px;
}

.field { margin-bottom:18px; }

label {
  display:block;
  font-size:0.85rem;
  margin-bottom:6px;
  color:var(--text-muted);
}

input {
  width:100%;
  padding:12px;
  border-radius:8px;
  border:1px solid var(--divider);
  background:#000;
  color:#fff;
  font-size:0.95rem;
}

button {
  padding:10px 16px;
  border-radius:999px;
  border:none;
  background:var(--accent-blue);
  color:#000;
  font-weight:600;
  cursor:pointer;
}

/* 🔥 TABLE (RSM STYLE) */
table{
  width:100%;
  border-collapse:collapse;
  margin-top:20px;
}

th,td{
  padding:12px;
  border-bottom:1px solid var(--divider);
}

th{
  color:var(--text-muted);
  text-align:left;
}

tr:nth-child(even){
  background:rgba(255,255,255,.03);
}

/* STATUS COLORS */
.status-active { color:#4caf50; font-weight:600; }
.status-inactive { color:#999; }

/* MODAL */
.modal{
  position:fixed;
  inset:0;
  background:rgba(0,0,0,.8);
  display:none;
  align-items:center;
  justify-content:center;
}

.modal.active{ display:flex; }

.modal-card{
  background:#111;
  padding:24px;
  border-radius:12px;
  width:320px;
  border:1px solid var(--divider);
}

footer{
  margin-top:60px;
  text-align:center;
  color:#666;
  font-size:0.8rem;
}
</style>

<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
</head>

<body>

<main>

<img src="../images/vitalink-logo-1.png" class="logo" />

<h1>Agent Access</h1>
<div class="sub">Sign in to manage your clients and data</div>

<div class="card">

<div id="error" class="result error hidden"></div>

<div id="step1">

  <div class="field">
    <label>Email</label>
    <input type="email" id="email" />
  </div>

  <div class="field">
    <label>Password</label>
    <input type="password" id="password" />
  </div>

  <button id="loginBtn">Login</button>

  <div class="forgot" onclick="openReset()">Forgot your password?</div>

</div>

<div id="step2" class="hidden"></div>

<div id="recaptcha-container"></div>

<!-- 🔥 CLIENT TABLE -->
<div id="clients" class="hidden">
  <table>
    <thead>
      <tr>
        <th>Name</th>
        <th>Email</th>
        <th>Status</th>
        <th>Action</th>
      </tr>
    </thead>
    <tbody id="clientTable"></tbody>
  </table>
</div>

</div>

<footer>
© 2026 VitaLink. All rights reserved.
</footer>

</main>

<!-- RESET MODAL (UNCHANGED) -->
<div id="resetModal" class="modal">
  <div class="modal-card">
    <h3>Reset Password</h3>

    <input id="resetEmail" placeholder="Email" />
    <input id="resetCode" placeholder="Code" />
    <input id="resetPassword" type="password" placeholder="New Password" />

    <button onclick="requestReset()">Send Code</button>
    <button onclick="submitReset()">Reset Password</button>
    <button onclick="closeReset()" style="background:#444;">Cancel</button>
  </div>
</div>

<script>

const API = "https://vitalink-app.netlify.app/.netlify/functions";

firebase.initializeApp({
  apiKey: "AIzaSyCTZiiluPy5ydX62RfM-E7f8EIWHNG12S8",
  authDomain: "vitalink-7e832.firebaseapp.com",
  projectId: "vitalink-7e832"
});

// ---------------------- LOGIN
document.getElementById("loginBtn").addEventListener("click", login);

async function login() {

  const email = document.getElementById("email").value.trim();
  const password = document.getElementById("password").value;

  if (!email || !password) return;

  const res = await fetch(`${API}/agent-login`, {
    method:"POST",
    headers:{ "Content-Type":"application/json" },
    body: JSON.stringify({ email, password })
  });

  const data = await res.json();

  if (data.step === "login_success") {

    sessionStorage.setItem("agentSessionToken", data.token);
    sessionStorage.setItem("agentId", data.agent.id);

    document.getElementById("step1").classList.add("hidden");

    loadClients();
  }
}

// ---------------------- LOAD CLIENTS (UPGRADED)
async function loadClients(){

  const agentId = sessionStorage.getItem("agentId");
  const tbody = document.getElementById("clientTable");
  const container = document.getElementById("clients");

  container.classList.remove("hidden");
  tbody.innerHTML = "<tr><td colspan='4'>Loading...</td></tr>";

  const res = await fetch(`${API}/get_agent_clients`, {
    method:"POST",
    headers:{ "Content-Type":"application/json" },
    body: JSON.stringify({ agentId:Number(agentId) })
  });

  const data = await res.json();

  let clients = data.clients || [];

  // 🔥 SORTING
  clients.sort((a,b)=>{
    if(a.active !== b.active){
      return a.active ? -1 : 1;
    }
    const nameA = `${a.first_name||""} ${a.last_name||""}`.toLowerCase();
    const nameB = `${b.first_name||""} ${b.last_name||""}`.toLowerCase();
    return nameA.localeCompare(nameB);
  });

  tbody.innerHTML = "";

  clients.forEach(c => {

    tbody.innerHTML += `
      <tr>
        <td>${c.first_name||""} ${c.last_name||""}</td>
        <td>${c.email||""}</td>
        <td class="${c.active ? "status-active" : "status-inactive"}">
          ${c.active ? "Active" : "Inactive"}
        </td>
        <td>
          <button onclick="toggleClient('${c.id}')">
            ${c.active ? "Deactivate" : "Activate"}
          </button>
        </td>
      </tr>
    `;
  });
}

// ---------------------- TOGGLE
async function toggleClient(id){

  await fetch(`${API}/agent-toggle-client`, {
    method:"POST",
    headers:{ "Content-Type":"application/json" },
    body: JSON.stringify({ clientId:id })
  });

  loadClients();
}

// ---------------------- RESET (UNCHANGED)
function openReset(){ document.getElementById("resetModal").classList.add("active"); }
function closeReset(){ document.getElementById("resetModal").classList.remove("active"); }

async function requestReset(){
  const email = document.getElementById("resetEmail").value;

  await fetch(`${API}/request_reset`, {
    method:"POST",
    headers:{ "Content-Type":"application/json" },
    body: JSON.stringify({ emailOrPhone: email, role:"agents" })
  });

  alert("Reset code sent");
}

async function submitReset(){
  const email = document.getElementById("resetEmail").value;
  const code = document.getElementById("resetCode").value;
  const password = document.getElementById("resetPassword").value;

  const res = await fetch(`${API}/reset_password`, {
    method:"POST",
    headers:{ "Content-Type":"application/json" },
    body: JSON.stringify({
      emailOrPhone: email,
      code,
      newPassword: password,
      role:"agents"
    })
  });

  const data = await res.json();

  if(data.success){
    alert("Password reset successful");
    closeReset();
  }
}

</script>

</body>
</html>
