<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Agent Dashboard</title>

<style>
:root{
  --bg:#0c0c0c;
  --card:#111;
  --text:#eaeaea;
  --muted:#b5b5b5;
  --accent:#7cc6e8;
  --border:#1e1e1e;
}
body{
  margin:0;
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto;
  background:var(--bg);
  color:var(--text);
}
header{
  padding:20px;
  border-bottom:1px solid var(--border);
  display:flex;
  justify-content:space-between;
}
.container{
  padding:20px;
  max-width:900px;
  margin:auto;
}
.card{
  background:var(--card);
  border:1px solid var(--border);
  border-radius:14px;
  padding:16px;
  margin-bottom:12px;
}
.client{
  cursor:pointer;
}
.meta{
  color:var(--muted);
  font-size:0.9rem;
}
.badge{
  padding:4px 10px;
  border-radius:999px;
  font-size:0.8rem;
  margin:4px 4px 4px 0;
  display:inline-block;
}
.active{ background:#1e8e3e; }
.inactive{ background:#444; }

button{
  background:var(--accent);
  border:none;
  padding:8px 14px;
  border-radius:999px;
  cursor:pointer;
}

.controls{
  display:flex;
  gap:10px;
  margin-bottom:16px;
  flex-wrap:wrap;
}

input{
  padding:10px;
  border-radius:8px;
  border:1px solid var(--border);
  background:#000;
  color:#fff;
}

.filter-btn{
  background:#222;
}

.filter-active{
  background:var(--accent);
  color:#000;
}

.detail{
  margin-top:10px;
  padding:10px;
  border-top:1px solid var(--border);
}
</style>
</head>

<body>

<header>
  <h2>Agent Dashboard</h2>
  <button onclick="logout()">Logout</button>
</header>

<div class="container">

  <div class="controls">
    <input id="search" placeholder="Search clients..." oninput="applyFilters()" />

    <button class="filter-btn filter-active" onclick="setFilter('all')">All</button>
    <button class="filter-btn" onclick="setFilter('active')">Active</button>
    <button class="filter-btn" onclick="setFilter('inactive')">Inactive</button>
  </div>

  <div id="stats" class="card"></div>
  <div id="clients"></div>

</div>

<script>

const API = "https://vitalink-app.netlify.app/.netlify/functions";
const token = sessionStorage.getItem("agentSessionToken");

let CLIENTS = [];
let FILTER = "all";
let SEARCH = "";

if (!token) {
  window.location.href = "agent-login.html";
}

// ----------------------
function logout(){
  sessionStorage.removeItem("agentSessionToken");
  window.location.href = "agent-login.html";
}

// ----------------------
async function loadClients(){

  const res = await fetch(`${API}/agent-get-clients`, {
    method:"POST",
    headers:{
      "Content-Type":"application/json",
      "Authorization": token
    }
  });

  const data = await res.json();

  CLIENTS = data.clients || [];

  applyFilters();
}

// ----------------------
function applyFilters(){

  SEARCH = document.getElementById("search").value.toLowerCase();

  let filtered = CLIENTS.filter(c => {

    const name = ((c.first_name||"") + " " + (c.last_name||"")).toLowerCase();
    const email = (c.email||"").toLowerCase();
    const phone = (c.phone||"");

    const matchesSearch =
      name.includes(SEARCH) ||
      email.includes(SEARCH) ||
      phone.includes(SEARCH);

    const matchesFilter =
      FILTER === "all" ||
      (FILTER === "active" && c.active) ||
      (FILTER === "inactive" && !c.active);

    return matchesSearch && matchesFilter;
  });

  // SORT: Active → A-Z
  filtered.sort((a,b)=>{
    if (a.active !== b.active) return a.active ? -1 : 1;

    const nameA = ((a.first_name||"") + " " + (a.last_name||"")).toLowerCase();
    const nameB = ((b.first_name||"") + " " + (b.last_name||"")).toLowerCase();

    return nameA.localeCompare(nameB);
  });

  render(filtered);
}

// ----------------------
function setFilter(type){

  FILTER = type;

  document.querySelectorAll(".filter-btn").forEach(btn=>{
    btn.classList.remove("filter-active");
  });

  event.target.classList.add("filter-active");

  applyFilters();
}

// ----------------------
// 🔥 STATUS BUILDER (USING YOUR REAL FIELDS)
// ----------------------
function buildStatus(c){

  let html = "";

  if (c.active){
    html += `<span class="badge active">Active</span>`;
  } else {
    html += `<span class="badge inactive">Inactive</span>`;
  }

  if (c.last_notified_at){
    html += `<span class="badge">Notified</span>`;
  }

  if (c.last_reviewed){
    html += `<span class="badge">Viewed</span>`;
  }

  if (c.profile_complete){
    html += `<span class="badge active">Responded</span>`;
  }

  if (c.last_notified_at && !c.profile_complete){
    html += `<span class="badge inactive">No Response</span>`;
  }

  return html;
}

// ----------------------
function render(list){

  renderStats();

  const container = document.getElementById("clients");

  container.innerHTML = list.map(c => {

    return `
      <div class="card client" onclick="toggleDetail(${c.id})">

        <div><b>${c.first_name || ""} ${c.last_name || ""}</b></div>
        <div class="meta">${c.email || ""}</div>
        <div class="meta">${c.phone || ""}</div>

        <div class="meta">
          Campaign: ${c.last_notified_campaign || "—"}
        </div>

        <div>${buildStatus(c)}</div>

        <div id="detail-${c.id}" class="detail" style="display:none">

          <button onclick="event.stopPropagation(); toggleClient(${c.id}, ${!c.active})">
            Set ${c.active ? "Inactive" : "Active"}
          </button>

        </div>

      </div>
    `;
  }).join("");
}

// ----------------------
function renderStats(){

  const total = CLIENTS.length;
  const active = CLIENTS.filter(c => c.active).length;

  document.getElementById("stats").innerHTML = `
    Total: <b>${total}</b> |
    Active: <b>${active}</b> |
    Inactive: <b>${total - active}</b>
  `;
}

// ----------------------
function toggleDetail(id){

  const el = document.getElementById(`detail-${id}`);
  el.style.display = el.style.display === "none" ? "block" : "none";
}

// ----------------------
async function toggleClient(userId, newState){

  await fetch(`${API}/agent-toggle-client`, {
    method:"POST",
    headers:{
      "Content-Type":"application/json",
      "Authorization": token
    },
    body: JSON.stringify({ userId, active:newState })
  });

  const client = CLIENTS.find(c => c.id === userId);
  if (client) client.active = newState;

  applyFilters();
}

// ----------------------
loadClients();

</script>

</body>
</html>
