<style>
:root{
  --bg:#000;
  --panel:#0d1118;
  --text:#f8fafc;
  --muted:#cbd5e1;
  --accent:#7cc6e8;
  --border:#1f2937;
}

*{box-sizing:border-box;}

body{
  margin:0;
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  background:
    radial-gradient(circle at top left, rgba(124,198,232,.18), transparent 32rem),
    linear-gradient(180deg,#020305 0%,#000 52%,#020305 100%);
  color:var(--text);
}

a{color:inherit;text-decoration:none;}

main{
  width:min(1180px,100%);
  margin:0 auto;
  padding:28px 18px 42px;
}

.nav{
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:16px;
  margin-bottom:22px;
}

.logo{
  max-width:160px;
  width:42vw;
}

.actions{
  display:flex;
  gap:10px;
  flex-wrap:wrap;
  justify-content:flex-end;
}

.btn{
  color:#001018;
  background:var(--accent);
  border:1px solid var(--accent);
  border-radius:10px;
  display:inline-flex;
  align-items:center;
  justify-content:center;
  padding:12px 16px;
  font-weight:800;
}

.btn.secondary{
  color:var(--accent);
  background:rgba(124,198,232,.04);
  border-color:rgba(124,198,232,.72);
}

.hero{
  text-align:center;
  margin:0 auto 20px;
}

.eyebrow{
  color:var(--accent);
  font-weight:800;
  letter-spacing:.12em;
  text-transform:uppercase;
  font-size:.8rem;
}

h1{
  font-size:clamp(2rem,5vw,3.6rem);
  line-height:1.05;
  margin:10px 0;
}

.hero p{
  color:var(--muted);
  margin:0 auto;
  max-width:760px;
  font-size:1.05rem;
}

.viewer{
  overflow:hidden;
  min-height:72vh;
  border:1px solid rgba(124,198,232,.32);
  border-radius:18px;
  background:var(--panel);
  box-shadow:0 18px 55px rgba(0,0,0,.34);
}

.viewer iframe,
.viewer object{
  display:block;
  width:100%;
  height:78vh;
  min-height:640px;
  border:0;
  background:#111827;
}

.fallback{
  padding:28px;
  color:var(--muted);
  text-align:center;
}

.footer{
  margin-top:22px;
  color:var(--muted);
  text-align:center;
  font-weight:700;
}

@media(max-width:720px){
  .nav{
    align-items:flex-start;
    flex-direction:column;
  }

  .actions{
    justify-content:flex-start;
  }

  .viewer iframe,
  .viewer object{
    height:72vh;
    min-height:520px;
  }
}
</style>
<link rel="stylesheet" href="typography.css">
</head>
<body>
<main>
  <nav class="nav">
    <a href="index.html">
      <img src="images/vitalink-logo.png" class="logo" alt="VitaLink">
    </a>
    <div class="actions">
      <a class="btn secondary" href="for-agencies.html">VitaLink for Agencies</a>
      <a class="btn" href="images/VitaLink%20Agent%20Promo.pdf" download>Download Presentation</a>
    </div>
  </nav>

  <section class="hero">
    <div class="eyebrow">VitaLink for Agencies</div>
    <h1>VitaLink Agency Overview</h1>
    <p>Built by an insurance agent to help agencies improve client retention, streamline annual reviews, and generate more referrals.</p>
  </section>

  <section class="viewer" aria-label="VitaLink Agency Overview PDF">
    <object data="images/VitaLink%20Agent%20Promo.pdf#view=FitH" type="application/pdf">
      <div class="fallback">
        <p>Your browser could not display the PDF inline.</p>
        <a class="btn" href="images/VitaLink%20Agent%20Promo.pdf">Open PDF</a>
      </div>
    </object>
  </section>

  <div class="footer">Prepared &bull; Protected &bull; Connected</div>
</main>
</body>
</html>
