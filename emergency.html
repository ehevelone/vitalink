 
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<title>Emergency Info | VitaLink</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<meta name="robots" content="noindex, follow" />
<meta name="description" content="Private VitaLink emergency information display for authorized QR access." />

<style>
:root{
--bg:#000000;
--card:#0c0c0c;
--text:#ffffff;
--muted:#aaaaaa;
--divider:#1e1e1e;
--alert-bg:#2a0000;
--alert-border:#e53935;
}

body.light{
--bg:#f5f5f5;
--card:#ffffff;
--text:#111;
--muted:#555;
--divider:#ddd;
--alert-bg:#ffeaea;
}

body.light .value{ color:#111; }
body.light .label{ color:#555; }
body.light .alert{
color:#111;
background:#ffeaea;
border-left:5px solid #e53935;
}
body.light a.phone{ color:#0077cc; }
body.light .card{
box-shadow:0 10px 30px rgba(0,0,0,0.1);
}

body.ems{
--text:#ffffff;
--muted:#cccccc;
}

body{
margin:0;
background:var(--bg);
color:var(--text);
font-family:system-ui,-apple-system,sans-serif;
display:flex;
justify-content:center;
padding:20px;
}

.card{
width:100%;
max-width:520px;
padding:28px;
border-radius:18px;
background:var(--card);
box-shadow:0 20px 60px rgba(0,0,0,0.6);
position:relative;
}

.logo{text-align:center;margin-bottom:20px;}
.logo img{height:110px;}

h1{
color:#e53935;
text-align:center;
margin-bottom:18px;
}

.section{
margin-bottom:22px;
border-top:1px solid var(--divider);
padding-top:16px;
}

.label{
font-size:15px;
font-weight:600;
color:var(--muted);
text-transform:uppercase;
letter-spacing:0.05em;
}

.value{
font-size:20px;
margin-top:6px;
line-height:1.5;
font-weight:500;
}

body.ems .label{
font-size:20px;
font-weight:700;
letter-spacing:0.06em;
}

body.ems .value{
font-size:26px;
font-weight:700;
line-height:1.6;
}

.alert{
background:var(--alert-bg);
border-left:6px solid var(--alert-border);
padding:14px;
border-radius:10px;
}

body.ems .alert .value{
font-size:28px;
font-weight:800;
}

a.phone{
color:#7cc6e8;
text-decoration:none;
font-weight:600;
}

.hint{
margin-top:18px;
font-size:14px;
color:var(--muted);
text-align:center;
}

.toggle-wrap{
position:absolute;
top:14px;
right:14px;
display:flex;
gap:6px;
}

.theme-toggle{
background:none;
border:1px solid var(--divider);
color:var(--text);
padding:6px 12px;
border-radius:999px;
font-size:12px;
cursor:pointer;
}
</style>
<link rel="stylesheet" href="typography.css">
</head>

<body>

<div class="card" id="app">

<div class="toggle-wrap">
<button class="theme-toggle" onclick="toggleTheme()">Light</button>
<button class="theme-toggle" onclick="toggleEMS()">EMS</button>
</div>

<div class="logo">
<img src="images/vitalink-logo.png" />
</div>

<h1>Loading Emergency Info...</h1>

</div>

<script>

function toggleTheme(){
document.body.classList.toggle("light");
}

function toggleEMS(){
document.body.classList.toggle("ems");
}

function safeText(val){
if (!val) return "";
if (typeof val === "string") return val.trim();
return String(val);
}

function phoneLink(num){
return num
? `<a class="phone" href="tel:${num}">${num}</a>`
: "N/A";
}

function showError(message){
const app = document.getElementById("app");

app.innerHTML = `

<div class="toggle-wrap">
<button class="theme-toggle" onclick="toggleTheme()">Light</button>
<button class="theme-toggle" onclick="toggleEMS()">EMS</button>
</div>

<div class="logo">
<img src="images/vitalink-logo.png" />
</div>

<h1>Unable to Load Emergency Info</h1>

<div class="section alert">
<div class="label">Error</div>
<div class="value">${safeText(message) || "Unknown error"}</div>
</div>

<div class="hint">
Please check the QR link or try again.
</div>

`;
}

function render(decoded){

const app = document.getElementById("app");

app.innerHTML = `

<div class="toggle-wrap">
<button class="theme-toggle" onclick="toggleTheme()">Light</button>
<button class="theme-toggle" onclick="toggleEMS()">EMS</button>
</div>

<div class="logo">
<img src="images/vitalink-logo.png" />
</div>

<h1>Emergency Information</h1>

<div class="section">
<div class="label">Name</div>
<div class="value">${safeText(decoded.name) || "N/A"}</div>
</div>

<div class="section">
<div class="label">DOB</div>
<div class="value">${safeText(decoded.dob) || "N/A"}</div>
</div>

<div class="section alert">
<div class="label">Allergies</div>
<div class="value">${safeText(decoded.allergies) || "None reported"}</div>
</div>

<div class="section alert">
<div class="label">Conditions</div>
<div class="value">${safeText(decoded.conditions) || "None reported"}</div>
</div>

<div class="section">
<div class="label">Implants</div>
<div class="value">${safeText(decoded.implants) || "None reported"}</div>
</div>

<div class="section">
<div class="label">Procedures</div>
<div class="value">${safeText(decoded.procedures) || "None reported"}</div>
</div>

<div class="section">
<div class="label">Blood Type</div>
<div class="value">${safeText(decoded.bloodType) || "Unknown"}</div>
</div>

<div class="section">
<div class="label">Organ Donor</div>
<div class="value">${decoded.organDonor ? "YES" : "NO"}</div>
</div>

<div class="section">
<div class="label">Emergency Contacts</div>
<div class="value">
${
Array.isArray(decoded.emergencyContacts) && decoded.emergencyContacts.length
? decoded.emergencyContacts.map((contact, index) => `
<div style="margin-bottom:12px;">
<strong>${safeText(contact.name) || `Contact ${index + 1}`}</strong><br>
${contact.phone ? phoneLink(contact.phone) : "No phone"}
</div>
`).join("")
: `
<div>${safeText(decoded.emergencyContactName) || "N/A"}</div>
<div>${phoneLink(decoded.emergencyContactPhone)}</div>
`
}
</div>
</div>

<div class="section">
<div class="label">Medications</div>
<div class="value">
${
Array.isArray(decoded.meds) && decoded.meds.length
? decoded.meds.map(m => `
<div style="margin-bottom:12px;">
<strong>${safeText(m.name) || "Unknown"}</strong><br>
${safeText(m.dose)} ${m.frequency ? "• " + safeText(m.frequency) : ""}
</div>
`).join("")
: "None reported"
}
</div>
</div>

<div class="section">
<div class="label">Doctors</div>
<div class="value">
${
Array.isArray(decoded.providers) && decoded.providers.length
? decoded.providers.map(d => `
<div style="margin-bottom:12px;">
<strong>${safeText(d.name) || "Unknown"}</strong><br>
${d.phone ? phoneLink(d.phone) : "No phone"}
</div>
`).join("")
: "None listed"
}
</div>
</div>

<div class="hint">
Emergency data provided via VitaLink
</div>

`;
}

(function(){

const params = new URLSearchParams(window.location.search);
const token = params.get("token");

console.log("RAW QUERY:", window.location.search);
console.log("TOKEN:", token);

if (!token) {
showError("Missing token in QR link.");
return;
}

let loaded = false;

const controller = new AbortController();
const timeout = setTimeout(() => {
controller.abort();
if (!loaded) showError("Request timed out.");
}, 10000);

fetch(`https://vitalink-app.netlify.app/.netlify/functions/emergency_view?token=${encodeURIComponent(token)}`, {
  method: "GET",
  mode: "cors",
  cache: "no-store",
  headers: {
    "Accept": "application/json"
  },
  signal: controller.signal
})
.then(async (res) => {
clearTimeout(timeout);

let data;
try {
data = await res.json();
} catch (err) {
throw new Error("Invalid server response");
}

if (!res.ok) {
throw new Error(data?.error || `HTTP ${res.status}`);
}

return data;
})
.then(data => {

console.log("EMERGENCY DATA:", data);

if (!data.success) {
throw new Error(data.error || "Load failed");
}

if (!data.emergency) {
throw new Error("No emergency data returned");
}

loaded = true;

const e = data.emergency;

render({
name: e.name,
dob: e.dob,
allergies: e.allergies,
conditions: e.conditions,
implants: e.implants,
procedures: e.procedures,
bloodType: e.bloodType,
organDonor: e.organDonor,
emergencyContactName: e.emergencyContactName || e.contact || "",
emergencyContactPhone: e.emergencyContactPhone || e.phone || "",
emergencyContacts: e.emergencyContacts || e.contacts || [],
meds: e.meds,
providers: e.providers
});

})
.catch(err => {
clearTimeout(timeout);
console.error("Emergency fetch failed", err);

showError(err.message || "Unable to load emergency data.");
});

})();
</script>

<script src="site-traffic.js" defer></script>
</body>
</html>
