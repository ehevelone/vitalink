<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<title>Emergency Info | VitaLink</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0" />

<style>
:root{
--bg:#000000;
--card:#0c0c0c;
--text:#ffffff;
--muted:#aaaaaa;
--divider:#1e1e1e;
--alert-bg:#2a0000;
--alert-border:#e53935;
}

body.light{
--bg:#f5f5f5;
--card:#ffffff;
--text:#111;
--muted:#555;
--divider:#ddd;
--alert-bg:#ffeaea;
}

body.ems{
--text:#ffffff;
--muted:#cccccc;
}

body{
margin:0;
background:var(--bg);
color:var(--text);
font-family:system-ui,-apple-system,sans-serif;
display:flex;
justify-content:center;
padding:20px;
}

.card{
width:100%;
max-width:520px;
padding:28px;
border-radius:18px;
background:var(--card);
box-shadow:0 20px 60px rgba(0,0,0,0.6);
position:relative;
}

.logo{text-align:center;margin-bottom:20px;}
.logo img{height:110px;}

h1{
color:#e53935;
text-align:center;
margin-bottom:18px;
}

.section{
margin-bottom:18px;
border-top:1px solid var(--divider);
padding-top:14px;
}

.label{
font-size:12px;
color:var(--muted);
text-transform:uppercase;
}

.value{
font-size:17px;
margin-top:4px;
line-height:1.4;
}

body.ems .value{
font-size:20px;
font-weight:600;
}

.alert{
background:var(--alert-bg);
border-left:5px solid var(--alert-border);
padding:12px;
border-radius:8px;
}

a.phone{
color:#7cc6e8;
text-decoration:none;
font-weight:600;
}

.hint{
margin-top:18px;
font-size:14px;
color:var(--muted);
text-align:center;
}

.toggle-wrap{
position:absolute;
top:14px;
right:14px;
display:flex;
gap:6px;
}

.theme-toggle{
background:none;
border:1px solid var(--divider);
color:var(--text);
padding:6px 12px;
border-radius:999px;
font-size:12px;
cursor:pointer;
}
</style>
</head>

<body>

<div class="card" id="app">

<div class="toggle-wrap">
<button class="theme-toggle" onclick="toggleTheme()">Light</button>
<button class="theme-toggle" onclick="toggleEMS()">EMS</button>
</div>

<div class="logo">
<img src="/images/vitalink-logo.png" />
</div>

<h1>Emergency Session Expired</h1>
<div class="hint">Scan QR Code to access emergency data</div>

</div>

<script>

function toggleTheme(){
document.body.classList.toggle("light");
}

function toggleEMS(){
document.body.classList.toggle("ems");
}

(function(){

const params = new URLSearchParams(window.location.search);
const raw = params.get("data");
if(!raw) return;

const normalized = raw.replace(/-/g,'+').replace(/_/g,'/');

let decoded;
try{
decoded = JSON.parse(atob(normalized));
console.log("QR DATA:", decoded);
}catch{
return;
}

const safeText = (val) => {
if (!val) return "";
if (typeof val === "string") return val.trim();
return String(val);
};

const phoneLink = (num) => num 
? `<a class="phone" href="tel:${num}">${num}</a>` 
: "N/A";

const app = document.getElementById("app");

app.innerHTML = `

<div class="toggle-wrap">
<button class="theme-toggle" onclick="toggleTheme()">Light</button>
<button class="theme-toggle" onclick="toggleEMS()">EMS</button>
</div>

<div class="logo">
<img src="/images/vitalink-logo.png" />
</div>

<h1>Emergency Information</h1>

<div class="section">
<div class="label">Name</div>
<div class="value">${safeText(decoded.name) || "N/A"}</div>
</div>

<div class="section">
<div class="label">DOB</div>
<div class="value">${safeText(decoded.dob) || "N/A"}</div>
</div>

<div class="section alert">
<div class="label">Allergies</div>
<div class="value">${safeText(decoded.allergies) || "None reported"}</div>
</div>

<div class="section alert">
<div class="label">Conditions</div>
<div class="value">${safeText(decoded.conditions) || "None reported"}</div>
</div>

<div class="section">
<div class="label">Implants</div>
<div class="value">${safeText(decoded.implants) || "None reported"}</div>
</div>

<div class="section">
<div class="label">Procedures</div>
<div class="value">${safeText(decoded.procedures) || "None reported"}</div>
</div>

<div class="section">
<div class="label">Blood Type</div>
<div class="value">${safeText(decoded.bloodType) || "Unknown"}</div>
</div>

<div class="section">
<div class="label">Organ Donor</div>
<div class="value">${decoded.organDonor ? "YES" : "NO"}</div>
</div>

<div class="section">
<div class="label">Emergency Contact</div>
<div class="value">${safeText(decoded.emergencyContactName) || "N/A"}</div>
</div>

<div class="section">
<div class="label">Phone</div>
<div class="value">${phoneLink(decoded.emergencyContactPhone)}</div>
</div>

<div class="section">
<div class="label">Medications</div>
<div class="value">
${
Array.isArray(decoded.meds) && decoded.meds.length
? decoded.meds.map(m => `
<div style="margin-bottom:10px;">
<strong>${safeText(m.name) || "Unknown"}</strong><br>
${safeText(m.dose)} ${m.frequency ? "• " + safeText(m.frequency) : ""}
</div>
`).join("")
: "None reported"
}
</div>
</div>

<div class="section">
<div class="label">Doctors</div>
<div class="value">
${
Array.isArray(decoded.providers) && decoded.providers.length
? decoded.providers.map(d => `
<div style="margin-bottom:10px;">
<strong>${safeText(d.name) || "Unknown"}</strong><br>
${d.phone ? phoneLink(d.phone) : "No phone"}
</div>
`).join("")
: "None listed"
}
</div>
</div>

<div class="hint">
Emergency data provided via VitaLink
</div>

`;

})();
</script>

</body>
</html>
