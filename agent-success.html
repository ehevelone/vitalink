<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>VitaLink — Agent Activated</title>

<style>

body{
margin:0;
font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
background:#0c0c0c;
color:#eaeaea;
display:flex;
align-items:center;
justify-content:center;
height:100vh;
}

.card{
background:#111;
padding:40px;
border-radius:14px;
width:420px;
text-align:center;
box-shadow:0 10px 40px rgba(0,0,0,.5);
}

h1{
margin-top:0;
font-size:26px;
}

.code{
margin-top:20px;
font-size:34px;
letter-spacing:6px;
background:#000;
padding:16px;
border-radius:10px;
font-weight:bold;
}

button{
margin-top:12px;
padding:10px 18px;
border:none;
border-radius:6px;
background:#7cc6e8;
color:#000;
font-weight:600;
cursor:pointer;
}

button:hover{
opacity:.9;
}

.instructions{
margin-top:25px;
color:#b5b5b5;
font-size:14px;
line-height:1.5;
}

</style>
</head>

<body>

<div class="card">

<h1>Agent Activated</h1>

<p>Your VitaLink Agent Activation Code</p>

<div id="code" class="code">Loading...</div>

<button id="copyBtn" onclick="copyCode()">Copy Code</button>

<div class="instructions">
Open the VitaLink app and enter this code to unlock Agent access.
</div>

</div>

<script>

async function loadCode(retry = 0){

const params = new URLSearchParams(window.location.search);
const sessionId = params.get("session_id");

if(!sessionId){
document.getElementById("code").innerText = "Invalid session";
return;
}

try{

const res = await fetch(
`/.netlify/functions/get-agent-code?session_id=${sessionId}`
);

const data = await res.json();

if(data.promo_code){

document.getElementById("code").innerText = data.promo_code;

}else{

if(retry < 10){

setTimeout(()=>{
loadCode(retry + 1);
},2000);

}else{

document.getElementById("code").innerText =
"Still processing — refresh page";

}

}

}catch(e){

document.getElementById("code").innerText =
"Connection error";

}

}

function copyCode(){

const code =
document.getElementById("code").innerText;

navigator.clipboard.writeText(code);

const btn =
document.getElementById("copyBtn");

btn.innerText = "Copied!";

setTimeout(()=>{
btn.innerText = "Copy Code";
},2000);

}

loadCode();

</script>

</body>
</html>
