<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />

<title>VitaLink Agent Access</title>

<style>

:root{
--bg-black:#0c0c0c;
--text-primary:#eaeaea;
--text-muted:#b5b5b5;
--accent-blue:#7cc6e8;
--divider:#1e1e1e;
--card:#111111;
}

*{box-sizing:border-box;}

body{
margin:0;
min-height:100vh;
font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
background:var(--bg-black);
color:var(--text-primary);
display:flex;
align-items:center;
justify-content:center;
padding:24px;
}

.wrap{width:100%;max-width:520px;}

.card{
background:var(--card);
border:1px solid var(--divider);
border-radius:20px;
padding:32px 24px;
text-align:center;
box-shadow:0 10px 30px rgba(0,0,0,0.25);
}

.logo{
width:88px;
margin:0 auto 20px auto;
display:block;
}

h1{
margin:0 0 12px 0;
font-size:2rem;
font-weight:700;
}

p{
margin:0 0 16px 0;
color:var(--text-muted);
}

.code-box{
margin:24px 0;
padding:16px;
border-radius:16px;
background:#181818;
border:1px solid var(--divider);
}

.code-label{
font-size:.85rem;
color:var(--text-muted);
margin-bottom:8px;
text-transform:uppercase;
letter-spacing:.08em;
}

.code{
font-size:1.4rem;
font-weight:700;
letter-spacing:.08em;
}

.btn{
display:inline-block;
width:100%;
border:none;
border-radius:999px;
padding:15px 20px;
font-size:1rem;
font-weight:700;
cursor:pointer;
margin-top:12px;
text-decoration:none;
}

.btn-primary{
background:var(--accent-blue);
color:#000;
}

.btn-secondary{
background:transparent;
color:var(--accent-blue);
border:1px solid var(--accent-blue);
}

.store-buttons{
margin-top:26px;
display:flex;
flex-direction:column;
gap:12px;
}

.store-btn img{
width:100%;
max-width:220px;
margin:auto;
display:block;
}

.small{
margin-top:18px;
font-size:.9rem;
color:#8f8f8f;
}

.error{
color:#ff9b9b;
font-weight:600;
margin-top:10px;
}

</style>
</head>

<body>

<div class="wrap">
<div class="card">

<img src="images/vitalink-logo-1.png" class="logo"/>

<h1>Agent Access</h1>

<p>Opening VitaLink with your agent-linked access code.</p>

<div class="code-box">
<div class="code-label">Access Code</div>
<div class="code" id="codeDisplay">Loading...</div>
</div>

<button class="btn btn-primary" id="openAppBtn">
Open VitaLink App
</button>

<a class="btn btn-secondary" id="fallbackBtn">
Continue on Website
</a>

<div class="store-buttons">

<a class="store-btn" href="https://apps.apple.com">
<img src="https://developer.apple.com/assets/elements/badges/download-on-the-app-store.svg">
</a>

<a class="store-btn" href="https://play.google.com/store">
<img src="https://upload.wikimedia.org/wikipedia/commons/7/78/Google_Play_Store_badge_EN.svg">
</a>

</div>

<div class="small">
If the app does not open automatically, tap “Open VitaLink App.”
</div>

<div class="error" id="errorText" style="display:none;"></div>

</div>
</div>

<script>

(function(){

const params=new URLSearchParams(window.location.search);
const code=(params.get("code")||"").trim().toUpperCase();

const codeDisplay=document.getElementById("codeDisplay");
const openAppBtn=document.getElementById("openAppBtn");
const fallbackBtn=document.getElementById("fallbackBtn");
const errorText=document.getElementById("errorText");

if(!code){

codeDisplay.textContent="No code found";

errorText.style.display="block";
errorText.textContent="This link is missing an access code.";

openAppBtn.disabled=true;

fallbackBtn.href="/activate.html";

return;

}

codeDisplay.textContent=code;

const appUrl=`myvitalink://activate?code=${encodeURIComponent(code)}`;

fallbackBtn.href=`/activate.html?code=${encodeURIComponent(code)}`;

function openApp(){

const iframe=document.createElement("iframe");

iframe.style.display="none";

iframe.src=appUrl;

document.body.appendChild(iframe);

}

/* Button launch */

openAppBtn.addEventListener("click",openApp);

/* Auto launch */

setTimeout(openApp,500);

})();

</script>

</body>
</html>
