<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex, follow">
<meta name="description" content="The VitaLink page you requested could not be found.">
<title>Page Not Found | VitaLink</title>
<link rel="stylesheet" href="typography.css">
<style>
:root{--bg:#020305;--text:#f8fafc;--muted:#cbd5e1;--accent:#7cc6e8;--border:#1f2937}
*{box-sizing:border-box}
body{align-items:center;background:radial-gradient(circle at top left,rgba(124,198,232,.16),transparent 34rem),var(--bg);color:var(--text);display:flex;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;justify-content:center;line-height:1.55;margin:0;min-height:100vh;padding:24px}
main{max-width:760px;text-align:center}
.logo{display:block;margin:0 auto 34px;max-width:190px;width:55vw}
.eyebrow{color:var(--accent);font-size:.8rem;font-weight:900;letter-spacing:.1em;text-transform:uppercase}
h1{font-size:clamp(2.4rem,7vw,5.2rem);letter-spacing:0;line-height:1;margin:12px 0 18px}
p{color:var(--muted);font-size:1.16rem;margin:0 auto 28px;max-width:620px}
.actions{display:flex;flex-wrap:wrap;gap:12px;justify-content:center}
a{align-items:center;border:1px solid var(--accent);border-radius:10px;color:#001018;display:inline-flex;font-weight:850;justify-content:center;min-height:46px;padding:12px 18px;text-decoration:none}
.primary{background:var(--accent)}
.secondary{background:rgba(124,198,232,.04);color:var(--accent)}
</style>
</head>
<body>
<main>
  <img src="images/vitalink-logo.png" class="logo" alt="VitaLink">
  <div class="eyebrow">Page not found</div>
  <h1>This page is not available.</h1>
  <p>The link may have moved, or the address may have been typed incorrectly. Start from the VitaLink home page or schedule a conversation.</p>
  <div class="actions">
    <a class="primary" href="index.html">Go to Home</a>
    <a class="secondary" href="schedule-demo.html">Schedule a Demo</a>
  </div>
</main>
</body>
</html>
