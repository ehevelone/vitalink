<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>VitaLink Order Builder</title>

<style>
:root{
--bg-black:#000;
--text:#eaeaea;
--muted:#b5b5b5;
--accent:#7cc6e8;
--card:#111;
--border:#1e1e1e;
}

body{
margin:0;
font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto;
background:var(--bg-black);
color:var(--text);
}

main{
max-width:1100px;
margin:auto;
padding:40px 20px;
}

h1{
text-align:center;
margin-bottom:30px;
}

.grid{
display:grid;
grid-template-columns:1fr 350px;
gap:30px;
}

.products{
display:grid;
grid-template-columns:repeat(auto-fit,minmax(220px,1fr));
gap:20px;
}

.card{
background:var(--card);
border:1px solid var(--border);
border-radius:12px;
padding:16px;
text-align:center;
}

.card img{
width:100%;
height:140px;
object-fit:cover;
border-radius:8px;
margin-bottom:10px;
}

.card h3{
margin:8px 0;
}

.card button{
background:var(--accent);
border:none;
padding:10px;
border-radius:6px;
cursor:pointer;
font-weight:600;
}

.cart{
background:var(--card);
border:1px solid var(--border);
border-radius:12px;
padding:20px;
position:sticky;
top:20px;
}

.cart h2{
margin-top:0;
}

.cart-item{
display:flex;
justify-content:space-between;
margin-bottom:10px;
font-size:0.95rem;
}

.total{
margin-top:20px;
font-size:1.2rem;
font-weight:700;
}

.checkout{
margin-top:20px;
width:100%;
padding:12px;
background:var(--accent);
border:none;
border-radius:8px;
font-weight:600;
cursor:pointer;
}
</style>
</head>

<body>

<main>

<h1>Build Your VitaLink Order</h1>

<div class="grid">

<!-- PRODUCTS -->
<div class="products">

<div class="card">
<img src="assets/full-kit.jpg" />
<h3>Full Kit</h3>
<p>$99.95</p>
<button onclick="addToCart('Full Kit', 99.95)">Add</button>
</div>

<div class="card">
<img src="assets/wristband.jpg" />
<h3>Wristband</h3>
<p>$14.95</p>
<button onclick="addToCart('Wristband', 14.95)">Add</button>
</div>

<div class="card">
<img src="assets/dogtag.jpg" />
<h3>Dog Tag</h3>
<p>$19.95</p>
<button onclick="addToCart('Dog Tag', 19.95)">Add</button>
</div>

<div class="card">
<img src="assets/keychain.jpg" />
<h3>Keychain</h3>
<p>$12.95</p>
<button onclick="addToCart('Keychain', 12.95)">Add</button>
</div>

<div class="card">
<img src="assets/sticker.jpg" />
<h3>Phone Sticker</h3>
<p>$9.95</p>
<button onclick="addToCart('Sticker', 9.95)">Add</button>
</div>

<div class="card">
<img src="assets/wallet-card.jpg" />
<h3>Laminated Card</h3>
<p>$9.95</p>
<button onclick="addToCart('Card', 9.95)">Add</button>
</div>

</div>

<!-- CART -->
<div class="cart">

<h2>Your Cart</h2>

<div id="cart-items"></div>

<div class="total">
Total: $<span id="total">0.00</span>
</div>

<button class="checkout" onclick="submitOrder()">
Continue
</button>

</div>

</div>

</main>

<script>

let cart = [];

// 🔥 Product mapping (used for URL auto-add)
const productMap = {
  full: { name: "Full Kit", price: 99.95 },
  starter: { name: "Starter Kit", price: 49.95 },
  wristband: { name: "Wristband", price: 14.95 },
  dogtag: { name: "Dog Tag", price: 19.95 },
  keychain: { name: "Keychain", price: 12.95 },
  sticker: { name: "Sticker", price: 9.95 },
  card: { name: "Card", price: 9.95 }
};

// 🔥 Auto-add from URL
window.onload = function () {
  const params = new URLSearchParams(window.location.search);
  const product = params.get("product");

  if (product && productMap[product]) {
    addToCart(
      productMap[product].name,
      productMap[product].price
    );
  }
};

function addToCart(name, price){
  cart.push({ name, price });
  renderCart();
}

function removeItem(index){
  cart.splice(index,1);
  renderCart();
}

function renderCart(){

  const container = document.getElementById("cart-items");
  container.innerHTML = "";

  let total = 0;

  cart.forEach((item, i) => {

    total += item.price;

    container.innerHTML += `
    <div class="cart-item">
      <span>${item.name}</span>
      <span>
        $${item.price.toFixed(2)}
        <button onclick="removeItem(${i})">x</button>
      </span>
    </div>
    `;
  });

  document.getElementById("total").innerText = total.toFixed(2);
}

function submitOrder(){

  if(cart.length === 0){
    alert("Add items first");
    return;
  }

  console.log("ORDER:", cart);

  alert("Next step: connect to backend");

}

</script>

</body>
</html>
