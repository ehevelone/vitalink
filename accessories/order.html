<!-- ONLY SHOWING SCRIPT SECTION (everything else stays EXACT same above) -->

<script>

let cart = [];
let selectedProduct = null;
let profiles = [];
let currentOrderId = null;

const user = JSON.parse(localStorage.getItem("vitalink_user"));
if(!user){
  window.location.href = "login.html";
}

async function loadProfiles(){
  try{
    const res = await fetch(
      "https://vitalink-app.netlify.app/.netlify/functions/get_profiles",
      {
        method:"POST",
        headers:{ "Content-Type":"application/json" },
        body: JSON.stringify({ user_id: user.id }),
        mode:"cors",
        credentials:"omit"
      }
    );

    const data = await res.json();

    if(res.ok && data.success){
      profiles = data.profiles;
    }

  }catch(e){
    console.error("Profile load failed", e);
  }
}

function loadCart(){
  const saved = localStorage.getItem("vitalink_cart");
  if(saved){
    cart = JSON.parse(saved);
  }
}

function saveCart(){
  localStorage.setItem("vitalink_cart", JSON.stringify(cart));
}

window.onload = async function(){
  loadCart();
  await loadProfiles();
  renderCart();
};

function openSelector(name, price){
  selectedProduct = {name, price};

  const list = document.getElementById("profile-list");
  list.innerHTML = "";

  profiles.forEach(p=>{
    list.innerHTML += `
      <div class="profile">
        <label>
          <input type="checkbox" value="${encodeURIComponent(p.name)}" />
          ${p.name.replace(/"/g, "&quot;")}
        </label>
      </div>
    `;
  });

  document.getElementById("modal").style.display = "flex";
}

function confirmSelection(){
  const checks = document.querySelectorAll("#profile-list input:checked");

  checks.forEach(c=>{
    cart.push({
      name: selectedProduct.name,
      price: selectedProduct.price,
      profile: decodeURIComponent(c.value)
    });
  });

  saveCart();
  renderCart();
  document.getElementById("modal").style.display = "none";
}

function renderCart(){
  const container = document.getElementById("cart-items");
  container.innerHTML = "";

  let total = 0;

  cart.forEach(item=>{
    total += item.price;

    container.innerHTML += `
    <div class="cart-item">
      <span>${item.name} - ${item.profile}</span>
      <span>$${item.price.toFixed(2)}</span>
    </div>
    `;
  });

  document.getElementById("total").innerText = total.toFixed(2);
}

function goToCheckout(){
  if(cart.length === 0){
    alert("Add items first");
    return;
  }
  document.getElementById("approvalModal").style.display = "flex";
}

async function proceedToCheckout(){

  try{

    const res = await fetch(
      "https://vitalink-app.netlify.app/.netlify/functions/create-order-request",
      {
        method: "POST",
        headers: { "Content-Type":"application/json" },
        body: JSON.stringify({
          user_id: user.id,
          cart: cart
        }),
        mode:"cors",
        credentials:"omit"
      }
    );

    const text = await res.text();

    let data;
    try{
      data = JSON.parse(text);
    }catch{
      throw new Error("Bad response: " + text);
    }

    if(!res.ok){
      throw new Error("HTTP " + res.status);
    }

    if(!data.success){
      throw new Error(data.error || "Order failed");
    }

    currentOrderId = data.order_id;

    document.querySelector("#approvalModal .modal-content").innerHTML = `
      <h3>Waiting for Approval</h3>
      <p style="color:#ccc;">
        Open your VitaLink app and approve this request.
      </p>
    `;

    // 🚫 POLLING DISABLED
    console.log("⏸ Waiting for app approval (polling disabled)");

  }catch(e){
    console.error("Order error:", e);
    alert(e.message);
  }

}

</script>
