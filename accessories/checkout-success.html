<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>VitaLink — Order Complete</title>

<style>

:root{
  --bg-black:#000000;
  --text-primary:#eaeaea;
  --text-muted:#b5b5b5;
  --accent-blue:#7cc6e8;
  --divider:#1e1e1e;
}

*{box-sizing:border-box;}

body{
  margin:0;
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  background:var(--bg-black);
  color:var(--text-primary);
}

.container{
  max-width:520px;
  margin:0 auto;
  padding:80px 20px;
  text-align:center;
}

.card{
  background:#111;
  border:1px solid var(--divider);
  border-radius:16px;
  padding:32px 24px;
  box-shadow:0 0 0 1px rgba(124,198,232,0.06), 0 20px 50px rgba(0,0,0,0.6);
}

h1{
  margin:0 0 12px 0;
  font-size:2rem;
  font-weight:600;
}

p{
  color:var(--text-muted);
  margin-bottom:20px;
}

button{
  width:100%;
  padding:14px;
  border:none;
  border-radius:10px;
  background:var(--accent-blue);
  color:#000;
  font-weight:600;
  font-size:1rem;
  cursor:pointer;
}

.status{
  margin-top:16px;
  font-size:0.9rem;
  color:#8f8f8f;
}

.success{ color:#7cc6e8; }
.error{ color:#ff5a5a; }

.qr-list{
  margin:20px 0;
  text-align:left;
}

.qr-item{
  display:flex;
  align-items:center;
  justify-content:space-between;
  padding:12px 0;
  border-bottom:1px solid var(--divider);
}

.qr-name{
  font-size:1rem;
}

.qr-item canvas{
  width:72px;
  height:72px;
  background:#fff;
  border-radius:6px;
}

</style>
</head>

<body>

<div class="container">
  <div class="card">

    <h1>Order Complete</h1>

    <p>
      Your order has been received.<br>
      QR access is shown below.
    </p>

    <div id="qrList" class="qr-list"></div>

    <button onclick="finish()">Finish</button>

    <div id="status" class="status"></div>

  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/qrcode/build/qrcode.min.js"></script>

<script>

const params = new URLSearchParams(window.location.search);

// 🔥 FIX: fallback added
const order_id =
  params.get("order_id") ||
  params.get("request_id") ||
  localStorage.getItem("last_order_id");

// 🔥 DEBUG (safe to leave in)
console.log("FULL URL:", window.location.href);
console.log("ORDER ID:", order_id);

/* 🔥 LOAD ORDER + BUILD QR */
async function loadOrder(){

  const qrList = document.getElementById("qrList");

  if(!order_id){
    qrList.innerHTML = "<div class='status error'>Missing order</div>";
    return;
  }

  try{

    console.log("LOADING ORDER:", order_id);

    const res = await fetch(
      "https://vitalink-app.netlify.app/.netlify/functions/get_order",
      {
        method:"POST",
        headers:{ "Content-Type":"application/json" },
        body: JSON.stringify({ order_id })
      }
    );

    console.log("FETCH STATUS:", res.status);

    const data = await res.json();
    console.log("ORDER RESPONSE:", data);

    if(!data.success || !data.order){
      qrList.innerHTML = "<div class='status error'>Order not found</div>";
      return;
    }

    const order = data.order;

    if(!order.qr || order.qr.length === 0){
      qrList.innerHTML = "<div class='status error'>No QR data</div>";
      return;
    }

    qrList.innerHTML = order.qr.map((q, i) => `
      <div class="qr-item">
        <div class="qr-name">${q.profile || "Profile"}</div>
        <canvas id="qr_${i}"></canvas>
      </div>
    `).join("");

    order.qr.forEach((q, i) => {
      const canvas = document.getElementById(`qr_${i}`);

      QRCode.toCanvas(canvas, q.qr_url, {
        width: 72,
        margin: 1
      });
    });

  }catch(e){
    console.error("LOAD ERROR:", e);
    qrList.innerHTML = "<div class='status error'>Failed to load QRs</div>";
  }
}

function finish(){
  const statusEl = document.getElementById("status");
  statusEl.innerHTML = "Order complete ✔";
  statusEl.className = "status success";
}

loadOrder();

</script>

</body>
</html>
