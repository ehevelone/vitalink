<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>VitaLink — Order Complete</title>

<style>

:root{
  --bg-black:#000000;
  --text-primary:#eaeaea;
  --text-muted:#b5b5b5;
  --accent-blue:#7cc6e8;
  --divider:#1e1e1e;
}

*{box-sizing:border-box;}

body{
  margin:0;
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  background:var(--bg-black);
  color:var(--text-primary);
}

/* LAYOUT */
.container{
  max-width:520px;
  margin:0 auto;
  padding:80px 20px;
  text-align:center;
}

/* CARD */
.card{
  background:#111;
  border:1px solid var(--divider);
  border-radius:16px;
  padding:32px 24px;
  box-shadow:0 0 0 1px rgba(124,198,232,0.06), 0 20px 50px rgba(0,0,0,0.6);
}

/* TITLE */
h1{
  margin:0 0 12px 0;
  font-size:2rem;
  font-weight:600;
}

/* TEXT */
p{
  color:var(--text-muted);
  margin-bottom:20px;
}

/* BUTTON */
button{
  width:100%;
  padding:14px;
  border:none;
  border-radius:10px;
  background:var(--accent-blue);
  color:#000;
  font-weight:600;
  font-size:1rem;
  cursor:pointer;
  transition:0.2s;
}

button:hover{
  opacity:0.9;
}

/* STATUS */
.status{
  margin-top:16px;
  font-size:0.9rem;
  color:#8f8f8f;
}

.success{
  color:#7cc6e8;
}

.error{
  color:#ff5a5a;
}

/* QR DISPLAY */
.qr-list{
  margin:20px 0;
  text-align:left;
}

.qr-item{
  display:flex;
  align-items:center;
  justify-content:space-between;
  padding:12px 0;
  border-bottom:1px solid var(--divider);
}

.qr-name{
  font-size:1rem;
}

.qr-item img{
  width:72px;
  height:72px;
  background:#fff;
  border-radius:6px;
}

</style>
</head>

<body>

<div class="container">

  <div class="card">

    <h1>Order Complete</h1>

    <p>
      Your order has been received.<br>
      QR access is shown below.
    </p>

    <div id="qrList" class="qr-list"></div>

    <button onclick="submitOrder()">Finish</button>

    <div id="status" class="status"></div>

  </div>

</div>

<script>

const params = new URLSearchParams(window.location.search);
const request_id = params.get("request_id") || params.get("order_id");

/* 🔥 FIXED TO MATCH YOUR BACKEND */
async function loadOrder(){

  const qrList = document.getElementById("qrList");

  if(!request_id){
    qrList.innerHTML = "<div class='status error'>Missing order</div>";
    return;
  }

  try{

    const res = await fetch(
      "https://vitalink-app.netlify.app/.netlify/functions/get_pending_orders",
      {
        method:"POST",
        headers:{ "Content-Type":"application/json" },
        body: JSON.stringify({ request_id })
      }
    );

    const data = await res.json();

    if(!data.orders || data.orders.length === 0){
      qrList.innerHTML = "<div class='status error'>No order found</div>";
      return;
    }

    const order = data.orders[0];

    if(!order.qr || order.qr.length === 0){
      qrList.innerHTML = "<div class='status error'>No QR data</div>";
      return;
    }

    qrList.innerHTML = order.qr.map(q => `
      <div class="qr-item">
        <div class="qr-name">${q.profile}</div>
        <img src="${q.qr_url}" />
      </div>
    `).join("");

  }catch(e){
    console.error(e);
    qrList.innerHTML = "<div class='status error'>Failed to load QRs</div>";
  }
}

/* EXISTING FUNCTION */
function submitOrder(){

  const statusEl = document.getElementById("status");

  if(!request_id){
    statusEl.innerHTML = "Missing order reference";
    statusEl.className = "status error";
    return;
  }

  statusEl.innerHTML = "Order complete ✔";
  statusEl.className = "status success";
}

/* RUN */
loadOrder();
submitOrder();

</script>

</body>
</html>
