<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>VitaLink Login</title>

<style>
:root{
--bg:#000;
--card:#111;
--text:#eaeaea;
--muted:#b5b5b5;
--accent:#7cc6e8;
--border:#1e1e1e;
--danger:#ff5a5a;
}

body{
margin:0;
font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto;
background:var(--bg);
color:var(--text);
display:flex;
align-items:center;
justify-content:center;
height:100vh;
}

.card{
width:340px;
background:var(--card);
border:1px solid var(--border);
border-radius:14px;
padding:28px;
box-shadow:0 10px 40px rgba(0,0,0,.6);
}

h2{
margin:0 0 10px 0;
text-align:center;
}

.instructions{
font-size:0.85rem;
color:var(--muted);
text-align:center;
margin-bottom:18px;
line-height:1.4;
}

input{
width:100%;
padding:12px;
margin-bottom:14px;
border-radius:8px;
border:1px solid var(--border);
background:#000;
color:#fff;
font-size:0.95rem;
}

button{
width:100%;
padding:12px;
background:var(--accent);
border:none;
border-radius:8px;
font-weight:600;
cursor:pointer;
font-size:1rem;
}

button:disabled{
opacity:.6;
cursor:not-allowed;
}

.error{
margin-top:12px;
font-size:0.85rem;
color:var(--danger);
text-align:center;
}

.note{
margin-top:14px;
font-size:0.8rem;
color:var(--muted);
text-align:center;
}
</style>
</head>

<body>

<div class="card">

<h2>Login to VitaLink</h2>

<div class="instructions">
Use the same email and password you created in the VitaLink app.<br><br>
If you have not set up your account yet, please complete registration in the app first.
</div>

<input type="email" id="email" placeholder="Email" />
<input type="password" id="password" placeholder="Password" />

<button id="loginBtn" onclick="login()">Login</button>

<div id="error" class="error"></div>

<div class="note">
Access your profiles to complete your order
</div>

</div>

<script>

async function login(){

  const email = document.getElementById("email").value.trim();
  const password = document.getElementById("password").value.trim();
  const errorDiv = document.getElementById("error");
  const btn = document.getElementById("loginBtn");

  errorDiv.innerText = "";

  if(!email || !password){
    errorDiv.innerText = "Enter email and password";
    return;
  }

  btn.disabled = true;
  btn.innerText = "Logging in...";

  try{

    const res = await fetch(
      "https://vitalink-app.netlify.app/.netlify/functions/check_user",
      {
        method:"POST",
        headers:{ "Content-Type":"application/json" },
        body: JSON.stringify({
          email,
          password,
          device_id: "web"
        })
      }
    );

    const data = await res.json();

    if(data.success){

      localStorage.setItem("vitalink_user", JSON.stringify(data.user));

      if(data.token){
        localStorage.setItem("vitalink_token", data.token);
      }

      window.location.href = "order.html";

    } else {

      errorDiv.innerText = data.message || "Login failed";

    }

  } catch(err){

    errorDiv.innerText = "Network error";

  }

  btn.disabled = false;
  btn.innerText = "Login";
}

</script>

</body>
</html>
