<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>VitaLink Checkout</title>

<style>
:root{
--bg:#000;
--card:#111;
--text:#eaeaea;
--muted:#b5b5b5;
--accent:#7cc6e8;
--border:#1e1e1e;
}

body{
margin:0;
font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto;
background:var(--bg);
color:var(--text);
}

main{
max-width:700px;
margin:auto;
padding:40px 20px;
}

h1{
text-align:center;
margin-bottom:30px;
}

.section{
background:var(--card);
border:1px solid var(--border);
border-radius:12px;
padding:20px;
margin-bottom:20px;
}

.item{
display:flex;
justify-content:space-between;
margin-bottom:10px;
font-size:0.95rem;
}

.total{
font-size:1.3rem;
font-weight:700;
text-align:right;
margin-top:10px;
}

.notice{
font-size:0.9rem;
color:var(--muted);
margin-top:10px;
text-align:center;
}

button{
width:100%;
padding:14px;
background:var(--accent);
border:none;
border-radius:8px;
font-weight:600;
font-size:1rem;
cursor:pointer;
margin-top:20px;
}

/* 🔥 NEW QR SECTION */
.qr-item{
display:flex;
justify-content:space-between;
align-items:center;
margin-bottom:12px;
}

.qr-item canvas{
background:#fff;
border-radius:6px;
}
</style>
</head>

<body>

<main>

<h1>Review Your Order</h1>

<div class="section">
  <div id="items"></div>

  <div class="total">
    Total: $<span id="total">0.00</span>
  </div>
</div>

<div class="notice">
Your QR codes will be generated immediately after checkout.
</div>

<button class="checkout" onclick="submitOrder()">
Submit Order
</button>

<!-- 🔥 NEW QR DISPLAY -->
<div class="section" id="qrSection" style="display:none;">
  <h2>Your QR Codes</h2>
  <div id="qrList"></div>
</div>

</main>

<script src="https://cdn.jsdelivr.net/npm/qrcode/build/qrcode.min.js"></script>

<script>

let cart = [];

const user = JSON.parse(localStorage.getItem("vitalink_user"));
if(!user){
  window.location.href = "login.html";
}

function loadCart(){
  const saved = localStorage.getItem("vitalink_cart");
  if(saved){
    cart = JSON.parse(saved);
  }
}

function render(){

  const container = document.getElementById("items");
  container.innerHTML = "";

  let total = 0;

  cart.forEach(item => {

    total += item.price;

    container.innerHTML += `
      <div class="item">
        <span>${item.name} - ${item.profile}</span>
        <span>$${item.price.toFixed(2)}</span>
      </div>
    `;
  });

  document.getElementById("total").innerText = total.toFixed(2);
}

window.onload = function(){

  loadCart();

  if(cart.length === 0){
    alert("Your cart is empty");
    window.location.href = "shop.html";
    return;
  }

  render();
};

async function submitOrder(){

  const btn = document.querySelector(".checkout");
  btn.disabled = true;
  btn.innerText = "Processing...";

  const profileIds = cart.map(i => i.profile_id);

  const payload = {
    profiles: profileIds,
    items: cart
  };

  try{

    // 🔥 CREATE ORDER
    const res = await fetch(
      "https://vitalink-app.netlify.app/.netlify/functions/create-order",
      {
        method:"POST",
        headers:{ "Content-Type":"application/json" },
        body: JSON.stringify(payload)
      }
    );

    const data = await res.json();

    if(!data.success){
      throw new Error(data.error || "Order failed");
    }

    // 🔥 CALL GPO (THIS IS WHAT YOU WANTED)
    loadQRs(data.order_id);

  } catch(err){
    alert(err.message || "Network error");
    btn.disabled = false;
    btn.innerText = "Submit Order";
  }
}

async function loadQRs(order_id){

  const qrSection = document.getElementById("qrSection");
  const qrList = document.getElementById("qrList");

  qrSection.style.display = "block";

  try{

    const res = await fetch(
      "https://vitalink-app.netlify.app/.netlify/functions/get_pending_orders",
      {
        method:"POST",
        headers:{ "Content-Type":"application/json" },
        body: JSON.stringify({ order_id })
      }
    );

    const data = await res.json();

    if(!data.success){
      throw new Error("Failed to load QR codes");
    }

    const order = data.order;

    qrList.innerHTML = order.qr.map((q, i) => `
      <div class="qr-item">
        <span>${q.profile}</span>
        <canvas id="qr_${i}"></canvas>
      </div>
    `).join("");

    order.qr.forEach((q, i) => {
      const canvas = document.getElementById(`qr_${i}`);

      QRCode.toCanvas(canvas, q.qr_url, {
        width: 80,
        margin: 1
      });
    });

  }catch(err){
    qrList.innerHTML = `<div class="error">${err.message}</div>`;
  }
}

</script>

</body>
</html>
