<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>VitaLink Checkout</title>

<style>
:root{
--bg:#000;
--card:#111;
--text:#eaeaea;
--muted:#b5b5b5;
--accent:#7cc6e8;
--border:#1e1e1e;
}

body{
margin:0;
font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto;
background:var(--bg);
color:var(--text);
}

main{
max-width:700px;
margin:auto;
padding:40px 20px;
}

h1{
text-align:center;
margin-bottom:30px;
}

.section{
background:var(--card);
border:1px solid var(--border);
border-radius:12px;
padding:20px;
margin-bottom:20px;
}

.item{
display:flex;
justify-content:space-between;
margin-bottom:10px;
font-size:0.95rem;
}

.total{
font-size:1.3rem;
font-weight:700;
text-align:right;
margin-top:10px;
}

.notice{
font-size:0.9rem;
color:var(--muted);
margin-top:10px;
text-align:center;
}

button{
width:100%;
padding:14px;
background:var(--accent);
border:none;
border-radius:8px;
font-weight:600;
font-size:1rem;
cursor:pointer;
margin-top:20px;
}
</style>
</head>

<body>

<main>

<h1>Review Your Order</h1>

<div class="section">
  <div id="items"></div>

  <div class="total">
    Total: $<span id="total">0.00</span>
  </div>
</div>

<div class="notice">
You will confirm this order inside your VitaLink app before it is processed.
</div>

<button onclick="submitOrder()">Submit Order</button>

</main>

<script>

let cart = [];

// 🔒 REQUIRE LOGIN
const user = JSON.parse(localStorage.getItem("vitalink_user"));
if(!user){
  window.location.href = "login.html";
}

// 🔥 LOAD CART
function loadCart(){
  const saved = localStorage.getItem("vitalink_cart");
  if(saved){
    cart = JSON.parse(saved);
  }
}

// 🔥 RENDER
function render(){

  const container = document.getElementById("items");
  container.innerHTML = "";

  let total = 0;

  cart.forEach(item => {

    total += item.price;

    container.innerHTML += `
      <div class="item">
        <span>${item.name} - ${item.profile}</span>
        <span>$${item.price.toFixed(2)}</span>
      </div>
    `;
  });

  document.getElementById("total").innerText = total.toFixed(2);
}

window.onload = function(){
  loadCart();

  if(cart.length === 0){
    alert("Your cart is empty");
    window.location.href = "shop.html";
    return;
  }

  render();
};

// 🔥 SUBMIT ORDER
async function submitOrder(){

  const payload = {
    user_id: user.id,
    items: cart.map(i => ({
      product: i.name,
      price: i.price,
      profile_name: i.profile
    }))
  };

  try{

    const res = await fetch(
      "https://vitalink-app.netlify.app/.netlify/functions/create_order",
      {
        method:"POST",
        headers:{ "Content-Type":"application/json" },
        body: JSON.stringify(payload)
      }
    );

    const data = await res.json();

    if(data.success){

      localStorage.removeItem("vitalink_cart");

      alert("Order submitted! Please confirm in your app.");

      window.location.href = "shop.html";

    } else {
      alert("Order failed");
    }

  } catch(err){
    alert("Network error");
  }
}

</script>

</body>
</html>
