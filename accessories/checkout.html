<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>VitaLink Checkout</title>

<style>
:root{
--bg:#000;
--card:#111;
--text:#eaeaea;
--muted:#b5b5b5;
--accent:#7cc6e8;
--border:#1e1e1e;
}

body{
margin:0;
font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto;
background:var(--bg);
color:var(--text);
}

main{
max-width:700px;
margin:auto;
padding:40px 20px;
}

h1{
text-align:center;
margin-bottom:30px;
}

.section{
background:var(--card);
border:1px solid var(--border);
border-radius:12px;
padding:20px;
margin-bottom:20px;
}

.item{
display:flex;
justify-content:space-between;
margin-bottom:10px;
font-size:0.95rem;
}

.total{
font-size:1.3rem;
font-weight:700;
text-align:right;
margin-top:10px;
}

.notice{
font-size:0.9rem;
color:var(--muted);
margin-top:10px;
text-align:center;
}

button{
width:100%;
padding:14px;
background:var(--accent);
border:none;
border-radius:8px;
font-weight:600;
font-size:1rem;
cursor:pointer;
margin-top:20px;
}

.qr-item{
display:flex;
justify-content:space-between;
align-items:center;
margin-bottom:12px;
}

.qr-item canvas{
width:80px;
height:80px;
background:#fff;
border-radius:6px;
display:block;
border:1px solid #333;
}

.error{
color:#ff5a5a;
margin-top:10px;
}
</style>
</head>

<body>

<main>

<h1>Review Your Order</h1>

<div class="section">
  <div id="items"></div>

  <div class="total">
    Total: $<span id="total">0.00</span>
  </div>
</div>

<div class="notice">
Your QR codes will be generated immediately after checkout.
</div>

<button class="checkout" onclick="submitOrder()">
Submit Order
</button>

<div class="section" id="qrSection" style="display:none;">
  <h2>Your QR Codes</h2>
  <div id="qrList"></div>
</div>

</main>

<script src="https://cdn.jsdelivr.net/npm/qrcode/build/qrcode.min.js"></script>

<script>

let cart = [];

const user = JSON.parse(localStorage.getItem("vitalink_user"));
if(!user){
  window.location.href = "login.html";
}

function loadCart(){
  const saved = localStorage.getItem("vitalink_cart");
  if(saved){
    cart = JSON.parse(saved);
  }
}

function render(){
  const container = document.getElementById("items");
  container.innerHTML = "";

  let total = 0;

  cart.forEach(item => {
    total += item.price;

    container.innerHTML += `
      <div class="item">
        <span>${item.name}${item.profile ? " - " + item.profile : ""}</span>
        <span>$${item.price.toFixed(2)}</span>
      </div>
    `;
  });

  document.getElementById("total").innerText = total.toFixed(2);
}

/* 🔥 PLACEHOLDERS */
function renderPlaceholders(profiles){

  const qrSection = document.getElementById("qrSection");
  const qrList = document.getElementById("qrList");

  qrSection.style.display = "block";

  qrList.innerHTML = profiles.map((p, i) => `
    <div class="qr-item">
      <span>${p.name || "Profile"}</span>
      <canvas id="qr_${i}"></canvas>
    </div>
  `).join("");
}

/* 🔥 DRAW QR */
function renderQRs(profiles){

  profiles.forEach((p, i) => {

    const canvas = document.getElementById(`qr_${i}`);

    if(!canvas) return;
    if(!p.qr_token) return;

    const url = `https://myvitalink.app/emergency.html?token=${p.qr_token}`;

    QRCode.toCanvas(canvas, url, {
      width: 80,
      margin: 1
    });

  });
}

/* 🔥 FIXED LOAD */
window.onload = function(){

  loadCart();

  if(cart.length === 0){
    alert("Your cart is empty");
    window.location.href = "shop.html";
    return;
  }

  render();

  // 🔥 GET UNIQUE PROFILE UUIDS FROM CART
  const profileIds = [...new Set(
    cart.map(i => i.profile_id)
  )];

  console.log("PROFILE IDS:", profileIds);

  if(!profileIds.length){
    console.log("NO PROFILE IDS");
    return;
  }

  // 🔥 CALL BACKEND FOR CORRECT DATA
  fetch("https://vitalink-app.netlify.app/.netlify/functions/get_profiles", {
    method:"POST",
    headers:{ "Content-Type":"application/json" },
    body: JSON.stringify({ profiles: profileIds })
  })
  .then(res => res.json())
  .then(data => {

    console.log("PROFILES FROM API:", data);

    if(!data.success || !data.profiles){
      console.log("FAILED TO LOAD PROFILES");
      return;
    }

    const profiles = data.profiles;

    renderPlaceholders(profiles);
    renderQRs(profiles);

  })
  .catch(err => {
    console.error("LOAD ERROR:", err);
  });
};

async function submitOrder(){
  alert("Order submit coming next step (Stripe)");
}

</script>

</body>
</html>
