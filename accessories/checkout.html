<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>VitaLink Checkout</title>

<style>
:root{
--bg:#000;
--card:#111;
--text:#eaeaea;
--muted:#b5b5b5;
--accent:#7cc6e8;
--border:#1e1e1e;
}

body{
margin:0;
font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto;
background:var(--bg);
color:var(--text);
}

main{
max-width:700px;
margin:auto;
padding:40px 20px;
}

h1{
text-align:center;
margin-bottom:30px;
}

.section{
background:var(--card);
border:1px solid var(--border);
border-radius:12px;
padding:20px;
margin-bottom:20px;
}

.item{
display:flex;
justify-content:space-between;
margin-bottom:10px;
font-size:0.95rem;
}

.total{
font-size:1.3rem;
font-weight:700;
text-align:right;
margin-top:10px;
}

.notice{
font-size:0.9rem;
color:var(--muted);
margin-top:10px;
text-align:center;
}

button{
width:100%;
padding:14px;
background:var(--accent);
border:none;
border-radius:8px;
font-weight:600;
font-size:1rem;
cursor:pointer;
margin-top:20px;
}

/* MODAL */
.modal{
position:fixed;
top:0;
left:0;
right:0;
bottom:0;
background:rgba(0,0,0,.7);
display:none;
align-items:center;
justify-content:center;
}

.modal-content{
background:#111;
padding:20px;
border-radius:12px;
width:320px;
text-align:center;
}
</style>
</head>

<body>

<main>

<h1>Review Your Order</h1>

<div class="section">
  <div id="items"></div>

  <div class="total">
    Total: $<span id="total">0.00</span>
  </div>
</div>

<div class="notice">
Approval required in your VitaLink app to generate QR access
</div>

<button class="checkout" onclick="submitOrder()">
Submit Order
</button>

</main>

<div class="modal" id="waitingModal">
  <div class="modal-content">
    <h3>Waiting for Approval</h3>

    <p style="font-size:0.95rem; color:#ccc; line-height:1.5;">
      Check your VitaLink app to approve this request.
      <br><br>
      Once approved, your order will begin processing automatically.
    </p>

    <p style="font-size:0.9rem; color:#7cc6e8; font-weight:600;">
      This screen will update after approval.
    </p>
  </div>
</div>

<script>

let cart = [];

const user = JSON.parse(localStorage.getItem("vitalink_user"));
if(!user){
  window.location.href = "login.html";
}

function loadCart(){
  const saved = localStorage.getItem("vitalink_cart");
  if(saved){
    cart = JSON.parse(saved);
  }
}

function render(){

  const container = document.getElementById("items");
  container.innerHTML = "";

  let total = 0;

  cart.forEach(item => {

    total += item.price;

    container.innerHTML += `
      <div class="item">
        <span>${item.name} - ${item.profile}</span>
        <span>$${item.price.toFixed(2)}</span>
      </div>
    `;
  });

  document.getElementById("total").innerText = total.toFixed(2);
}

window.onload = function(){

  loadCart();

  if(cart.length === 0){
    alert("Your cart is empty");
    window.location.href = "shop.html";
    return;
  }

  render();
};

async function submitOrder(){

  const btn = document.querySelector(".checkout");
  btn.disabled = true;
  btn.innerText = "Submitting...";

  const payload = {
    user_id: user.id,
    items: cart.map(i => ({
      product: i.name,
      price: i.price,
      profile_id: i.profile_id,   // ✅ FIXED (CRITICAL)
      profile: i.profile          // optional (display only)
    }))
  };

  try{

    const res = await fetch(
      "https://vitalink-app.netlify.app/.netlify/functions/create-order-request",
      {
        method:"POST",
        headers:{ "Content-Type":"application/json" },
        body: JSON.stringify(payload)
      }
    );

    const data = await res.json();

    if(data.success){

      document.getElementById("waitingModal").style.display = "flex";

      localStorage.setItem("last_order_request", data.order_id);

    } else {
      alert("Order failed");
      btn.disabled = false;
      btn.innerText = "Submit Order";
    }

  } catch(err){
    alert("Network error");
    btn.disabled = false;
    btn.innerText = "Submit Order";
  }
}

</script>

</body>
</html>
