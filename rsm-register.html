<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>VitaLink - RSM Registration</title>

<style>
:root {
  --bg: #0c0c0c;
  --card: #111;
  --border: #1f3442;
  --text: #f4f7fb;
  --muted: #b8c3ca;
  --blue: #7cc6e8;
  --danger: #ff6b6b;
  --success: #4cd964;
}

* { box-sizing: border-box; }

body {
  margin: 0;
  min-height: 100vh;
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
  background: var(--bg);
  color: var(--text);
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 24px;
}

.card {
  width: 100%;
  max-width: 460px;
  background: var(--card);
  border: 1px solid var(--border);
  border-radius: 14px;
  padding: 34px;
  box-shadow: 0 18px 50px rgba(0,0,0,.34);
}

.eyebrow {
  color: var(--blue);
  font-size: .78rem;
  font-weight: 800;
  letter-spacing: .12em;
  text-transform: uppercase;
  margin-bottom: 10px;
}

h1 {
  margin: 0 0 10px;
  font-size: 1.8rem;
  line-height: 1.15;
}

.sub {
  margin: 0 0 26px;
  color: var(--muted);
  line-height: 1.45;
}

label {
  display: block;
  margin: 14px 0 6px;
  color: var(--muted);
  font-size: .9rem;
  font-weight: 650;
}

input {
  width: 100%;
  padding: 13px 14px;
  border-radius: 8px;
  border: 1px solid var(--border);
  background: #000;
  color: #fff;
  font-size: 1rem;
}

.password-row {
  display: flex;
  gap: 10px;
  align-items: stretch;
}

.password-row input {
  flex: 1;
  min-width: 0;
}

.toggle-password {
  width: auto;
  min-width: 76px;
  margin-top: 0;
  padding: 0 14px;
  border: 1px solid var(--border);
  border-radius: 8px;
  background: #081d2e;
  color: var(--blue);
  font-size: .9rem;
}

button {
  width: 100%;
  margin-top: 22px;
  padding: 14px 18px;
  border: 0;
  border-radius: 999px;
  background: var(--blue);
  color: #000;
  font-weight: 800;
  font-size: 1rem;
  cursor: pointer;
}

button:disabled {
  opacity: .65;
  cursor: not-allowed;
}

.message {
  margin-top: 16px;
  min-height: 22px;
  color: var(--muted);
  line-height: 1.45;
}

.error { color: var(--danger); }
.success { color: var(--success); }
.hidden { display: none; }
.pricing-note {
  margin: -10px 0 18px;
  padding: 12px 14px;
  border: 1px solid var(--border);
  border-radius: 10px;
  color: var(--muted);
  background: rgba(124,198,232,.08);
  line-height: 1.35;
}
</style>
<link rel="stylesheet" href="/typography.css">
</head>

<body>
<main class="card">
  <div class="eyebrow">VitaLink RSM Access</div>
  <h1>Create RSM Account</h1>
  <p class="sub">
    Enter the RSM creation code from your VitaLink card to create an RSM account.
  </p>
  <div id="pricingNote" class="pricing-note hidden"></div>

  <form id="rsmForm">
    <label for="creationCode">RSM Creation Code</label>
    <input id="creationCode" autocomplete="off" required />

    <label for="name">Full Name</label>
    <input id="name" autocomplete="name" required />

    <label for="email">Email</label>
    <input id="email" type="email" autocomplete="email" required />

    <label for="phone">Phone</label>
    <input id="phone" type="tel" autocomplete="tel" required />

    <label for="region">Region / Agency Name</label>
    <input id="region" autocomplete="organization" required />

    <label for="password">Create Password</label>
    <div class="password-row">
      <input id="password" type="password" autocomplete="new-password" required />
      <button class="toggle-password" type="button" data-target="password">Show</button>
    </div>

    <label for="confirmPassword">Confirm Password</label>
    <div class="password-row">
      <input id="confirmPassword" type="password" autocomplete="new-password" required />
      <button class="toggle-password" type="button" data-target="confirmPassword">Show</button>
    </div>

    <button id="submitBtn" type="submit">Create RSM Account</button>
  </form>

  <div id="message" class="message"></div>
</main>

<script>
const BACKEND = "https://vitalink-app.netlify.app/.netlify/functions";
const form = document.getElementById("rsmForm");
const button = document.getElementById("submitBtn");
const message = document.getElementById("message");
const pricingTier = new URLSearchParams(window.location.search).get("pricing") === "regular"
  ? "regular"
  : "founders";
const pricingNote = document.getElementById("pricingNote");

pricingNote.textContent = pricingTier === "regular"
  ? "Regular office pricing will apply when billing is activated."
  : "Founders office pricing will apply when billing is activated.";
pricingNote.classList.remove("hidden");

function setMessage(text, type) {
  message.textContent = text || "";
  message.className = "message";
  if (type) message.classList.add(type);
}

document.querySelectorAll(".toggle-password").forEach(function (toggle) {
  toggle.addEventListener("click", function () {
    const input = document.getElementById(toggle.dataset.target);
    const showing = input.type === "text";

    input.type = showing ? "password" : "text";
    toggle.textContent = showing ? "Show" : "Hide";
  });
});

form.addEventListener("submit", async function (event) {
  event.preventDefault();

  const payload = {
    creationCode: document.getElementById("creationCode").value.trim(),
    name: document.getElementById("name").value.trim(),
    email: document.getElementById("email").value.trim(),
    phone: document.getElementById("phone").value.trim(),
    region: document.getElementById("region").value.trim(),
    password: document.getElementById("password").value,
    pricingTier,
  };

  const confirmPassword = document.getElementById("confirmPassword").value;

  if (payload.password.length < 8) {
    setMessage("Password must be at least 8 characters.", "error");
    return;
  }

  if (payload.password !== confirmPassword) {
    setMessage("Passwords do not match.", "error");
    return;
  }

  button.disabled = true;
  setMessage("Creating RSM account...");

  try {
    const res = await fetch(`${BACKEND}/rsm-register`, {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify(payload)
    });

    const data = await res.json().catch(() => ({}));

    if (!res.ok || data.success !== true) {
      setMessage(data.error || "Unable to create RSM account.", "error");
      return;
    }

    setMessage("RSM account created. Redirecting to login...", "success");

    setTimeout(function () {
      window.location.href = "/core-node/rsm_login.html";
    }, 1800);
  } catch {
    setMessage("Server error.", "error");
  } finally {
    button.disabled = false;
  }
});
</script>

<script src="site-traffic.js" defer></script>
</body>
</html>
