<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>VitaLink Agent Portal Activation</title>
<meta name="robots" content="noindex, nofollow" />
<link rel="canonical" href="https://myvitalink.app/agent-portal-activation">
<style>
:root{
--bg-black:#000000;
--text-primary:#eaeaea;
--text-muted:#b5b5b5;
--accent-blue:#7cc6e8;
--divider:#1e1e1e;
}
*{box-sizing:border-box;}
body{
margin:0;
font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
background:var(--bg-black);
color:var(--text-primary);
line-height:1.6;
}
main{
min-height:100vh;
max-width:680px;
margin:0 auto;
padding:70px 24px;
display:flex;
align-items:center;
justify-content:center;
text-align:center;
}
.panel{
width:100%;
padding:34px 24px;
background:linear-gradient(180deg, #111 0%, #0c0c0c 100%);
border:1px solid var(--divider);
border-radius:14px;
box-shadow:0 0 0 1px rgba(124,198,232,0.08), 0 10px 28px rgba(0,0,0,0.65);
}
.logo{
max-width:330px;
width:100%;
margin:0 auto 28px auto;
display:block;
filter:
drop-shadow(0 0 12px rgba(124,198,232,0.35))
drop-shadow(0 0 30px rgba(124,198,232,0.15));
}
h1{
font-size:2rem;
margin:0 0 12px 0;
}
p{
color:#d0d0d0;
font-size:1.08rem;
margin:0 auto 22px auto;
max-width:520px;
}
a.activation-button{
display:inline-block;
width:100%;
max-width:320px;
margin:4px auto 0 auto;
padding:15px 28px;
font-size:1.08rem;
font-weight:700;
background:var(--accent-blue);
color:#000;
border-radius:8px;
border:none;
cursor:pointer;
text-decoration:none;
}
a.activation-button:hover{opacity:.9;}
.status{
color:#a8a8a8;
font-size:.95rem;
margin-top:18px;
min-height:1.4em;
}
</style>
<link rel="stylesheet" href="typography.css">
</head>
<body>
<main>
  <section class="panel">
    <img src="images/vitalink-logo.png" alt="VitaLink" class="logo">
    <h1>Agent Portal Activation</h1>
    <p>Activate your VitaLink agent account before returning to the app.</p>
    <a class="activation-button" href="agent-access.html">Activate Agent Portal</a>
    <div class="status" id="activationStatus"></div>
  </section>
</main>

<script src="site-traffic.js" defer></script>
</body>
</html>
